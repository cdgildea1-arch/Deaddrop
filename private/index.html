<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Private Archive</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#181310;color:#f5e9dc;font:16px system-ui,sans-serif}
main{width:min(100% - 36px,420px);margin:max(9vh,40px) auto;padding:24px;border:1px solid #816853;border-radius:20px;background:#281e19}
h1{margin:0 0 18px;font:700 38px Georgia,serif}
label{display:grid;gap:8px}
input,button{font:inherit;border-radius:9px;padding:11px;min-height:44px}
input{min-width:0;border:1px solid #967d68;background:#1e1713;color:inherit}
button{border:0;background:#e4c29e;color:#281d16;font-weight:700;margin-top:12px}
#status:empty{display:none}
iframe{display:block;position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#181310}
</style>
<script type="module" src="./archive.mjs?v=reading-room"></script>
</head>
<body>
<main id="gate">
 <h1>Private Archive</h1>
 <form id="form" hidden>
  <label>Email address<input id="email" type="email" autocomplete="email" required></label>
  <button type="submit">Email me a sign-in link</button>
 </form>
 <p id="status" role="status">Checking access…</p>
 <button id="signout" type="button" hidden>Sign out</button>
</main>
<iframe id="archive" title="Private Archive" hidden sandbox="allow-same-origin allow-scripts allow-forms allow-modals allow-downloads allow-top-navigation-by-user-activation"></iframe>
</body>
</html>
