<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>The Penguin Archive</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: #14100c; color: #ecdfc8; font-family: -apple-system, sans-serif; }

  #gate {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    padding-bottom: max(30px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .emblem { font-size: 44px; margin-bottom: 16px; opacity: 0.9; letter-spacing: 10px; }
  h1.title { font-size: 22px; font-weight: 600; margin-bottom: 6px; letter-spacing: 0.4px; font-family: Georgia, serif; }
  .subtitle { font-size: 13px; color: #a3906e; margin-bottom: 28px; max-width: 280px; line-height: 1.5; font-style: italic; }
  input {
    width: 100%; max-width: 280px;
    background: #241d15;
    border: 1px solid #4a3c28;
    color: #ecdfc8;
    border-radius: 10px;
    padding: 13px 14px;
    font-size: 16px;
    margin-bottom: 14px;
    text-align: center;
    display: block;
  }
  input::placeholder { color: #8a7355; }
  button {
    background: #b8895a;
    color: #14100c;
    border: none;
    border-radius: 10px;
    padding: 13px 34px;
    font-size: 15px;
    font-weight: 700;
    display: block;
    margin: 0 auto;
  }
  #error { color: #d17a6a; font-size: 12px; margin-top: 10px; min-height: 16px; }

  #content {
    display: none;
    white-space: pre-wrap;
    max-width: 700px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    line-height: 1.6;
    font-family: Georgia, serif;
  }
  #content h1, #content h2 { font-weight: normal; text-align: center; letter-spacing: 1px; }
  #content h1 { font-size: 2rem; color: #f4ead0; margin-bottom: 10px; }
  #content h2 { font-size: 1.1rem; font-style: italic; color: #a3906e; margin-top: 0; margin-bottom: 30px; }
  #content .emblem { font-size: 2.4rem; letter-spacing: 14px; text-align: center; margin-bottom: 14px; opacity: 1; }
  #content .divider { width: 60px; height: 1px; background: #4a3c28; margin: 0 auto 30px; }

  #continueLink { display: none; text-align: center; margin: 0 0 60px; }
  #continueLink a {
    display: inline-block;
    font-size: 1.8rem;
    color: #b8895a;
    text-decoration: none;
    border: 1px solid #4a3c28;
    border-radius: 50%;
    width: 52px;
    height: 52px;
    line-height: 48px;
  }
</style>
</head>
<body>

<div id="gate">
  <div class="emblem">🧁🐧</div>
  <h1 class="title">The Archive</h1>
  <p class="subtitle">a private correspondence, kept</p>
  <input id="passphrase" type="password" placeholder="Passphrase" onkeydown="if(event.key==='Enter') unlock()">
  <button onclick="unlock()">Unlock</button>
  <div id="error"></div>
</div>

<div id="content"></div>
<div id="continueLink">
  <a href="hub.html">→</a>
</div>

<script>
const SUPABASE_URL = 'https://lecudeiafwhyhufceurv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Q9ESUnHKw3-FPpGeTYRfSA_4sg55UMD';

function fromBase64(str) {
  return Uint8Array.from(atob(str), c => c.charCodeAt(0));
}

async function deriveKey(passphrase, saltBytes) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBytes, iterations: 250000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function unlock() {
  const errorDiv = document.getElementById('error');
  const passphrase = document.getElementById('passphrase').value;
  errorDiv.textContent = '';

  if (!passphrase) {
    errorDiv.textContent = 'Enter a passphrase.';
    return;
  }

  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/archive?select=*&order=created_at.desc&limit=1`,
      {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        }
      }
    );

    const rows = await res.json();
    if (!rows || rows.length === 0) {
      errorDiv.textContent = 'No archive content found.';
      return;
    }

    const row = rows[0];
    const salt = fromBase64(row.salt);
    const iv = fromBase64(row.iv);
    const ciphertext = fromBase64(row.ciphertext);

    const key = await deriveKey(passphrase, salt);

    const decryptedBuf = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv }, key, ciphertext
    );

    const dec = new TextDecoder();
    const text = dec.decode(decryptedBuf);

    document.getElementById('content').innerHTML = text;
    document.getElementById('continueLink').style.display = 'block';
    document.getElementById('content').style.display = 'block';
    document.getElementById('gate').style.display = 'none';
  } catch (e) {
    errorDiv.textContent = 'Wrong passphrase, or content unavailable.';
  }
}
</script>
</body>
</html>
