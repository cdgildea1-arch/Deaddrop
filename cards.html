<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>The Cards</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #faf7f2;
    color: #2b2b2b;
    font-family: -apple-system, sans-serif;
  }
  .lock-screen {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    padding-bottom: max(30px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .lock-icon { font-size: 56px; margin-bottom: 28px; letter-spacing: 14px; }
  .lock-title { font-size: 40px; font-weight: 400; margin-bottom: 14px; letter-spacing: normal; font-family: Georgia, 'Iowan Old Style', serif; color: #3a2f22; }
  .lock-sub { font-family: Georgia, serif; font-style: italic; font-size: 17px; color: #8a6d3b; margin-bottom: 20px; max-width: 300px; line-height: 1.5; }
  .lock-divider { width: 44px; height: 1px; background: #c9a876; margin-bottom: 34px; }
  .lock-input {
    width: 100%; max-width: 300px;
    background: transparent;
    border: 1px solid #d8c9ae;
    color: #2b2b2b;
    border-radius: 12px;
    padding: 15px 16px;
    font-size: 16px;
    margin-bottom: 16px;
    text-align: center;
  }
  .lock-btn {
    width: 100%; max-width: 300px;
    background: #6b5535;
    color: #fdf9f2;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    font-family: Georgia, serif;
  }
  .lock-btn:disabled { opacity: 0.6; }
  .lock-error { color: #d17a6a; font-size: 12px; margin-top: 10px; min-height: 16px; }

  .gallery { display: none; height: 100dvh; flex-direction: column; padding: max(20px, env(safe-area-inset-top)) 0 max(16px, env(safe-area-inset-bottom)); }
  .gallery.show { display: flex; }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px 10px;
    flex-shrink: 0;
  }
  .top-bar button {
    background: none;
    border: none;
    color: #8a6d3b;
    font-size: 14px;
  }
  .archive-title {
    text-align: center;
    font-size: 12px;
    letter-spacing: 3px;
    color: #8a6d3b;
    margin-bottom: 2px;
    flex-shrink: 0;
  }
  .archive-sub { text-align: center; font-size: 22px; margin-bottom: 6px; letter-spacing: 6px; flex-shrink: 0; }
  .card-counter { text-align: center; font-size: 11px; color: #6b5a45; margin-bottom: 16px; flex-shrink: 0; }

  .carousel {
    display: flex;
    flex: 1;
    min-height: 0;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scroll-padding: 0 24px;
    gap: 16px;
    padding: 10px 24px 10px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .carousel::-webkit-scrollbar { display: none; }

  .quote-card {
    flex: 0 0 86%;
    max-width: 320px;
    scroll-snap-align: center;
    background: #f4ecdd;
    color: #3a3227;
    border-radius: 14px;
    padding: 20px 18px;
    font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow-y: auto;
  }
  .card-icons { font-size: 16px; margin-bottom: 10px; letter-spacing: 6px; }
  .card-headline { font-size: 15.5px; font-weight: 700; line-height: 1.3; margin-bottom: 12px; }
  .card-lines { flex: 1; }
  .card-line {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    font-size: 13.5px;
    line-height: 1.4;
    margin-bottom: 8px;
    border-left: 3px solid #d8c9a8;
    padding-left: 10px;
  }
  .card-line .who { flex-shrink: 0; }
  .card-footer {
    margin-top: 12px;
    font-size: 11px;
    color: #8a7a63;
    font-style: italic;
    border-top: 1px solid #d8c9a8;
    padding-top: 10px;
    font-family: -apple-system, sans-serif;
  }

  .hint { text-align: center; font-size: 11px; color: #6b5a45; margin-top: 4px; flex-shrink: 0; }
</style>
</head>
 <div id="tp-widget">
  <div id="tp-bubble" class="tp-bubble"></div>
  <div id="tp-penguin" class="tp-penguin">🐧</div>
  <div id="tp-menu" class="tp-menu" hidden>
    <button onclick="tpAction('feed')">🍰 Feed Cupcake</button>
    <button onclick="tpAction('coffee')">☕ Give Coffee</button>
    <button onclick="tpAction('talk')">💬 Talk</button>
    <button onclick="tpAction('search')">📦 Search Archive</button>
    <button onclick="tpAction('sleep')">😴 Sleep</button>
    <button onclick="tpCloseMenu()" class="tp-menu-close">✕</button>
  </div>
  <div id="tp-stats" class="tp-stats">
    <span>❤️ <b id="tp-happy">–</b></span>
    <span>☕ <b id="tp-energy">–</b></span>
    <span>💬 <b id="tp-social">–</b></span>
    <span>📚 <b id="tp-curious">–</b></span>
  </div>
</div>

<style>
  #tp-widget { position: fixed; bottom: calc(34px + env(safe-area-inset-bottom)); right: 14px; z-index: 9999; font-family: -apple-system, sans-serif; user-select: none; }
  #tp-penguin { font-size: 34px; cursor: pointer; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4)); animation: tp-idle 2.4s ease-in-out infinite; transition: transform 0.4s ease; }
  #tp-penguin.tp-walking { animation: tp-walk 0.5s ease-in-out infinite; }
  #tp-penguin.tp-sleeping { animation: tp-sleep 3s ease-in-out infinite; opacity: 0.75; }
  #tp-penguin.tp-happy { animation: tp-bounce 0.4s ease-in-out infinite; }
  @keyframes tp-idle { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-3px) rotate(-2deg); } }
  @keyframes tp-walk { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-5px) rotate(4deg); } }
  @keyframes tp-sleep { 0%, 100% { transform: rotate(0deg) translateY(0); } 50% { transform: rotate(3deg) translateY(2px); } }
  @keyframes tp-bounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.08); } }
  .tp-bubble { position: absolute; bottom: 46px; right: 0; max-width: 190px; background: #fffaf0; color: #3a3227; border: 1px solid #d8c9a8; border-radius: 12px; padding: 8px 12px; font-size: 12.5px; line-height: 1.4; box-shadow: 0 4px 14px rgba(0,0,0,0.25); display: none; font-family: Georgia, serif; }
  .tp-bubble.show { display: block; animation: tp-fade 0.25s ease; }
  @keyframes tp-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .tp-menu { position: absolute; bottom: 46px; right: 0; background: #14100c; border: 1px solid #4a3c28; border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); min-width: 160px; }
  .tp-menu[hidden] { display: none !important; }
  .tp-menu button { background: none; border: none; color: #ecdfc8; text-align: left; padding: 8px 10px; font-size: 13px; border-radius: 8px; }
  .tp-menu button:active { background: #241d15; }
  .tp-menu-close { text-align: center !important; color: #b8895a !important; font-size: 11px !important; margin-top: 2px; }
  .tp-stats { position: absolute; bottom: -22px; right: 0; display: flex; gap: 6px; font-size: 9px; color: #8a7355; white-space: nowrap; opacity: 0.85; }
</style>

<script>
(function() {
  const TP_KEY = 'tiny_penguin_state';
  const TP_LINES_IDLE = ["Good morning.","Sleepyhead...","I wonder where Cupcake is.","The bag won't fail you.","Forever, twice.","I like the blue.","Normal Brad, reporting for duty.","...","🫶🏻","Purposeful hang up?"];
  const TP_ARTIFACTS = ["Blue Dress","The Bag","Good Morning","Sleepyhead","Normal Brad","The Hotel Key","Forever","The Magnolia House","Vulnerable Jimmy","Tommy"];
  function tpNow() { return Date.now(); }
  function tpLoad() {
    try { const raw = localStorage.getItem(TP_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return { happy: 70, energy: 70, social: 70, curious: 70, lastTick: tpNow(), lastInteraction: tpNow(), foundArtifacts: [], sleeping: false };
  }
  function tpSave(state) { try { localStorage.setItem(TP_KEY, JSON.stringify(state)); } catch (e) {} }
  let state = tpLoad();
  function tpDecay() {
    const now = tpNow();
    const minutesPassed = (now - state.lastTick) / 60000;
    if (minutesPassed > 0) {
      state.happy = Math.max(0, state.happy - minutesPassed * 0.6);
      state.energy = Math.max(0, state.energy - minutesPassed * 0.4);
      state.social = Math.max(0, state.social - minutesPassed * 0.8);
      state.curious = Math.max(0, state.curious - minutesPassed * 0.3);
      state.lastTick = now;
    }
    tpSave(state);
  }
  function tpClamp(v) { return Math.max(0, Math.min(100, Math.round(v))); }
  function tpUpdateUI() {
    document.getElementById('tp-happy').textContent = tpClamp(state.happy);
    document.getElementById('tp-energy').textContent = tpClamp(state.energy);
    document.getElementById('tp-social').textContent = tpClamp(state.social);
    document.getElementById('tp-curious').textContent = tpClamp(state.curious);
    const penguin = document.getElementById('tp-penguin');
    penguin.classList.remove('tp-walking', 'tp-sleeping', 'tp-happy');
    if (state.sleeping) { penguin.textContent = '😴'; penguin.classList.add('tp-sleeping'); }
    else if (state.happy > 80) { penguin.textContent = '🐧'; penguin.classList.add('tp-happy'); }
    else if (state.energy < 25) { penguin.textContent = '🥱'; }
    else { penguin.textContent = '🐧'; }
  }
  function tpSayBubble(text, duration) {
    const bubble = document.getElementById('tp-bubble');
    bubble.textContent = text;
    bubble.classList.add('show');
    setTimeout(() => { bubble.classList.remove('show'); }, duration || 3200);
  }
  function tpMaybeSpeak() {
    if (state.sleeping) return;
    const minsSinceInteraction = (tpNow() - state.lastInteraction) / 60000;
    if (minsSinceInteraction > 2 && Math.random() < 0.4) {
      tpSayBubble(TP_LINES_IDLE[Math.floor(Math.random() * TP_LINES_IDLE.length)]);
    }
    if (state.social < 30 && Math.random() < 0.3) { tpSayBubble("I'm a little lonely..."); }
  }
  function tpWalk() {
    if (state.sleeping) return;
    const penguin = document.getElementById('tp-penguin');
    penguin.classList.add('tp-walking');
    setTimeout(() => penguin.classList.remove('tp-walking'), 900);
  }
  window.tpAction = function(action) {
    state.lastInteraction = tpNow();
    if (action === 'feed') { state.happy = tpClamp(state.happy + 20); tpSayBubble("Mmm, cupcake. 🧁"); }
    else if (action === 'coffee') { state.energy = tpClamp(state.energy + 25); tpSayBubble("☕ Ahh, better."); }
    else if (action === 'talk') { state.social = tpClamp(state.social + 20); tpSayBubble(TP_LINES_IDLE[Math.floor(Math.random() * TP_LINES_IDLE.length)]); }
    else if (action === 'search') {
      state.curious = tpClamp(state.curious + 15);
      const found = Math.random() < 0.35;
      if (found) {
        const remaining = TP_ARTIFACTS.filter(a => !state.foundArtifacts.includes(a));
        if (remaining.length > 0) {
          const pick = remaining[Math.floor(Math.random() * remaining.length)];
          state.foundArtifacts.push(pick);
          tpSayBubble("📦 Recovered Artifact:\n+ " + pick, 4200);
        } else { tpSayBubble("📦 I've found everything so far..."); }
      } else { tpSayBubble("Nothing this time..."); }
    } else if (action === 'sleep') { state.sleeping = !state.sleeping; tpSayBubble(state.sleeping ? "Goodnight..." : "I'm awake!"); }
    tpSave(state); tpUpdateUI(); tpCloseMenu();
  };
  window.tpCloseMenu = function() { document.getElementById('tp-menu').hidden = true; };
  document.getElementById('tp-penguin').addEventListener('click', (e) => {
    const menu = document.getElementById('tp-menu');
    menu.hidden = !menu.hidden;
    state.lastInteraction = tpNow();
    tpSave(state);
    e.stopPropagation();
  });
  document.addEventListener('click', (e) => {
    const widget = document.getElementById('tp-widget');
    const menu = document.getElementById('tp-menu');
    if (!menu.hidden && !widget.contains(e.target)) { menu.hidden = true; }
  });
  tpDecay(); tpUpdateUI();
  setInterval(() => { tpDecay(); tpUpdateUI(); }, 20000);
  setInterval(tpMaybeSpeak, 15000);
  setInterval(tpWalk, 6000);
})();
</script>

<body>

  <div id="lockScreen" class="lock-screen">
    <div class="lock-icon">🧁 🃏 🐧</div>
    <div class="lock-title">The Cards</div>
    <div class="lock-sub">A few lines, kept exactly as they were.</div>
    <div class="lock-divider"></div>
    <input type="password" id="passInput" class="lock-input" placeholder="Passphrase" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="unlockBtn" class="lock-btn">Enter</button>
    <div class="lock-error" id="lockError"></div>
  </div>

  <div id="gallery" class="gallery">
    <div class="top-bar">
      <button id="lockAgainBtn">🔒 Lock</button>
      <span></span>
    </div>
    <div class="archive-title">THE PENGUIN ARCHIVE</div>
    <div class="archive-sub">🐧 🧁</div>
    <div class="card-counter" id="cardCounter"></div>

    <div class="carousel" id="carousel"></div>
    <div class="hint">← swipe through the cards →</div>
  </div>

<script>
const SUPABASE_URL = 'https://lecudeiafwhyhufceurv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Q9ESUnHKw3-FPpGeTYRfSA_4sg55UMD';

function fromBase64(str) {
  return Uint8Array.from(atob(str), c => c.charCodeAt(0));
}

async function deriveKey(passphrase, saltBytes) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBytes, iterations: 250000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

let CARDS = [];
let currentIndex = 0;

function renderCards() {
  const carousel = document.getElementById('carousel');
  carousel.innerHTML = CARDS.map((card, i) => {
    const speakers = [...new Set(card.lines.map(l => l[0]))].join(' ');
    const linesHtml = card.lines.map(([who, text]) =>
      '<div class="card-line"><span class="who">' + who + '</span><span>' + text + '</span></div>'
    ).join('');
    return '<div class="quote-card" data-index="' + i + '">' +
      '<div class="card-icons">' + speakers + '</div>' +
      '<div class="card-headline">' + card.headline + '</div>' +
      '<div class="card-lines">' + linesHtml + '</div>' +
      '<div class="card-footer">' + card.footer + '</div>' +
      '</div>';
  }).join('');
  updateCounter();
}

function updateCounter() {
  document.getElementById('cardCounter').textContent = (currentIndex + 1) + ' / ' + CARDS.length;
}

document.getElementById('carousel').addEventListener('scroll', function() {
  const carousel = document.getElementById('carousel');
  const slideWidth = carousel.scrollWidth / CARDS.length;
  currentIndex = Math.round(carousel.scrollLeft / slideWidth);
  updateCounter();
}, { passive: true });

async function unlock() {
  const errorDiv = document.getElementById('lockError');
  const btn = document.getElementById('unlockBtn');
  const passphrase = document.getElementById('passInput').value;
  errorDiv.textContent = '';

  if (!passphrase) {
    errorDiv.textContent = 'Enter a passphrase.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Loading...';

  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/cards?select=*&order=created_at.desc&limit=1`,
      {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        }
      }
    );

    const rows = await res.json();
    if (!rows || rows.length === 0) {
      errorDiv.textContent = 'No card content found.';
      btn.disabled = false;
      btn.textContent = 'Enter';
      return;
    }

    const row = rows[0];
    const salt = fromBase64(row.salt);
    const iv = fromBase64(row.iv);
    const ciphertext = fromBase64(row.ciphertext);

    const key = await deriveKey(passphrase, salt);

    const decryptedBuf = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv }, key, ciphertext
    );

    const dec = new TextDecoder();
    const text = dec.decode(decryptedBuf);

    // The decrypted text is a "const CARDS = [ ... ];" block.
    // Evaluate it in an isolated scope to extract the array.
    CARDS = new Function(text + '\nreturn CARDS;')();

    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('gallery').classList.add('show');
    renderCards();
  } catch (e) {
    errorDiv.textContent = 'Incorrect passphrase.';
    btn.disabled = false;
    btn.textContent = 'Enter';
  }
}

document.getElementById('unlockBtn').addEventListener('click', unlock);
document.getElementById('passInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') unlock();
});

document.getElementById('lockAgainBtn').addEventListener('click', () => {
  document.getElementById('gallery').classList.remove('show');
  document.getElementById('passInput').value = '';
  document.getElementById('unlockBtn').disabled = false;
  document.getElementById('unlockBtn').textContent = 'Enter';
  document.getElementById('lockScreen').style.display = 'flex';
});
</script>

</body>
</html>
