<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>The Archive</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #14100c;
    color: #ecdfc8;
    font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  }
  .lock-screen {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    padding-bottom: max(30px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .lock-icon { font-size: 44px; margin-bottom: 16px; opacity: 0.9; }
  .lock-title { font-size: 22px; font-weight: 600; margin-bottom: 6px; letter-spacing: 0.4px; }
  .lock-sub { font-size: 13px; color: #a3906e; margin-bottom: 28px; max-width: 280px; line-height: 1.5; font-family: -apple-system, sans-serif; }
  .lock-input {
    width: 100%; max-width: 280px;
    background: #241d15;
    border: 1px solid #4a3c28;
    color: #ecdfc8;
    border-radius: 10px;
    padding: 13px 14px;
    font-size: 16px;
    margin-bottom: 14px;
    text-align: center;
    font-family: -apple-system, sans-serif;
  }
  .lock-btn {
    background: #b8895a;
    color: #14100c;
    border: none;
    border-radius: 10px;
    padding: 13px 34px;
    font-size: 15px;
    font-weight: 700;
    font-family: -apple-system, sans-serif;
  }
  .lock-error { color: #d17a6a; font-size: 12px; margin-top: 10px; min-height: 16px; font-family: -apple-system, sans-serif; }

  .cabinet {
    display: none;
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px calc(30px + env(safe-area-inset-bottom));
  }
  .cabinet.show { display: block; }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: max(6px, env(safe-area-inset-top)) 0 18px;
    font-family: -apple-system, sans-serif;
  }
  .top-bar button {
    background: none;
    border: none;
    color: #b8895a;
    font-size: 14px;
  }
  .archive-title {
    text-align: center;
    font-size: 12px;
    letter-spacing: 3px;
    color: #b8895a;
    margin-bottom: 2px;
    font-family: -apple-system, sans-serif;
  }
  .archive-sub {
    text-align: center;
    font-size: 22px;
    margin-bottom: 26px;
    letter-spacing: 6px;
  }

  .box-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .box-card {
    background: linear-gradient(160deg, #241d15, #1a1510);
    border: 1px solid #4a3c28;
    border-radius: 14px;
    padding: 18px 14px;
    text-align: center;
  }
  .box-num { font-size: 10px; letter-spacing: 2px; color: #8a7355; font-family: -apple-system, sans-serif; margin-bottom: 6px; }
  .box-icon { font-size: 26px; margin-bottom: 8px; }
  .box-part-title { font-size: 14px; font-weight: 600; color: #ecdfc8; margin-bottom: 4px; }
  .box-count { font-size: 11px; color: #8a7355; font-family: -apple-system, sans-serif; }

  .folder-list { display: none; }
  .folder-list.show { display: block; }
  .folder-item {
    background: #1c1710;
    border: 1px solid #3a2f20;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .folder-title { font-size: 15px; font-weight: 600; color: #ecdfc8; margin-bottom: 2px; }
  .folder-date { font-size: 11px; color: #8a7355; font-family: -apple-system, sans-serif; margin-bottom: 0; }

  .reader-view { display: none; }
  .reader-view.show { display: block; }
  .reader-title { font-size: 19px; font-weight: 600; margin-bottom: 2px; color: #ecdfc8; }
  .reader-date { font-size: 12px; color: #8a7355; font-family: -apple-system, sans-serif; margin-bottom: 20px; }
  .reader-view p { font-size: 16px; line-height: 1.7; margin: 0 0 16px; }
  .reader-view p.note { color: #b39a72; font-style: italic; font-size: 14px; border-top: 1px solid #3a2f20; padding-top: 14px; margin-top: 20px; }

  .back-link {
    display: inline-block;
    margin-bottom: 16px;
    color: #b8895a;
    font-size: 13px;
    font-family: -apple-system, sans-serif;
    background: none;
    border: none;
    padding: 0;
  }
</style>
</head>
<body>

  <div id="lockScreen" class="lock-screen">
    <div class="lock-icon">🗄️</div>
    <div class="lock-title">The Archive</div>
    <div class="lock-sub">Reading Room D. Enter the passphrase to browse the boxes.</div>
    <input type="password" id="passInput" class="lock-input" placeholder="Passphrase">
    <button id="unlockBtn" class="lock-btn">Enter</button>
    <div class="lock-error" id="lockError"></div>
  </div>

  <div id="cabinet" class="cabinet">
    <div class="top-bar">
      <button id="lockAgainBtn">🔒 Lock</button>
      <span></span>
    </div>
    <div class="archive-title">THE PENGUIN ARCHIVE</div>
    <div class="archive-sub">🐧 🧁</div>

    <div id="boxView">
      <div class="box-grid" id="boxGrid"></div>
    </div>

    <div id="folderView" class="folder-list">
      <button class="back-link" id="backToBoxes">← All Boxes</button>
      <div class="archive-sub" id="folderViewTitle" style="font-size:18px; letter-spacing:1px; margin-bottom:16px;"></div>
      <div id="folderListInner"></div>
    </div>

    <div id="readerView" class="reader-view">
      <button class="back-link" id="backToFolders">← Back</button>
      <div class="reader-title" id="readerTitle"></div>
      <div class="reader-date" id="readerDate"></div>
      <div id="readerBody"></div>
    </div>
  </div>
