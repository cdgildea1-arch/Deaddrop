<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>The Archive</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #14100c;
    color: #ecdfc8;
    font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  }
  .lock-screen {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    padding-bottom: max(30px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .lock-icon { font-size: 44px; margin-bottom: 16px; opacity: 0.9; }
  .lock-title { font-size: 22px; font-weight: 600; margin-bottom: 6px; letter-spacing: 0.4px; }
  .lock-sub { font-size: 13px; color: #a3906e; margin-bottom: 28px; max-width: 280px; line-height: 1.5; font-family: -apple-system, sans-serif; }
  .lock-input {
    width: 100%; max-width: 280px;
    background: #241d15;
    border: 1px solid #4a3c28;
    color: #ecdfc8;
    border-radius: 10px;
    padding: 13px 14px;
    font-size: 16px;
    margin-bottom: 14px;
    text-align: center;
    font-family: -apple-system, sans-serif;
  }
  .lock-btn {
    background: #b8895a;
    color: #14100c;
    border: none;
    border-radius: 10px;
    padding: 13px 34px;
    font-size: 15px;
    font-weight: 700;
    font-family: -apple-system, sans-serif;
  }
  .lock-error { color: #d17a6a; font-size: 12px; margin-top: 10px; min-height: 16px; font-family: -apple-system, sans-serif; }

  .cabinet {
    display: none;
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px calc(30px + env(safe-area-inset-bottom));
  }
  .cabinet.show { display: block; }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: max(6px, env(safe-area-inset-top)) 0 18px;
    font-family: -apple-system, sans-serif;
  }
  .top-bar button {
    background: none;
    border: none;
    color: #b8895a;
    font-size: 14px;
  }
  .archive-title {
    text-align: center;
    font-size: 12px;
    letter-spacing: 3px;
    color: #b8895a;
    margin-bottom: 2px;
    font-family: -apple-system, sans-serif;
  }
  .archive-sub {
    text-align: center;
    font-size: 22px;
    margin-bottom: 26px;
    letter-spacing: 6px;
  }

  .box-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .box-card {
    background: linear-gradient(160deg, #241d15, #1a1510);
    border: 1px solid #4a3c28;
    border-radius: 14px;
    padding: 18px 14px;
    text-align: center;
  }
  .box-num { font-size: 10px; letter-spacing: 2px; color: #8a7355; font-family: -apple-system, sans-serif; margin-bottom: 6px; }
  .box-icon { font-size: 26px; margin-bottom: 8px; }
  .box-part-title { font-size: 14px; font-weight: 600; color: #ecdfc8; margin-bottom: 4px; }
  .box-count { font-size: 11px; color: #8a7355; font-family: -apple-system, sans-serif; }

  .folder-list { display: none; }
  .folder-list.show { display: block; }
  .folder-item {
    background: #1c1710;
    border: 1px solid #3a2f20;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .folder-title { font-size: 15px; font-weight: 600; color: #ecdfc8; margin-bottom: 2px; }
  .folder-date { font-size: 11px; color: #8a7355; font-family: -apple-system, sans-serif; margin-bottom: 0; }

  .reader-view { display: none; }
  .reader-view.show { display: block; }
  .reader-title { font-size: 19px; font-weight: 600; margin-bottom: 2px; color: #ecdfc8; }
  .reader-date { font-size: 12px; color: #8a7355; font-family: -apple-system, sans-serif; margin-bottom: 20px; }
  .reader-view p { font-size: 16px; line-height: 1.7; margin: 0 0 16px; }
  .reader-view p.note { color: #b39a72; font-style: italic; font-size: 14px; border-top: 1px solid #3a2f20; padding-top: 14px; margin-top: 20px; }

  .back-link {
    display: inline-block;
    margin-bottom: 16px;
    color: #b8895a;
    font-size: 13px;
    font-family: -apple-system, sans-serif;
    background: none;
    border: none;
    padding: 0;
  }
</style>
</head>
<body>

  <div id="lockScreen" class="lock-screen">
    <div class="lock-icon">🗄️</div>
    <div class="lock-title">The Archive</div>
    <div class="lock-sub">Reading Room D. Enter the passphrase to browse the boxes.</div>
    <input type="password" id="passInput" class="lock-input" placeholder="Passphrase">
    <button id="unlockBtn" class="lock-btn">Enter</button>
    <div class="lock-error" id="lockError"></div>
  </div>

  <div id="cabinet" class="cabinet">
    <div class="top-bar">
      <button id="lockAgainBtn">🔒 Lock</button>
      <span></span>
    </div>
    <div class="archive-title">THE PENGUIN ARCHIVE</div>
    <div class="archive-sub">🐧 🧁</div>

    <div id="boxView">
      <div class="box-grid" id="boxGrid"></div>
    </div>

    <div id="folderView" class="folder-list">
      <button class="back-link" id="backToBoxes">← All Boxes</button>
      <div class="archive-sub" id="folderViewTitle" style="font-size:18px; letter-spacing:1px; margin-bottom:16px;"></div>
      <div id="folderListInner"></div>
    </div>

    <div id="readerView" class="reader-view">
      <button class="back-link" id="backToFolders">← Back</button>
      <div class="reader-title" id="readerTitle"></div>
      <div class="reader-date" id="readerDate"></div>
      <div id="readerBody"></div>
    </div>
  </div>

<script>
const PASSWORD_HASH = "d3751713c53e48c22f124ab0e433c4d1e1d22f58456fa8fac2b77bbe71af6c8c"; // "cupcake"

async function sha256(text) {
  const enc = new TextEncoder().encode(text);
  const hashBuffer = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

const BOXES = [
  {
    icon: "🐧", title: "Contact",
    folders: [
      { title: "The Record Begins", date: "11–13 June 2024", body: [
        "The recovered correspondence begins mid-conversation. No introduction, no context establishing the participants' names, circumstances, or relationship to one another.",
        "🧁: Good morning.",
        "🧁: It's okay. If I was there with my arms around you, everything would be okay. We can agree on that. No more seeing things.",
        "🐧: Yes! I'd be falling asleep in your arms and so happy 🥰",
        "🧁: Yes. Sleep time. I'll think of good things tonight about you. Goodnight Penny 😘 see you very soon:)",
        "🐧: Goodnight Brad 😘"
      ], note: "This is, in the end, what the archive actually preserves. Not the milestones. The mornings between them." },
      { title: "Tiny Rituals", date: "7 May 2024", body: [
        "The apprentice notices the emoji before she notices anything else about this folder — a small heart-hands symbol, dropped into an ordinary goodnight, four days into the whole record.",
        "🐧: 🫶🏻 love it. Goodnight!",
        "🧁: Goodnight! Think hard:)"
      ], note: "Whatever this symbol becomes later in the record, it starts here, small and half-joking." },
      { title: "Learning a Voice", date: "26 May 2024", body: [
        "🐧: So we each need to make a new friend. Let's say Jordan, Taylor, Alex. Someone that sounds like a guy when you talk about said friend and sounds like a girl when I do.",
        "🧁: I'm honestly in. So my Alex is a buddy I play disc golf with, some pickleball? Sport stuff."
      ], note: "An entire invented person, built out loud, in the space of one conversation." },
      { title: "Cover Stories", date: "3 June 2024", body: [
        "🧁: Purposeful hang up?",
        "🐧: lol I love our fake ish texts.",
        "🐧: Today is an unlucky day for me historically!!! So probably not a good day for pb.",
        "🧁: Uh oh! Well that's enough for me! I'll cancel."
      ], note: "An entire second layer of meaning laid invisibly under an ordinary scheduling text." },
      { title: "Sleepyhead Thoughts", date: "14 May 2024", body: [
        "🧁: Sleepy head!",
        "🐧: Hey!",
        "🧁: I do like the sleepy head on timeline:)"
      ], note: "A private nickname, born out of exhaustion and a half-remembered book title." }
    ]
  },
  {
    icon: "🫶", title: "Familiarity",
    folders: [
      { title: "Close Calls", date: "18 May 2024", body: [
        "🧁: How did it go?",
        "🐧: More than 3 words! In fact I think you said more to me than I said to you 😊 haha",
        "🧁: I didn't walk in front of you though! Had to go behind. That was strategic."
      ], note: "The choreography of two people trying to occupy the same public spaces without appearing to notice each other." },

        "🧁: Woke up and caught you for a second!"

      { title: "Never Enough Time", date: "18 May 2024", body: [

      ], note: "A chronic shortage of the one resource this correspondence can't manufacture more of." },
      { title: "I Need You", date: "11 May 2024", body: [
        "🐧: So close to me!!! I need you here now. Good?!?",
        "🧁: Lol I want to be there now! 6 hour's?!"
      ], note: "Whether it felt good, for both of them, and whether either one is comfortable enough yet to say so plainly." }
    ]
  },
  {
    icon: "🔥", title: "Momentum",
    folders: [
      { title: "Jealousy", date: "1 July 2024", body: [
        "🧁: I can get jealous… ☹️ I like you. I think one was more of a joke but the last 3 days I'd say really had me worried to be honest."

      { title: "Gifts", date: "6 May 2024", body: [

      ], note: "This one stays a gap. The Initiative preserves gaps as gaps rather than filling them with inference." }
    ]
  },
  {
    icon: "📖", title: "Shared Language",
    folders: [

      ], note: "Starts here as an ordinary complaint about a broken app and a wish for more time." },

      ], note: "A small unguarded wish for something that could simply be trusted." },

        "🐧: Brad… yeah. Let's stay like this forever.",
        "🧁: Yes. I want to stay like this forever."
      ], note: "\"Forever\" appears 303 times across the full 208,998-message record." },

      ], note: "An echo, not an answer." }
    ]
  },
  {
    icon: "⚖️", title: "Influence",
    folders: [
      { title: "The Burden", date: "21 Sept 2025", body: [

      { title: "I Heart You, Not I Love You", date: "7 Dec 2024", body: [

      { title: "Hillary's Surgery", date: "19 Aug 2025", body: [
        "🧁: I'd say the cause is work and \"lack of you\" and I have been feeling like that for a few months."
      ], note: "The first time either of them names the correspondence itself as a source of difficulty." },
      { title: "Fears", date: "13 May 2024", body: [
        "🐧: I'm afraid going so soon could be suspicious. All of my reasons are good."
      ], note: "How much absence is plausible, how far in advance it needs to be planned." },
      { title: "Divorce Talk", date: "17 Oct 2025", body: [
        "🧁: Hey so you still like me as much as you did on the bench?! I fucking do."
      ], note: "The folder's real subject was never divorce at all." }
    ]
  },
  {
    icon: "⏳", title: "Weight",
    folders: [
      { title: "The Anniversary", date: "25 June 2024", body: [
        "🧁: bailar anniversary 06/25",
        "🐧: Dancing anniversary?"
      ], note: "The first time either of them assigns themselves an anniversary at all." },
      { title: "The Magnolia House", date: "3 May 2024", body: [
        "🐧: Yeah search The Magnolia House and see if you find it. It will be a good test."
      ], note: "A rented house, real enough to search for, elusive enough to need a second look." },
      { title: "Anxiety", date: "29 June 2024", body: [
        "🐧: Weird kitchen pic. But this decreases my anxiety. I need my house like this again!!!!"
      ], note: "Very little in this archive gets to be simple. This folder, briefly, is." },
      { title: "The Same Moment", date: "12 April 2025", body: [

      ], note: "Two people, a few feet apart in the same truck, each privately arriving at the same edge." },

  {

      ], note: "One of the two people inside it had already described exactly the shape of the thing that would eventually be built from what they left behind." },

      ], note: "The oldest fear in the whole record never fully leaves the room. It just finds a new sentence to live in." },

function buildBoxGrid() {
  const grid = document.getElementById('boxGrid');
  grid.innerHTML = '';
  BOXES.forEach((box, i) => {
    const card = document.createElement('div');
    card.className = 'box-card';
    card.innerHTML = `
      <div class="box-num">BOX ${i + 1}</div>
      <div class="box-icon">${box.icon}</div>
      <div class="box-part-title">${box.title}</div>
      <div class="box-count">${box.folders.length} folders</div>
    `;
    card.addEventListener('click', () => openBox(i));
    grid.appendChild(card);
  });
}

let currentBoxIndex = null;

function openBox(i) {
  currentBoxIndex = i;
  const box = BOXES[i];
  document.getElementById('folderViewTitle').textContent = box.icon + ' ' + box.title;
  const inner = document.getElementById('folderListInner');
  inner.innerHTML = '';
  box.folders.forEach((f, fi) => {
    const item = document.createElement('div');
    item.className = 'folder-item';
    item.innerHTML = `<div class="folder-title">${f.title}</div><div class="folder-date">${f.date}</div>`;
    item.addEventListener('click', () => openFolder(fi));
    inner.appendChild(item);
  });
  document.getElementById('boxView').style.display = 'none';
  document.getElementById('folderView').classList.add('show');
}

function openFolder(fi) {
  const folder = BOXES[currentBoxIndex].folders[fi];
  document.getElementById('readerTitle').textContent = folder.title;
  document.getElementById('readerDate').textContent = folder.date;
  const body = document.getElementById('readerBody');
  body.innerHTML = '';
  folder.body.forEach(line => {
    const p = document.createElement('p');
    p.textContent = line;
    body.appendChild(p);
  });
  const notep = document.createElement('p');
  notep.className = 'note';
  notep.textContent = folder.note;
  body.appendChild(notep);
  document.getElementById('folderView').classList.remove('show');
  document.getElementById('readerView').classList.add('show');
}

document.getElementById('backToBoxes').addEventListener('click', () => {
  document.getElementById('folderView').classList.remove('show');
  document.getElementById('boxView').style.display = 'block';
});

document.getElementById('backToFolders').addEventListener('click', () => {
  document.getElementById('readerView').classList.remove('show');
  document.getElementById('folderView').classList.add('show');
});

document.getElementById('unlockBtn').addEventListener('click', async () => {
  const pass = document.getElementById('passInput').value;
  const hash = await sha256(pass);
  if (hash === PASSWORD_HASH) {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('cabinet').classList.add('show');
    buildBoxGrid();
  } else {
    document.getElementById('lockError').textContent = 'Incorrect passphrase.';
  }
});

document.getElementById('passInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('unlockBtn').click();
});

document.getElementById('lockAgainBtn').addEventListener('click', () => {
  document.getElementById('cabinet').classList.remove('show');
  document.getElementById('passInput').value = '';
  document.getElementById('lockScreen').style.display = 'flex';
  document.getElementById('boxView').style.display = 'block';
  document.getElementById('folderView').classList.remove('show');
  document.getElementById('readerView').classList.remove('show');
});
</script>
</body>
</html>
