<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>The Cards</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #14100c;
    color: #ecdfc8;
    font-family: -apple-system, sans-serif;
  }
  .lock-screen {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    padding-bottom: max(30px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .lock-icon { font-size: 44px; margin-bottom: 16px; opacity: 0.9; }
  .lock-title { font-size: 22px; font-weight: 600; margin-bottom: 6px; letter-spacing: 0.4px; font-family: Georgia, serif; }
  .lock-sub { font-size: 13px; color: #a3906e; margin-bottom: 28px; max-width: 280px; line-height: 1.5; }
  .lock-input {
    width: 100%; max-width: 280px;
    background: #241d15;
    border: 1px solid #4a3c28;
    color: #ecdfc8;
    border-radius: 10px;
    padding: 13px 14px;
    font-size: 16px;
    margin-bottom: 14px;
    text-align: center;
  }
  .lock-btn {
    background: #b8895a;
    color: #14100c;
    border: none;
    border-radius: 10px;
    padding: 13px 34px;
    font-size: 15px;
    font-weight: 700;
  }
  .lock-error { color: #d17a6a; font-size: 12px; margin-top: 10px; min-height: 16px; }

  .gallery { display: none; padding: 20px 0 30px; }
  .gallery.show { display: block; }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: max(6px, env(safe-area-inset-top)) 24px 10px;
  }
  .top-bar button {
    background: none;
    border: none;
    color: #b8895a;
    font-size: 14px;
  }
  .archive-title {
    text-align: center;
    font-size: 12px;
    letter-spacing: 3px;
    color: #b8895a;
    margin-bottom: 2px;
  }
  .archive-sub { text-align: center; font-size: 22px; margin-bottom: 6px; letter-spacing: 6px; }
  .card-counter { text-align: center; font-size: 11px; color: #6b5a45; margin-bottom: 16px; }

  .carousel {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    gap: 16px;
    padding: 10px 24px 24px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .carousel::-webkit-scrollbar { display: none; }

  .quote-card {
    flex: 0 0 86%;
    max-width: 320px;
    scroll-snap-align: center;
    background: #f4ecdd;
    color: #3a3227;
    border-radius: 14px;
    padding: 26px 22px;
    font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
    min-height: 340px;
  }
  .card-icons { font-size: 18px; margin-bottom: 14px; letter-spacing: 6px; }
  .card-headline { font-size: 17px; font-weight: 700; line-height: 1.35; margin-bottom: 16px; }
  .card-lines { flex: 1; }
  .card-line {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    font-size: 15px;
    line-height: 1.45;
    margin-bottom: 10px;
    border-left: 3px solid #d8c9a8;
    padding-left: 10px;
  }
  .card-line .who { flex-shrink: 0; }
  .card-footer {
    margin-top: 16px;
    font-size: 12px;
    color: #8a7a63;
    font-style: italic;
    border-top: 1px solid #d8c9a8;
    padding-top: 12px;
    font-family: -apple-system, sans-serif;
  }

  .hint { text-align: center; font-size: 11px; color: #6b5a45; margin-top: 4px; }
</style>
</head>
<body>

  <div id="lockScreen" class="lock-screen">
    <div class="lock-icon">🃏</div>
    <div class="lock-title">The Cards</div>
    <div class="lock-sub">A few lines, kept exactly as they were.</div>
    <input type="password" id="passInput" class="lock-input" placeholder="Passphrase" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="unlockBtn" class="lock-btn">Enter</button>
    <div class="lock-error" id="lockError"></div>
  </div>

  <div id="gallery" class="gallery">
    <div class="top-bar">
      <button id="lockAgainBtn">🔒 Lock</button>
      <span></span>
    </div>
    <div class="archive-title">THE PENGUIN ARCHIVE</div>
    <div class="archive-sub">🐧 🧁</div>
    <div class="card-counter" id="cardCounter"></div>

    <div class="carousel" id="carousel"></div>
    <div class="hint">← swipe through the cards →</div>
  </div>
