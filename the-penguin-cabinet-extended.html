<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Penguin Cabinet</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;overflow-x:hidden}
:root{--paper:#f4ecdd;--ink:#2b2419;--brown:#4a3c28;--muted:#8a7a63;--line:#ded2b6;--card:#fffdf8;--amber:#c9843a;--green:#4f8a72;--pink:#c97b7b;--lav:#a97ba8}
body{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;background:var(--paper);color:var(--ink);line-height:1.65;background-image:radial-gradient(rgba(169,131,90,.045) 1px,transparent 1px);background-size:22px 22px}
.top{position:sticky;top:0;z-index:30;background:rgba(244,236,221,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:max(8px,env(safe-area-inset-top));font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.row{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px}.back{color:#a9714f;font-size:13px;text-decoration:none}.mini{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.wrap{max-width:700px;margin:auto;padding:0 18px 110px}.cover{min-height:90svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 8px}.pair{font-size:2.7rem;letter-spacing:.34em;padding-left:.34em}.cover h1{font-weight:400;font-size:clamp(2.7rem,13vw,4.3rem);line-height:1.02;color:var(--brown);margin:24px 0 12px}.cover p{font-style:italic;color:var(--muted);max-width:470px;font-size:15px;margin:0}.cue{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:9px;letter-spacing:2.7px;color:#b7a68d;text-transform:uppercase;margin-top:45px}
.room{margin:58px 0}.room-title{text-align:center;margin-bottom:24px}.eyebrow{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:9px;letter-spacing:3.2px;text-transform:uppercase;color:#a9714f}.room-title h2{font-size:2rem;font-weight:400;color:var(--brown);margin:7px 0}.room-title p{font-size:13px;font-style:italic;color:var(--muted);max-width:470px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px;margin:13px 0;box-shadow:0 9px 30px rgba(58,43,24,.035)}.big{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:clamp(2.5rem,13vw,4.5rem);font-weight:800;line-height:.95;letter-spacing:-2px;color:var(--brown)}.label{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:9px;letter-spacing:1.7px;text-transform:uppercase;color:#a09079;margin-top:10px}.desc{font-size:14px;color:#5c4f40;margin-top:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.split .card{margin:0}.quote{font-size:21px;line-height:1.45;font-style:italic;color:var(--brown)}
details.drawer{background:var(--card);border:1px solid var(--line);border-radius:15px;margin:11px 0;overflow:hidden}details.drawer summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:13px;padding:17px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}details.drawer summary::-webkit-details-marker{display:none}details.drawer[open] summary{border-bottom:1px solid #eadfca;background:#fffaf1}.badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#f0e3d0;color:#a9714f;font-size:10px;font-weight:800;flex:none}.sumtxt{font-size:13px;font-weight:700;color:var(--brown);flex:1}.hint{display:block;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#b8a98e;margin-top:3px}.inside{padding:20px}.answer{font-size:31px;line-height:1.1;color:var(--brown);margin-bottom:10px}
.tape{border-left:3px solid var(--amber);padding-left:16px;margin:22px 0}.pill{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 10px;margin:4px 2px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:10px;color:#695a47}
.bar{height:10px;background:#eee5d5;border-radius:99px;overflow:hidden;margin:8px 0}.fill{height:100%;background:linear-gradient(90deg,#c9843a,#e0a35c)}.fill.g{background:linear-gradient(90deg,#7fb89a,#4f8a72)}
.constellation{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:26px 18px}.constellation span{line-height:1}
.gridstats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.mini-card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px}.mini-card b{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:23px;color:var(--brown)}.mini-card small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.random{background:#473d31;color:#f8efdf;border-radius:18px;padding:25px 20px;text-align:center}.random .rlabel{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#d8c9b0}.random .rval{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:2.6rem;font-weight:800;line-height:1;margin:18px 0 8px;color:white}.random p{font-size:13px;color:#e4d8c5;min-height:54px}.random button{border:1px solid #9a8870;background:transparent;color:#fff;border-radius:999px;padding:11px 16px;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.quiz{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:22px}.quiz .q{font-size:18px;min-height:96px;display:flex;align-items:center;justify-content:center;text-align:center}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answers button{border:1px solid var(--line);border-radius:11px;background:#fffaf2;padding:12px;color:var(--brown)}.answers button.good{background:#e6f2e9;border-color:#77a38c}.answers button.bad{background:#f7e4e1;border-color:#c98178}.feedback{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:11px;color:var(--muted);min-height:20px;margin-top:12px;text-align:center}
.note{background:#f7f0e2;border:1px solid var(--line);border-radius:12px;padding:16px;font-size:12px;color:#6b5a45}
@media(max-width:520px){.wrap{padding-inline:16px}.card{padding:18px}.gridstats{grid-template-columns:1fr 1fr}}

  /* ---- Lock screen ---- */
  .lock-screen{position:fixed;inset:0;z-index:9999;background:#f4ecdd;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:40px 26px;
    background-image:radial-gradient(rgba(169,131,90,0.045) 1px,transparent 1px);background-size:22px 22px;}
  .lock-icon{font-size:40px;margin-bottom:22px;letter-spacing:10px;}
  .lock-title{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;font-size:1.9rem;
    font-weight:400;color:#4a3c28;margin-bottom:12px;}
  .lock-sub{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;font-style:italic;
    font-size:14px;color:#8a7a63;margin-bottom:26px;max-width:280px;line-height:1.6;}
  .lock-divider{width:40px;height:1px;background:#c9a876;margin-bottom:28px;}
  .lock-input{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;
    width:100%;max-width:240px;padding:12px 16px;border:1px solid #ded2b6;border-radius:10px;
    background:#fffdf8;color:#2b2419;text-align:center;margin-bottom:14px;outline:none;}
  .lock-input:focus{border-color:#c9843a;}
  .lock-btn{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;
    letter-spacing:1.5px;text-transform:uppercase;background:#4a3c28;color:#f4ecdd;border:none;
    padding:12px 32px;border-radius:10px;cursor:pointer;}
  .lock-btn:active{transform:scale(.97);}
  .lock-error{color:#c9605f;font-size:12.5px;margin-top:14px;min-height:16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  #siteContent{display:none;}
</style></head>
<body>

<div id="lockScreen" class="lock-screen">
  <div class="lock-icon">🧁 🐧</div>
  <div class="lock-title">The Penguin Cabinet</div>
  <div class="lock-sub">Locked. You know the passphrase.</div>
  <div class="lock-divider"></div>
  <input type="password" id="cabPass" class="lock-input" placeholder="Passphrase" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button id="cabUnlock" class="lock-btn">Enter</button>
  <div class="lock-error" id="cabError"></div>
</div>

<div id="siteContent"></div>

  function fromB64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }

  function deriveKey(passphrase, saltBytes){
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey'])
      .then(function(keyMaterial){
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: saltBytes, iterations: 250000, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      });
  }

  function runScripts(container){
    var scripts = container.querySelectorAll('script');
    scripts.forEach(function(old){
      var s = document.createElement('script');
      if (old.src) s.src = old.src; else s.textContent = old.textContent;
      old.parentNode.replaceChild(s, old);
    });
  }

  var lockScreen = document.getElementById('lockScreen');
  var content = document.getElementById('siteContent');
  var input = document.getElementById('cabPass');
  var btn = document.getElementById('cabUnlock');
  var err = document.getElementById('cabError');

  function tryUnlock(){
    var pass = input.value;
    if (!pass) { err.textContent = 'Enter a passphrase.'; return; }
    btn.disabled = true;
    var salt = fromB64(SALT_B64);
    var iv = fromB64(IV_B64);
    var ciphertext = fromB64(CT_B64);
    deriveKey(pass, salt).then(function(key){
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ciphertext);
    }).then(function(decryptedBuf){
      var text = new TextDecoder().decode(decryptedBuf);
      content.innerHTML = text;
      runScripts(content);
      lockScreen.style.display = 'none';
      content.style.display = 'block';
    }).catch(function(){
      err.textContent = 'Incorrect passphrase.';
      input.value = '';
      input.focus();
      btn.disabled = false;
    });
  }

  btn.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') tryUnlock(); });
  setTimeout(function(){ input.focus(); }, 100);
})();
</script>
