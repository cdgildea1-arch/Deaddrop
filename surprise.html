<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>&nbsp;</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  body{background:#f4ecdd;color:#2b2419;font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;line-height:1.7;
       background-image:radial-gradient(rgba(169,131,90,0.045) 1px,transparent 1px);background-size:22px 22px;}
  .cover{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
         text-align:center;padding:40px 26px;position:relative;}
  .pair{font-size:2.6rem;letter-spacing:0.42em;padding-left:0.42em;animation:rise 1.1s ease-out both;}
  .ttl{font-size:clamp(2.4rem,11vw,3.6rem);font-weight:400;margin:26px 0 0;line-height:1.05;color:#4a3c28;
       animation:rise 1.1s ease-out .18s both;}
  .sub{font-style:italic;color:#8a7a63;font-size:15px;margin:16px 0 0;animation:rise 1.1s ease-out .34s both;}
  .dates{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:10px;letter-spacing:3.6px;color:#c9843a;margin-top:32px;
         text-transform:uppercase;animation:rise 1.1s ease-out .5s both;}
  .cue{position:absolute;bottom:34px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:9.5px;letter-spacing:2.6px;color:#b8a98e;
       text-transform:uppercase;animation:rise 1.1s ease-out .8s both,float 2.6s ease-in-out 2s infinite;}
  @keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(5px);}}
  .rev{opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .8s ease;}
  .rev.in{opacity:1;transform:none;}
  .band{background:#fffdf8;border-top:1px solid #ded2b6;border-bottom:1px solid #ded2b6;}

  .grid{display:grid;grid-template-columns:repeat(35,1fr);gap:2.5px;}
  .grid i{display:block;width:100%;aspect-ratio:1;border-radius:1.5px;}
  @media(max-width:520px){.grid{grid-template-columns:repeat(25,1fr);gap:2px;}}
  .qb{transition:background .18s ease,color .18s ease,transform .12s ease;}
  .qb:active{transform:scale(.97);}
  .qb.hit{background:#4f8a72;color:#fff;border-color:#4f8a72;}
  .qb.miss{background:#c9605f;color:#fff;border-color:#c9605f;}
  .qb:focus-visible{outline:2px solid #c9843a;outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){
    .rev{opacity:1;transform:none;transition:none;}
    .pair,.ttl,.sub,.dates,.cue{animation:none;}
  }

  /* ---- Lock screen (matches site convention) ---- */
  .lock-screen{position:fixed;inset:0;z-index:9999;background:#f4ecdd;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:40px 26px;
    background-image:radial-gradient(rgba(169,131,90,0.045) 1px,transparent 1px);background-size:22px 22px;}
  .lock-icon{font-size:40px;margin-bottom:22px;letter-spacing:10px;}
  .lock-title{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;font-size:1.9rem;
    font-weight:400;color:#4a3c28;margin-bottom:12px;}
  .lock-sub{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;font-style:italic;
    font-size:14px;color:#8a7a63;margin-bottom:26px;max-width:280px;line-height:1.6;}
  .lock-divider{width:40px;height:1px;background:#c9a876;margin-bottom:28px;}
  .lock-input{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;
    width:100%;max-width:240px;padding:12px 16px;border:1px solid #ded2b6;border-radius:10px;
    background:#fffdf8;color:#2b2419;text-align:center;margin-bottom:14px;outline:none;}
  .lock-input:focus{border-color:#c9843a;}
  .lock-btn{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;
    letter-spacing:1.5px;text-transform:uppercase;background:#4a3c28;color:#f4ecdd;border:none;
    padding:12px 32px;border-radius:10px;cursor:pointer;}
  .lock-btn:active{transform:scale(.97);}
  .lock-error{color:#c9605f;font-size:12.5px;margin-top:14px;min-height:16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  #siteContent{display:none;}
</style></head><body>

<div id="lockScreen" class="lock-screen">
  <div class="lock-icon">🧁 🐧</div>
  <div class="lock-title">For You</div>
  <div class="lock-sub">This one's just between us.</div>
  <div class="lock-divider"></div>
  <input type="password" id="surpPass" class="lock-input" placeholder="Passphrase" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button id="surpUnlock" class="lock-btn">Enter</button>
  <div class="lock-error" id="surpError"></div>
</div>

  function fromB64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }

  function deriveKey(passphrase, saltBytes){
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey'])
      .then(function(keyMaterial){
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: saltBytes, iterations: 250000, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      });
  }

  function runScripts(container){
    var scripts = container.querySelectorAll('script');
    scripts.forEach(function(old){
      var s = document.createElement('script');
      if (old.src) s.src = old.src; else s.textContent = old.textContent;
      old.parentNode.replaceChild(s, old);
    });
  }

  var lockScreen = document.getElementById('lockScreen');
  var content = document.getElementById('siteContent');
  var input = document.getElementById('surpPass');
  var btn = document.getElementById('surpUnlock');
  var err = document.getElementById('surpError');

  function tryUnlock(){
    var pass = input.value;
    if (!pass) { err.textContent = 'Enter a passphrase.'; return; }
    btn.disabled = true;
    var salt = fromB64(SALT_B64);
    var iv = fromB64(IV_B64);
    var ciphertext = fromB64(CT_B64);
    deriveKey(pass, salt).then(function(key){
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ciphertext);
    }).then(function(decryptedBuf){
      var text = new TextDecoder().decode(decryptedBuf);
      content.innerHTML = text;
      runScripts(content);
      lockScreen.style.display = 'none';
      content.style.display = 'block';
    }).catch(function(){
      err.textContent = 'Incorrect passphrase.';
      input.value = '';
      input.focus();
      btn.disabled = false;
    });
  }

  btn.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') tryUnlock(); });
  setTimeout(function(){ input.focus(); }, 100);
})();
</script>
