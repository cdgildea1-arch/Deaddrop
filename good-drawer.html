const LABELS={funny:'MADE US LAUGH',sweet:'SAID OUT LOUD',ordinary:'A NORMAL DAY',tiny:'TINY',weird:'ZERO CONTEXT'};
const O=document.getElementById('overlay'),S=document.getElementById('sheet');
document.getElementById('count').textContent=memories.length;
let lastPick=null;
function pick(cat){let pool=cat==='all'?memories:memories.filter(x=>x.cat===cat);if(pool.length>1){let t=0;let m;do{m=pool[Math.floor(Math.random()*pool.length)];t++}while(m===lastPick&&t<12);lastPick=m;return m}return pool[0]}
function closeSheet(){O.classList.remove('show')}
function show(h){S.innerHTML=h;O.classList.add('show')}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function memory(cat){const m=pick(cat);if(!m)return;const lines=m.lines.map(x=>`<div class="line">${esc(x)}</div>`).join('');show(`<div class="meta">${LABELS[m.cat]||m.cat} &middot; ${esc(m.date)}</div><div class="memory">${lines}</div><div class="actions"><button onclick="memory('${cat}')">ANOTHER</button><button class="primary" onclick="closeSheet()">KEEP IT</button></div>`)}
function surprise(){const r=Math.random();if(r<.6)return memory('all');if(r<.78){confetti(38);return show(`<h3>UNNECESSARY CONFETTI</h3><div class="meta">official archive event</div><div class="memory"><div class="line">There was no occasion. That did not stop the penguin.</div></div><div class="actions"><button class="primary" onclick="closeSheet()">CORRECT</button></div>`)}if(r<.9)return fact();show(`<h3>AUTHORIZED PENGUIN PERSON</h3><div class="meta">clearance: unnecessarily high</div><div class="memory"><div class="line">Credential verified. Responsibilities remain unclear.</div></div><div class="actions"><button class="primary" onclick="closeSheet()">ACCEPT</button></div>`)}
const facts=['The archive contains enough "lol" and "haha" to justify its own department.','A surprising number of perfectly good memories are only two messages long.','Tiny misunderstandings routinely outperform major plot points.','Coffee, schedules, weather, and pointless observations make excellent archive material.','Official finding: ordinary moments age unusually well.','The archive remains aggressively overqualified for remembering small things.','Roughly zero percent of the best moments in here were planned.'];
function fact(){show(`<h3>PENGUIN LAB</h3><div class="meta">peer review unavailable</div><div class="memory"><div class="line">${facts[Math.floor(Math.random()*facts.length)]}</div></div><div class="actions"><button onclick="fact()">ANOTHER FINDING</button><button class="primary" onclick="closeSheet()">VERY SCIENTIFIC</button></div>`)}
function drawer(){const arr=[...memories].sort(()=>Math.random()-.5).slice(0,35);show(`<h3>THE GOOD DRAWER</h3><div class="meta">35 random fragments from ${memories.length}</div><div class="drawer">${arr.map(m=>`<div class="mini"><div class="mdate">${esc(m.date)} &middot; ${LABELS[m.cat]||m.cat}</div><div class="mtxt">${esc(m.lines.join('  /  '))}</div></div>`).join('')}</div><div class="actions"><button onclick="drawer()">SHAKE DRAWER</button><button class="primary" onclick="closeSheet()">CLOSE</button></div>`)}
function today(){const d=new Date();const key=String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const pool=onThisDay[key];const nice=d.toLocaleDateString(undefined,{month:'long',day:'numeric'});
if(!pool||!pool.length){return show(`<h3>ON THIS DAY</h3><div class="meta">${esc(nice)}</div><div class="memory"><div class="line">Nothing on record for today. Apparently we took the day off.</div></div><div class="actions"><button onclick="memory('all')">GIVE ME ANYTHING</button><button class="primary" onclick="closeSheet()">FAIR</button></div>`)}
const e=pool[Math.floor(Math.random()*pool.length)];const lines=e.lines.map(x=>`<div class="line">${esc(x)}</div>`).join('');
show(`<h3>ON THIS DAY</h3><div class="meta">${esc(nice)} &middot; ${esc(e.y)}</div><div class="memory">${lines}</div><div class="actions">${pool.length>1?'<button onclick="today()">ANOTHER YEAR</button>':''}<button class="primary" onclick="closeSheet()">KEEP IT</button></div>`)}
function streak(){const s=streaks[Math.floor(Math.random()*streaks.length)];const lines=s.lines.map(x=>`<div class="line">${esc(x)}</div>`).join('');
show(`<h3>A REAL TUESDAY</h3><div class="meta">${esc(s.date)} &middot; ${esc(s.time)}</div><div class="memory">${lines}</div><div class="actions"><button onclick="streak()">ANOTHER DAY</button><button class="primary" onclick="closeSheet()">CLOSE</button></div>`)}
function penguin(){const a=['Penguin recommends another one.','This is now a medically unnecessary amount of archive.','🧁 emergency cupcake deployed.','No.','Penguin has reviewed the evidence and requests snacks.','You tapped it. That was your decision.','Official ruling: tiny memories count.'];document.getElementById('bubble').textContent=a[Math.floor(Math.random()*a.length)]}
function confetti(n){const c=document.getElementById('confetti'),bits=['🐧','🧁','✨','•'];for(let i=0;i<n;i++){const e=document.createElement('i');e.textContent=bits[Math.floor(Math.random()*bits.length)];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.4+'s';c.appendChild(e);setTimeout(()=>e.remove(),2200)}}
