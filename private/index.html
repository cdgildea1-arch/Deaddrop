<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Private Archive</title>
<meta name="theme-color" content="#f8f5ed">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#f8f5ed;color:#193653;font:16px system-ui,sans-serif}
main{width:min(100% - 36px,420px);margin:max(9vh,40px) auto;padding:24px;border:1px solid #7895ad;border-radius:20px;background:#fdfbf6;box-shadow:0 12px 30px #19365312}
h1{margin:0 0 18px;font:700 38px Georgia,serif}
label{display:grid;gap:8px}
input,button{font:inherit;border-radius:9px;padding:11px;min-height:44px}
input{min-width:0;border:1px solid #6a8eab;background:#eef3f6;color:inherit}
button{border:1px solid #496a87;background:#cddde9;color:#193653;font-weight:700;margin-top:12px}
button:focus-visible,input:focus-visible{outline:2px solid #315d80;outline-offset:2px}
#status:empty{display:none}
.session-note{font-size:.875rem;line-height:1.4;color:#47627a;margin:12px 0 0}
iframe{display:block;position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#f8f5ed}
</style>
<script type="module" src="./archive.mjs?v=places-story"></script>
</head>
<body>
<main id="gate">
 <h1>Private Archive</h1>
 <form id="form" hidden>
  <label>Email address<input id="email" type="email" autocomplete="email" required></label>
  <button type="submit">Email me a sign-in link</button>
  <p class="session-note">You’ll stay signed in on this browser while it keeps your session. Open the email link here, then return here to read the archive.</p>
 </form>
 <p id="status" role="status">Checking access…</p>
 <button id="retry" type="button" hidden>Try again</button>
 <button id="signout" type="button" hidden>Sign out</button>
</main>
<iframe id="archive" title="Private Archive" hidden sandbox="allow-same-origin allow-scripts allow-forms allow-modals allow-downloads allow-top-navigation-by-user-activation"></iframe>
</body>
</html>
