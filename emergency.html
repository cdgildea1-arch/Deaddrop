<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Penguin Emergency Kit</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:#faf7f2;color:#342c23;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif}.wrap{max-width:520px;margin:auto;padding:max(28px,env(safe-area-inset-top)) 18px max(40px,env(safe-area-inset-bottom))}.back{color:#8a6d3b;text-decoration:none;font-size:14px}.hero{text-align:center;padding:30px 8px 20px}.penguin{font-size:58px;animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}h1{font-family:Georgia,serif;font-weight:400;font-size:30px;margin:10px 0 8px}.intro{font-family:Georgia,serif;font-style:italic;color:#806b4d;line-height:1.55;margin:0 auto;max-width:360px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:22px}.card{border:1px solid #dacbad;background:#fffdfa;border-radius:18px;min-height:142px;padding:18px 14px;text-align:left;box-shadow:0 5px 18px rgba(91,67,34,.06);font:inherit;color:inherit}.card:active{transform:scale(.97)}.icon{font-size:28px;display:block;margin-bottom:12px}.label{font-weight:700;font-size:15px}.tiny{display:block;color:#8a775c;font-size:12px;margin-top:5px;line-height:1.35}.full{grid-column:1/-1;min-height:108px}.overlay{position:fixed;inset:0;background:rgba(42,33,23,.35);display:none;align-items:flex-end;justify-content:center;padding:14px;z-index:20}.overlay.show{display:flex}.sheet{width:min(100%,500px);background:#fffdfa;border:1px solid #d6c5a5;border-radius:24px;padding:26px 22px max(24px,env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.15);animation:up .22s ease}@keyframes up{from{transform:translateY(25px);opacity:0}}.sheetIcon{font-size:36px}.sheet h2{font-family:Georgia,serif;font-size:22px;font-weight:400;margin:10px 0}.sheet p{font-family:Georgia,serif;font-size:17px;line-height:1.6;margin:0;color:#4e4234}.close{width:100%;margin-top:22px;border:0;background:#8a6d3b;color:white;border-radius:12px;padding:13px;font-weight:700;font-size:15px}.footer{text-align:center;color:#a28f70;font-family:Georgia,serif;font-style:italic;font-size:12px;margin:25px 0 0}
</style></head><body><div class="wrap"><a class="back" href="hub.html">‹ back to the archive</a><div class="hero"><div class="penguin">🐧</div><h1>Penguin Emergency Kit</h1><p class="intro">Nothing to figure out in here. I just wanted somewhere that was fun to open.</p></div><div class="grid">
<button class="card" onclick="openKit('smile')"><span class="icon">🙂</span><span class="label">Make me smile</span><span class="tiny">Something small and stupid, as required.</span></button>
<button class="card" onclick="openKit('remind')"><span class="icon">✨</span><span class="label">Remind me</span><span class="tiny">One tiny proof that we really are us.</span></button>
<button class="card" onclick="openKit('nice')"><span class="icon">🫶🏻</span><span class="label">Tell me something nice</span><span class="tiny">No analysis. Just this.</span></button>
<button class="card" onclick="openKit('random')"><span class="icon">🎲</span><span class="label">Random memory</span><span class="tiny">The archive reaches into the jar.</span></button>
<button class="card full" onclick="openKit('thirty')"><span class="icon">⏱️</span><span class="label">I have 30 seconds</span><span class="tiny">Perfect. That's plenty.</span></button>
<button class="card full" onclick="openKit('emergency')"><span class="icon">🚨🐧</span><span class="label">Actual penguin emergency</span><span class="tiny">For severe cases only.</span></button>
</div><div class="footer">Emergency supplies replenish automatically.</div></div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeKit()"><div class="sheet"><div class="sheetIcon" id="sheetIcon"></div><h2 id="sheetTitle"></h2><p id="sheetText"></p><button class="close" onclick="closeKit()">put it back</button></div></div>
<script>
const kits={
 smile:[['🙂','A very serious reminder','“Normal Brad, reporting for duty.” Somehow this became part of the permanent record.'],['😂','Extremely important evidence','Purposeful hang up? Still funny. Still admissible.'],['☕','Tiny ritual','Coffee for the penguin. Cupcake for the cupcake. Order restored.']],
 remind:[['✨','A little proof','There are whole conversations here, but sometimes the best part is just: “Good morning.” Then another one. Then another one.'],['🧁🐧','The entire thesis','Somehow two completely ridiculous emojis became a language.'],['♾️','Kept','“Forever, twice.” It made the archive for a reason.']],
 nice:[['🫶🏻','For you','You are worth making things for. Not because they have to be impressive. Because making something that makes you smile feels worth doing.'],['🌙','Just this','I like the tiny version of us too — the jokes, the check-ins, the dumb little things that would mean absolutely nothing to anyone else.'],['📦','No hidden assignment','You do not have to react correctly to this. I just wanted to leave you something good.']],
 random:[['😴','Recovered artifact','Sleepyhead…'],['💙','Recovered artifact','I like the blue.'],['👜','Recovered artifact','The bag won’t fail you.'],['🌅','Recovered artifact','Good morning.'],['🫶🏻','Recovered artifact','Sometimes the whole message really was just this: 🫶🏻']],
 thirty:[['⏱️','30-second version','Hi. You found the tiny room. You are allowed to smile, close it, and go do literally anything else. That is the entire assignment.'],['⏱️','Speed run','🐧 + 🧁 + one stupid joke + one good memory = emergency successfully treated.']],
 emergency:[['🚨🐧','PENGUIN EMERGENCY','The penguin has assessed the situation and prescribed: one snack, one comfortable blanket, and absolutely no serious conversations for the next ten minutes.'],['🚨','Critical alert','ARCHIVE MALFUNCTION: Too much meaning detected. Deploying nonsense immediately. 🐧 waddles away carrying a cupcake it absolutely did not pay for.'],['🐧','Official diagnosis','Penguin says: “You seem like you need to be aggressively cozy.” This ruling is final.']]
};
function openKit(type){const a=kits[type],x=a[Math.floor(Math.random()*a.length)];document.getElementById('sheetIcon').textContent=x[0];document.getElementById('sheetTitle').textContent=x[1];document.getElementById('sheetText').textContent=x[2];document.getElementById('overlay').classList.add('show');}
function closeKit(){document.getElementById('overlay').classList.remove('show')}
</script></body></html>
