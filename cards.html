<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>The Cards</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #14100c;
    color: #ecdfc8;
    font-family: -apple-system, sans-serif;
  }
  .lock-screen {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    padding-bottom: max(30px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .lock-icon { font-size: 44px; margin-bottom: 16px; opacity: 0.9; }
  .lock-title { font-size: 22px; font-weight: 600; margin-bottom: 6px; letter-spacing: 0.4px; font-family: Georgia, serif; }
  .lock-sub { font-size: 13px; color: #a3906e; margin-bottom: 28px; max-width: 280px; line-height: 1.5; }
  .lock-input {
    width: 100%; max-width: 280px;
    background: #241d15;
    border: 1px solid #4a3c28;
    color: #ecdfc8;
    border-radius: 10px;
    padding: 13px 14px;
    font-size: 16px;
    margin-bottom: 14px;
    text-align: center;
  }
  .lock-btn {
    background: #b8895a;
    color: #14100c;
    border: none;
    border-radius: 10px;
    padding: 13px 34px;
    font-size: 15px;
    font-weight: 700;
  }
  .lock-error { color: #d17a6a; font-size: 12px; margin-top: 10px; min-height: 16px; }

  .gallery { display: none; padding: 20px 0 30px; }
  .gallery.show { display: block; }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: max(6px, env(safe-area-inset-top)) 24px 10px;
  }
  .top-bar button {
    background: none;
    border: none;
    color: #b8895a;
    font-size: 14px;
  }
  .archive-title {
    text-align: center;
    font-size: 12px;
    letter-spacing: 3px;
    color: #b8895a;
    margin-bottom: 2px;
  }
  .archive-sub { text-align: center; font-size: 22px; margin-bottom: 6px; letter-spacing: 6px; }
  .card-counter { text-align: center; font-size: 11px; color: #6b5a45; margin-bottom: 16px; }

  .carousel {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    gap: 16px;
    padding: 10px 24px 24px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .carousel::-webkit-scrollbar { display: none; }

  .quote-card {
    flex: 0 0 86%;
    max-width: 320px;
    scroll-snap-align: center;
    background: #f4ecdd;
    color: #3a3227;
    border-radius: 14px;
    padding: 26px 22px;
    font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
    min-height: 340px;
  }
  .card-icons { font-size: 18px; margin-bottom: 14px; letter-spacing: 6px; }
  .card-headline { font-size: 17px; font-weight: 700; line-height: 1.35; margin-bottom: 16px; }
  .card-lines { flex: 1; }
  .card-line {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    font-size: 15px;
    line-height: 1.45;
    margin-bottom: 10px;
    border-left: 3px solid #d8c9a8;
    padding-left: 10px;
  }
  .card-line .who { flex-shrink: 0; }
  .card-footer {
    margin-top: 16px;
    font-size: 12px;
    color: #8a7a63;
    font-style: italic;
    border-top: 1px solid #d8c9a8;
    padding-top: 12px;
    font-family: -apple-system, sans-serif;
  }

  .hint { text-align: center; font-size: 11px; color: #6b5a45; margin-top: 4px; }
</style>
</head>
 <div id="tp-widget">
  <div id="tp-bubble" class="tp-bubble"></div>
  <div id="tp-penguin" class="tp-penguin">🐧</div>
  <div id="tp-menu" class="tp-menu" hidden>
    <button onclick="tpAction('feed')">🍰 Feed Cupcake</button>
    <button onclick="tpAction('coffee')">☕ Give Coffee</button>
    <button onclick="tpAction('talk')">💬 Talk</button>
    <button onclick="tpAction('search')">📦 Search Archive</button>
    <button onclick="tpAction('sleep')">😴 Sleep</button>
    <button onclick="tpCloseMenu()" class="tp-menu-close">✕</button>
  </div>
  <div id="tp-stats" class="tp-stats">
    <span>❤️ <b id="tp-happy">–</b></span>
    <span>☕ <b id="tp-energy">–</b></span>
    <span>💬 <b id="tp-social">–</b></span>
    <span>📚 <b id="tp-curious">–</b></span>
  </div>
</div>

<style>
  #tp-widget { position: fixed; bottom: 14px; right: 14px; z-index: 9999; font-family: -apple-system, sans-serif; user-select: none; }
  #tp-penguin { font-size: 34px; cursor: pointer; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4)); animation: tp-idle 2.4s ease-in-out infinite; transition: transform 0.4s ease; }
  #tp-penguin.tp-walking { animation: tp-walk 0.5s ease-in-out infinite; }
  #tp-penguin.tp-sleeping { animation: tp-sleep 3s ease-in-out infinite; opacity: 0.75; }
  #tp-penguin.tp-happy { animation: tp-bounce 0.4s ease-in-out infinite; }
  @keyframes tp-idle { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-3px) rotate(-2deg); } }
  @keyframes tp-walk { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-5px) rotate(4deg); } }
  @keyframes tp-sleep { 0%, 100% { transform: rotate(0deg) translateY(0); } 50% { transform: rotate(3deg) translateY(2px); } }
  @keyframes tp-bounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.08); } }
  .tp-bubble { position: absolute; bottom: 46px; right: 0; max-width: 190px; background: #fffaf0; color: #3a3227; border: 1px solid #d8c9a8; border-radius: 12px; padding: 8px 12px; font-size: 12.5px; line-height: 1.4; box-shadow: 0 4px 14px rgba(0,0,0,0.25); display: none; font-family: Georgia, serif; }
  .tp-bubble.show { display: block; animation: tp-fade 0.25s ease; }
  @keyframes tp-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .tp-menu { position: absolute; bottom: 46px; right: 0; background: #14100c; border: 1px solid #4a3c28; border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); min-width: 160px; }
  .tp-menu button { background: none; border: none; color: #ecdfc8; text-align: left; padding: 8px 10px; font-size: 13px; border-radius: 8px; }
  .tp-menu button:active { background: #241d15; }
  .tp-menu-close { text-align: center !important; color: #b8895a !important; font-size: 11px !important; margin-top: 2px; }
  .tp-stats { position: absolute; bottom: -22px; right: 0; display: flex; gap: 6px; font-size: 9px; color: #8a7355; white-space: nowrap; opacity: 0.85; }
</style>

<script>
(function() {
  const TP_KEY = 'tiny_penguin_state';
  const TP_LINES_IDLE = ["Good morning.","Sleepyhead...","I wonder where Cupcake is.","The bag won't fail you.","Forever, twice.","I like the blue.","Normal Brad, reporting for duty.","...","🫶🏻","Purposeful hang up?"];
  const TP_ARTIFACTS = ["Blue Dress","The Bag","Good Morning","Sleepyhead","Normal Brad","The Hotel Key","Forever","The Magnolia House","Vulnerable Jimmy","Tommy"];
  function tpNow() { return Date.now(); }
  function tpLoad() {
    try { const raw = localStorage.getItem(TP_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return { happy: 70, energy: 70, social: 70, curious: 70, lastTick: tpNow(), lastInteraction: tpNow(), foundArtifacts: [], sleeping: false };
  }
  function tpSave(state) { try { localStorage.setItem(TP_KEY, JSON.stringify(state)); } catch (e) {} }
  let state = tpLoad();
  function tpDecay() {
    const now = tpNow();
    const minutesPassed = (now - state.lastTick) / 60000;
    if (minutesPassed > 0) {
      state.happy = Math.max(0, state.happy - minutesPassed * 0.6);
      state.energy = Math.max(0, state.energy - minutesPassed * 0.4);
      state.social = Math.max(0, state.social - minutesPassed * 0.8);
      state.curious = Math.max(0, state.curious - minutesPassed * 0.3);
      state.lastTick = now;
    }
    tpSave(state);
  }
  function tpClamp(v) { return Math.max(0, Math.min(100, Math.round(v))); }
  function tpUpdateUI() {
    document.getElementById('tp-happy').textContent = tpClamp(state.happy);
    document.getElementById('tp-energy').textContent = tpClamp(state.energy);
    document.getElementById('tp-social').textContent = tpClamp(state.social);
    document.getElementById('tp-curious').textContent = tpClamp(state.curious);
    const penguin = document.getElementById('tp-penguin');
    penguin.classList.remove('tp-walking', 'tp-sleeping', 'tp-happy');
    if (state.sleeping) { penguin.textContent = '😴'; penguin.classList.add('tp-sleeping'); }
    else if (state.happy > 80) { penguin.textContent = '🐧'; penguin.classList.add('tp-happy'); }
    else if (state.energy < 25) { penguin.textContent = '🥱'; }
    else { penguin.textContent = '🐧'; }
  }
  function tpSayBubble(text, duration) {
    const bubble = document.getElementById('tp-bubble');
    bubble.textContent = text;
    bubble.classList.add('show');
    setTimeout(() => { bubble.classList.remove('show'); }, duration || 3200);
  }
  function tpMaybeSpeak() {
    if (state.sleeping) return;
    const minsSinceInteraction = (tpNow() - state.lastInteraction) / 60000;
    if (minsSinceInteraction > 2 && Math.random() < 0.4) {
      tpSayBubble(TP_LINES_IDLE[Math.floor(Math.random() * TP_LINES_IDLE.length)]);
    }
    if (state.social < 30 && Math.random() < 0.3) { tpSayBubble("I'm a little lonely..."); }
  }
  function tpWalk() {
    if (state.sleeping) return;
    const penguin = document.getElementById('tp-penguin');
    penguin.classList.add('tp-walking');
    setTimeout(() => penguin.classList.remove('tp-walking'), 900);
  }
  window.tpAction = function(action) {
    state.lastInteraction = tpNow();
    if (action === 'feed') { state.happy = tpClamp(state.happy + 20); tpSayBubble("Mmm, cupcake. 🧁"); }
    else if (action === 'coffee') { state.energy = tpClamp(state.energy + 25); tpSayBubble("☕ Ahh, better."); }
    else if (action === 'talk') { state.social = tpClamp(state.social + 20); tpSayBubble(TP_LINES_IDLE[Math.floor(Math.random() * TP_LINES_IDLE.length)]); }
    else if (action === 'search') {
      state.curious = tpClamp(state.curious + 15);
      const found = Math.random() < 0.35;
      if (found) {
        const remaining = TP_ARTIFACTS.filter(a => !state.foundArtifacts.includes(a));
        if (remaining.length > 0) {
          const pick = remaining[Math.floor(Math.random() * remaining.length)];
          state.foundArtifacts.push(pick);
          tpSayBubble("📦 Recovered Artifact:\n+ " + pick, 4200);
        } else { tpSayBubble("📦 I've found everything so far..."); }
      } else { tpSayBubble("Nothing this time..."); }
    } else if (action === 'sleep') { state.sleeping = !state.sleeping; tpSayBubble(state.sleeping ? "Goodnight..." : "I'm awake!"); }
    tpSave(state); tpUpdateUI(); tpCloseMenu();
  };
  window.tpCloseMenu = function() { document.getElementById('tp-menu').hidden = true; };
  document.getElementById('tp-penguin').addEventListener('click', () => {
    const menu = document.getElementById('tp-menu');
    menu.hidden = !menu.hidden;
    state.lastInteraction = tpNow();
    tpSave(state);
  });
  tpDecay(); tpUpdateUI();
  setInterval(() => { tpDecay(); tpUpdateUI(); }, 20000);
  setInterval(tpMaybeSpeak, 15000);
  setInterval(tpWalk, 6000);
})();
</script>

<body>

  <div id="lockScreen" class="lock-screen">
    <div class="lock-icon">🃏</div>
    <div class="lock-title">The Cards</div>
    <div class="lock-sub">A few lines, kept exactly as they were.</div>
    <input type="password" id="passInput" class="lock-input" placeholder="Passphrase" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="unlockBtn" class="lock-btn">Enter</button>
    <div class="lock-error" id="lockError"></div>
  </div>

  <div id="gallery" class="gallery">
    <div class="top-bar">
      <button id="lockAgainBtn">🔒 Lock</button>
      <span></span>
    </div>
    <div class="archive-title">THE PENGUIN ARCHIVE</div>
    <div class="archive-sub">🐧 🧁</div>
    <div class="card-counter" id="cardCounter"></div>

    <div class="carousel" id="carousel"></div>
    <div class="hint">← swipe through the cards →</div>
  </div>

<script>
const PASSPHRASE = "cupcake";

const CARDS = [
  { headline: "Before this archive even begins, Penny wrote her own timeline of how it started.", lines: [
    ["🐧","Timeline 10/24 first ride 11/1 you apologized for not seeing me that week 11/18 I watched Yellowstone 12/2 basically texting 5 days a week 1/4 I laid on forty 1/14 you lied to me"]
  ], footer: "She pinned this message three separate times." },

  { headline: "Twenty months. 208,998 messages. Maybe never once, cleanly, without a hedge:", lines: [
    ["🧁","But I love you on top of me feeling your body against me."],
    ["🧁","You said I love you… haha decently long pause"],
    ["🧁","But the full sentence was I love you ……… being inside me."],
    ["🐧","Hahaha you said \"I love you inside me\"??"],
    ["🐧","You need to hear me say I love you…."]
  ], footer: "February 17, 2025 — nine months in." },

  { headline: "One month in, the first real crisis:", lines: [
    ["🐧","I don't think I can trust you."],
    ["🧁","I am not going to end this over text."],
    ["🐧","I don't want to end this either."]
  ], footer: "November 26, 2024." },

  { headline: "Kept, and answered right back.", lines: [
    ["🐧","Brad... yeah. Let's stay like this forever."],
    ["🧁","Fuck Meredith! I need you!"],
    ["🧁","Yes. I want to stay like this forever."],
    ["🧁","Deal."]
  ], footer: "January 20, 2025. Pinned by 🧁." },

  { headline: "Penny wrote herself a list of rules. He's the one who pinned it.", lines: [
    ["🐧","1. Bedtime at 9:15."],
    ["🐧","2. Use only chess to text 2 nights a week. Or at least mostly, past 7:30."],
    ["🐧","3. No sex."],
    ["🐧","4. Less seeing—"]
  ], footer: "March 4, 2025. The list cuts off there in the record. Pinned by 🧁." },

  { headline: "He said it. She's the one who pinned it.", lines: [
    ["🧁","December 8, 2023"]
  ], footer: "April 22, 2025. What it means is not in the record. Pinned by 🐧." },

  { headline: "They weren't just pinning messages. They were sorting them.", lines: [
    ["🧁","Move sad pins to google sheet."],
    ["🐧","Sharing about kids. Boundaries. Moving. And more questions. Review our pins."]
  ], footer: "March 13 and 16, 2025. A greatest-hits archive, built by them, before this one existed. Pinned by 🧁." },

  { headline: "Pinned the same day as the grandmother, the fight, and the reconciliation.", lines: [
    ["🐧","You read it. You didn't reply. You never do that."],
    ["🧁","OK fact number one there we go."],
    ["🧁","What can I do for you Meredith right now?"]
  ], footer: "May 10, 2025. Pinned by 🧁." },

  { headline: "A fear named plainly — and she noticed him keeping it.", lines: [
    ["🐧","I think my biggest fear was my parents noticing. They've seen what I've looked like my entire life when I had a crush on someone, you know?"],
    ["🐧","Haha oh no! You pinned that."]
  ], footer: "June 13, 2025. Pinned by 🧁." },

  { headline: "Not every pin is tender. Some are just a strange, unexplained worry.", lines: [
    ["🧁","Research… on how to find a tracker***"]
  ], footer: "August 14, 2025. He pinned it himself; the context around it is mundane, not explained." },

  { headline: "He kept this one himself — and she answered him a few minutes later.", lines: [
    ["🧁","Don't have to worry about losing each other."],
    ["🐧","I love hearing that! It was nice to talk to you with no one around. No rush."]
  ], footer: "May 5, 2025. Pinned by 🧁." },

  { headline: "One month in, already fluent in a language neither of them was ever taught.", lines: [
    ["🐧","What? You changed your name?"],
    ["🧁","I'd say Joshua was supposed to come, still might not happen. No babysitter."],
    ["🧁","Purposeful hang up?"],
    ["🐧","lol I love our fake ish texts."]
  ], footer: "June 3, 2024. Folder 004." },

  { headline: "The first thing said about the box, before either of them had opened it.", lines: [
    ["","\"It's heavier than it looks.\""],
    ["","\"It usually surprises people.\""],
    ["","\"What's in it?\""],
    ["","\"Years.\""]
  ], footer: "The Record Begins. Folder 001." },

  { headline: "One year later, he went looking for it and it wasn't there.", lines: [
    ["🧁","Speaking of this topic, did you go back and delete part of a conversation about this?"],
    ["🐧","I don't think I deleted... it's been a long time since I've deleted anything. Kinda forgot I could do that."]
  ], footer: "December 30, 2025. The message being discussed does not exist anywhere in the record." },

  { headline: "A version of himself, performed for everyone else — and he named it himself.", lines: [
    ["🧁","I was just gonna ask if I was acting like Normal Brad on texting lol."],
    ["🐧","lol yeah I think so. Normal Brad."]
  ], footer: "May 4, 2024. Folder 017." },

  { headline: "One hour of the day outweighs any other four combined.", lines: [
    ["","36,261 messages between 7:00 and 8:00 PM."],
    ["","Nearly three times an average daytime hour."]
  ], footer: "This record didn't live in stolen daytime minutes. It lived in evenings." },

  { headline: "Of 6,704 uses of the word \"sorry\" in the archive:", lines: [
    ["🧁","3,847"],
    ["🐧","2,696"]
  ], footer: "The imbalance holds steady across nearly the entire record." },

  { headline: "A year later, it comes back to both of them at once, unprompted.", lines: [
    ["🐧","What did you do with that hotel key?"],
    ["🧁","I do believe I threw it away."],
    ["🧁","Fuck, we need another hotel key, and a whole night."],
    ["🐧","At the time I really didn't think anything of it, and just yesterday I remembered it and thought — uh oh."]
  ], footer: "May 13, 2024." },

  { headline: "Not a code word — a real sabbatical from work, and something he was keeping quiet.", lines: [
    ["🧁","I did unpin all of my pins by accident."],
    ["🧁","If I knew it was before the sabbatical you would have fucking felt amazing."]
  ], footer: "June 24, 2024. He was still hiding it from coworkers months later." },

  { headline: "She was already afraid of losing it, months before the ending.", lines: [
    ["🐧","I want to make sure all my pins are also pinned for you. So in case I lose my Telegram, you'll have my favs for me!! 💗"]
  ], footer: "September 12, 2025. Pinned by 🧁." },

  { headline: "The closest thing to it in the entire record — still shortened, three weeks before the end.", lines: [
    ["🧁","ILY so much. So much it's often unbearable and you happen to be the only thing to fix it."]
  ], footer: "December 11, 2025. Pinned by 🐧." },

  { headline: "Pinned on the final day the archive records.", lines: [
    ["🐧","I mean honestly I prayed about it all day yesterday. I didn't know I was going to. But I was worried all day for you. I want you and Hillary to be happy."]
  ], footer: "January 7, 2026. Pinned by 🧁." },

  { headline: "The very first emoji ritual, four days into the whole archive.", lines: [
    ["🐧","🫶🏻 love it. Goodnight!"],
    ["🐧","That's my new fav emoji!"]
  ], footer: "May 7, 2024." },

  { headline: "What a stranger would have seen, if they'd looked.", lines: [
    ["🧁","If a neutral 3rd party saw us hanging out they would be like — why do Chris and Meredith look so happy?!"]
  ], footer: "May 30, 2024." },

  { headline: "A small ritual, described in her own words as she lived it.", lines: [
    ["🐧","Pinned for me to hear every night made me so happy! Goodnight Chris 😘🫶🏻"]
  ], footer: "June 15, 2024." },

];

let currentIndex = 0;

function renderCards() {
  const carousel = document.getElementById('carousel');
  carousel.innerHTML = CARDS.map((card, i) => {
    const speakers = [...new Set(card.lines.map(l => l[0]))].join(' ');
    const linesHtml = card.lines.map(([who, text]) =>
      '<div class="card-line"><span class="who">' + who + '</span><span>' + text + '</span></div>'
    ).join('');
    return '<div class="quote-card" data-index="' + i + '">' +
      '<div class="card-icons">' + speakers + '</div>' +
      '<div class="card-headline">' + card.headline + '</div>' +
      '<div class="card-lines">' + linesHtml + '</div>' +
      '<div class="card-footer">' + card.footer + '</div>' +
      '</div>';
  }).join('');
  updateCounter();
}

function updateCounter() {
  document.getElementById('cardCounter').textContent = (currentIndex + 1) + ' / ' + CARDS.length;
}

document.getElementById('carousel').addEventListener('scroll', function() {
  const carousel = document.getElementById('carousel');
  const slideWidth = carousel.scrollWidth / CARDS.length;
  currentIndex = Math.round(carousel.scrollLeft / slideWidth);
  updateCounter();
}, { passive: true });

document.getElementById('unlockBtn').addEventListener('click', () => {
  const pass = document.getElementById('passInput').value;
  if (pass === PASSPHRASE) {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('gallery').classList.add('show');
    renderCards();
  } else {
    document.getElementById('lockError').textContent = 'Incorrect passphrase.';
  }
});

document.getElementById('passInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('unlockBtn').click();
});

document.getElementById('lockAgainBtn').addEventListener('click', () => {
  document.getElementById('gallery').classList.remove('show');
  document.getElementById('passInput').value = '';
  document.getElementById('lockScreen').style.display = 'flex';
});
</script>

</body>
</html>
