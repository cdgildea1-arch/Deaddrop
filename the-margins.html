<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>The Margins</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #f4ecdd;
    color: #3a3227;
    font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  }
  .lock-screen {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    padding-bottom: max(30px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .lock-icon { font-size: 40px; margin-bottom: 16px; opacity: 0.9; }
  .lock-title { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .lock-sub { font-size: 13px; color: #8a7a63; margin-bottom: 28px; max-width: 280px; line-height: 1.5; font-family: -apple-system, sans-serif; }
  .lock-input {
    width: 100%; max-width: 280px;
    background: #fffaf0;
    border: 1px solid #d8c9a8;
    border-radius: 10px;
    padding: 13px 14px;
    font-size: 16px;
    margin-bottom: 14px;
    text-align: center;
    font-family: -apple-system, sans-serif;
  }
  .lock-btn {
    background: #a9835a;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px 34px;
    font-size: 15px;
    font-weight: 600;
    font-family: -apple-system, sans-serif;
  }
  .lock-error { color: #a3453a; font-size: 12px; margin-top: 10px; min-height: 16px; font-family: -apple-system, sans-serif; }

  .app { display: none; max-width: 520px; margin: 0 auto; padding: 0 0 30px; }
  .app.show { display: block; }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: max(12px, env(safe-area-inset-top)) 20px 12px;
    font-family: -apple-system, sans-serif;
  }
  .top-bar button { background: none; border: none; color: #a9835a; font-size: 13px; }
  .archive-title { text-align: center; font-size: 12px; letter-spacing: 3px; color: #a9835a; font-family: -apple-system, sans-serif; }

  .identity-picker {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 6px 20px 20px;
  }
  .id-btn {
    flex: 1;
    max-width: 160px;
    background: #fffaf0;
    border: 1px solid #d8c9a8;
    border-radius: 12px;
    padding: 12px;
    font-family: -apple-system, sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: #6b5a45;
  }
  .id-btn.active { background: #a9835a; color: #fff; border-color: #a9835a; }

  .compose {
    padding: 0 20px 20px;
  }
  .compose textarea {
    width: 100%;
    min-height: 80px;
    background: #fffaf0;
    border: 1px solid #d8c9a8;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 16px;
    font-family: Georgia, serif;
    resize: vertical;
  }
  .compose button {
    margin-top: 10px;
    width: 100%;
    background: #a9835a;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    font-family: -apple-system, sans-serif;
  }

  .notes-list { padding: 0 20px; }
  .note-card {
    background: #fffaf0;
    border: 1px solid #e3d5b8;
    border-left: 3px solid #a9835a;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .note-meta {
    font-size: 11px;
    color: #a9835a;
    font-family: -apple-system, sans-serif;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .note-text { font-size: 16px; line-height: 1.55; white-space: pre-wrap; }
  .note-del {
    background: none; border: none; color: #a3453a; font-size: 11px; font-family: -apple-system, sans-serif;
  }
  .empty-state { text-align: center; color: #b3a488; font-size: 13px; padding: 30px 0; font-family: -apple-system, sans-serif; }
</style>
</head>
<body>

  <div id="lockScreen" class="lock-screen">
    <div class="lock-icon">✏️</div>
    <div class="lock-title">The Margins</div>
    <div class="lock-sub">A running notebook, just for the two of you.</div>
    <input type="password" id="passInput" class="lock-input" placeholder="Passphrase" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="unlockBtn" class="lock-btn">Enter</button>
    <div class="lock-error" id="lockError"></div>
  </div>

  <div id="app" class="app">
    <div class="top-bar">
      <button id="lockAgainBtn">🔒 Lock</button>
      <div class="archive-title">THE MARGINS</div>
      <span style="width:40px;"></span>
    </div>

    <div class="identity-picker">
      <button class="id-btn active" id="idCupcake">🧁 Cupcake</button>
      <button class="id-btn" id="idPenguin">🐧 Penguin</button>
    </div>

    <div class="compose">
      <textarea id="noteInput" placeholder="Write a note…"></textarea>
      <button id="saveNoteBtn">Save Note</button>
    </div>

    <div class="notes-list" id="notesList"></div>
  </div>

<script>
const PASSPHRASE = "cupcake";
let currentIdentity = "🧁 Cupcake";
let notes = [];

function loadNotes() {
  try {
    const saved = localStorage.getItem('margins_notes');
    notes = saved ? JSON.parse(saved) : [];
  } catch (e) { notes = []; }
}

function saveNotes() {
  try { localStorage.setItem('margins_notes', JSON.stringify(notes)); } catch (e) {}
}

function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' · ' +
    d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function renderNotes() {
  const list = document.getElementById('notesList');
  list.innerHTML = '';
  if (!notes.length) {
    list.innerHTML = '<div class="empty-state">No notes yet. Start the margin.</div>';
    return;
  }
  const sorted = [...notes].sort((a, b) => new Date(b.time) - new Date(a.time));
  sorted.forEach(n => {
    const card = document.createElement('div');
    card.className = 'note-card';
    card.innerHTML = `
      <div class="note-meta">
        <span>${n.author} — ${formatTime(n.time)}</span>
        <button class="note-del" data-id="${n.id}">delete</button>
      </div>
      <div class="note-text"></div>
    `;
    card.querySelector('.note-text').textContent = n.text;
    list.appendChild(card);
  });
  list.querySelectorAll('.note-del').forEach(btn => {
    btn.addEventListener('click', () => {
      notes = notes.filter(n => n.id !== btn.getAttribute('data-id'));
      saveNotes();
      renderNotes();
    });
  });
}

document.getElementById('idCupcake').addEventListener('click', () => {
  currentIdentity = "🧁 Cupcake";
  document.getElementById('idCupcake').classList.add('active');
  document.getElementById('idPenguin').classList.remove('active');
});
document.getElementById('idPenguin').addEventListener('click', () => {
  currentIdentity = "🐧 Penguin";
  document.getElementById('idPenguin').classList.add('active');
  document.getElementById('idCupcake').classList.remove('active');
});

document.getElementById('saveNoteBtn').addEventListener('click', () => {
  const input = document.getElementById('noteInput');
  const text = input.value.trim();
  if (!text) return;
  notes.push({
    id: crypto.randomUUID(),
    author: currentIdentity,
    text: text,
    time: new Date().toISOString()
  });
  saveNotes();
  input.value = '';
  renderNotes();
});

document.getElementById('unlockBtn').addEventListener('click', () => {
  const pass = document.getElementById('passInput').value.trim().toLowerCase();
  if (pass === PASSPHRASE) {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('app').classList.add('show');
    loadNotes();
    renderNotes();
  } else {
    document.getElementById('lockError').textContent = 'Incorrect passphrase.';
  }
});

document.getElementById('passInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('unlockBtn').click();
});

document.getElementById('lockAgainBtn').addEventListener('click', () => {
  document.getElementById('app').classList.remove('show');
  document.getElementById('passInput').value = '';
  document.getElementById('lockScreen').style.display = 'flex';
});
</script>
</body>
</html>
