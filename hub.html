<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Hub</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    background: #0a0e0a;
    color: #e8f5ec;
  }
  .wrap {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    padding-bottom: max(30px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .footer-note {
    font-size: 30px;
    letter-spacing: 8px;
    margin-bottom: 36px;
  }
  .menu {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  a.menu-item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #121812;
    border: 1px solid #1e3a24;
    border-radius: 16px;
    padding: 16px 18px;
    text-decoration: none;
    color: #e8f5ec;
    text-align: left;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  a.menu-item:active { transform: scale(0.97); background: #16211a; }
  .menu-icon { font-size: 26px; flex-shrink: 0; }
  .menu-text { flex: 1; }
  .menu-title { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
  .menu-sub { font-size: 12px; color: #7a998a; }
  .lock-badge { font-size: 13px; opacity: 0.6; }
</style>
</head>
<body>
  <div class="wrap">
