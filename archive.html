<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>The Penguin Archive</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow-x: hidden; }
  body { font-family: Georgia, serif; background: #faf7f2; color: #2b2b2b; line-height: 1.6; }
  #gate {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 0 24px;
    padding-bottom: max(40px, env(safe-area-inset-bottom));
  }
  .emblem { font-size: 3.6rem; letter-spacing: 22px; margin-bottom: 14px; }
  .emblem span { display: inline-block; }
  .divider { width: 70px; height: 1px; background: #c9a876; margin: 26px auto 42px; }
  h1.title { font-size: 2.6rem; font-weight: normal; letter-spacing: 1px; margin-bottom: 8px; color: #3a2f22; }
  .subtitle { font-style: italic; color: #8a6d3b; font-size: 1.15rem; margin-bottom: 36px; }
  input { padding: 12px 14px; font-size: 16px; width: 100%; max-width: 320px; font-family: inherit; border: 1px solid #d8c9ae; border-radius: 8px; background: #fffdfa; display: block; margin: 0 auto; }
  input:focus { outline: none; border-color: #b08d4f; }
  button { padding: 13px 18px; background: #8a6d3b; color: #fdf9f2; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-family: Georgia, serif; letter-spacing: 0.5px; display: block; width: 100%; max-width: 320px; margin: 16px auto 0; }
  button:hover { background: #6f5730; }
  #error { color: #a33; margin-top: 14px; font-size: 0.85rem; font-style: italic; }
  #content { display: none; white-space: pre-wrap; max-width: 700px; margin: 40px auto 80px; padding: 0 24px; }
  #content h1, #content h2 { font-weight: normal; text-align: center; color: #3a2f22; letter-spacing: 1px; }
  #content h1 { font-size: 2.4rem; margin-bottom: 10px; }
  #content h2 { font-size: 1.3rem; font-style: italic; color: #8a6d3b; margin-top: 0; margin-bottom: 36px; }
  #content .emblem { font-size: 3.2rem; letter-spacing: 18px; text-align: center; margin-bottom: 14px; }
  #content .divider { width: 70px; height: 1px; background: #c9a876; margin: 0 auto 36px; }
  #continueLink { display: none; text-align: center; margin: 20px 0 60px; }
  #continueLink a { display: inline-block; font-size: 2rem; color: #8a6d3b; text-decoration: none; border: 1px solid #d8c9ae; border-radius: 50%; width: 56px; height: 56px; line-height: 52px; }
  .gate-back { position: fixed; top: max(16px, env(safe-area-inset-top)); left: 20px; font-size: 13px; color: #a9835a; text-decoration: none; font-family: -apple-system, sans-serif; z-index: 5; }
  .book-header {
    display: none !important;
    position: sticky !important; top: 0 !important; z-index: 999 !important;
    background: rgba(250,247,242,0.94) !important; backdrop-filter: blur(8px);
    border-bottom: 1px solid #d8c9a8 !important;
    padding-top: max(8px, env(safe-area-inset-top)) !important;
    font-family: -apple-system, sans-serif !important;
    width: 100% !important; box-sizing: border-box !important;
  }
  .book-header.show { display: block !important; }
  .book-header .header-row1 {
    display: flex !important; align-items: center !important; justify-content: space-between !important;
    padding: 4px 14px 6px !important;
  }
  .book-header .back-btn { color: #a9835a !important; font-size: 13px !important; background: none !important; border: none !important; padding: 4px 2px !important; white-space: nowrap !important; flex-shrink: 0 !important; width: auto !important; max-width: none !important; display: inline-block !important; margin: 0 !important; }
  .book-header .header-title { font-size: 11px !important; letter-spacing: 2px !important; color: #8a7a63 !important; text-transform: uppercase !important; }
  .book-header .bookmark-btn { font-size: 17px !important; background: none !important; border: none !important; padding: 4px 2px !important; flex-shrink: 0 !important; width: auto !important; max-width: none !important; display: inline-block !important; margin: 0 !important; }
  .book-header .header-row2 { padding: 0 14px 10px !important; display: flex !important; align-items: center !important; gap: 8px !important; }
  .book-header input#searchInput {
    flex: 1 1 auto !important; min-width: 0 !important; width: 100% !important; display: block !important;
    border: 1px solid #d8c9a8 !important; border-radius: 999px !important;
    padding: 8px 14px !important; font-size: 15px !important; background: #fffdf8 !important; color: #2b2419 !important;
    font-family: -apple-system, sans-serif !important; margin: 0 !important; height: auto !important;
    -webkit-appearance: none !important; appearance: none !important;
  }
  .book-header input#searchInput:focus { outline: none; border-color: #a9835a !important; }
  .book-header .search-count { font-size: 11px !important; color: #8a7a63 !important; white-space: nowrap !important; flex-shrink: 0 !important; }
  mark.a-hit { background: #f2e2b8; color: inherit; padding: 0 2px; border-radius: 3px; }
  mark.a-hit.a-current { background: #a9714f; color: #fffdf8; }
  .pin-popup {
    position: fixed; z-index: 9997; background: #3a2f22; color: #f4ecdd;
    border: none; border-radius: 999px; padding: 9px 16px; font-size: 13px;
    font-family: -apple-system, sans-serif; box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    display: none; transform: translate(-50%, -120%);
  }
  .pin-popup.show { display: block; }
  .pin-toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #3a2f22; color: #f4ecdd; padding: 10px 18px; border-radius: 999px;
    font-family: -apple-system, sans-serif; font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease; z-index: 9998;
  }
  .pin-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

<button id="pinPopup" class="pin-popup">📌 Pin this</button>
<div class="pin-toast" id="pinToast"></div>

<div class="book-header" id="bookHeader">
  <div class="header-row1">
    <button id="backBtn" class="back-btn" type="button">← Back</button>
    <span class="header-title">THE ARCHIVE</span>
    <button id="bookmarkBtn" class="bookmark-btn" type="button">🔖</button>
  </div>
  <div class="header-row2">
    <input type="search" id="searchInput" placeholder="Search the Archive…" autocapitalize="off" autocorrect="off" spellcheck="false">
    <span class="search-count" id="searchCount"></span>
  </div>
</div>

<div id="gate">

  <div id="error"></div>
</div>

<div id="content"></div>
<div id="continueLink">

function fromBase64(str) {
  return Uint8Array.from(atob(str), c => c.charCodeAt(0));
}

async function deriveKey(passphrase, saltBytes) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBytes, iterations: 250000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

function toBase64(bytes) {
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}

let currentPassphrase = null; // set on successful unlock, kept only in memory

async function loadExistingPins(passphrase) {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/pins?select=*&order=created_at.desc&limit=1`,
    { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
  );
  const rows = await res.json();
  if (!rows || rows.length === 0) return [];
  const row = rows[0];
  const salt = fromBase64(row.salt);
  const iv = fromBase64(row.iv);
  const ciphertext = fromBase64(row.ciphertext);
  const key = await deriveKey(passphrase, salt);
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
  return JSON.parse(new TextDecoder().decode(buf));
}

async function savePin(pinObj) {
  if (!currentPassphrase) return;
  const existing = await loadExistingPins(currentPassphrase);
  existing.push(pinObj);

  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(currentPassphrase, salt);
  const enc = new TextEncoder();
  const ciphertextBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(existing)));

  await fetch(`${SUPABASE_URL}/rest/v1/pins`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({
      salt: toBase64(salt),
      iv: toBase64(iv),
      ciphertext: toBase64(new Uint8Array(ciphertextBuf))
    })
  });
}

function showPinToast(text) {
  const t = document.getElementById('pinToast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function findNearestContext(startEl) {
  let date = null, folder = null, speaker = null;

  const dialogueEl = startEl.closest ? startEl.closest('p.dialogue') : null;
  if (dialogueEl) {
    if (dialogueEl.classList.contains('penguin')) speaker = '🐧';
    else if (dialogueEl.classList.contains('cupcake')) speaker = '🧁';
  }

  let node = startEl;
  while (node) {
    if (node.nodeType === 1) {
      if (!date && node.matches && node.matches('p.date')) date = node.textContent.trim();
      if (!folder && node.matches && node.matches('h3.folder')) folder = node.textContent.trim();
    }
    node = node.previousElementSibling || node.parentElement;
    if (date && folder) break;
  }
  return { date, folder, speaker };
}

(function setupPinCapture() {
  const popup = document.getElementById('pinPopup');
  let pendingSelection = null;

  document.addEventListener('selectionchange', () => {
    const sel = window.getSelection();
    const text = sel.toString().trim();
    const contentEl = document.getElementById('content');
    if (!text || contentEl.style.display === 'none' || sel.rangeCount === 0) {
      popup.classList.remove('show');
      pendingSelection = null;
      return;
    }
    const range = sel.getRangeAt(0);
    const rect = range.getBoundingClientRect();
    if (rect.width === 0 && rect.height === 0) { popup.classList.remove('show'); return; }

    let node = range.startContainer;
    while (node && node.nodeType !== 1) node = node.parentNode;
    const ctx = node ? findNearestContext(node) : { date: null, folder: null, speaker: null };

    pendingSelection = { text, date: ctx.date || ctx.folder, speaker: ctx.speaker };
    popup.style.left = (rect.left + rect.width / 2) + 'px';
    popup.style.top = rect.top + 'px';
    popup.classList.add('show');
  });

  popup.addEventListener('click', async () => {
    if (!pendingSelection) return;
    popup.classList.remove('show');
    const pinObj = {
      text: pendingSelection.text,
      speaker: pendingSelection.speaker,
      date: pendingSelection.date,
      source: 'Archive',
      pinnedAt: new Date().toISOString()
    };
    window.getSelection().removeAllRanges();
    try {
      await savePin(pinObj);
      showPinToast('📌 Pinned to the Memory Jar');
    } catch (e) {
      showPinToast('Failed: ' + (e && e.message ? e.message : 'unknown error'));
    }
  });
})();

async function unlock() {
  const errorDiv = document.getElementById('error');
  const passphrase = document.getElementById('passphrase').value;
  errorDiv.textContent = '';

  if (!passphrase) {
    errorDiv.textContent = 'Enter a passphrase.';
    return;
  }

  try {
    const salt = fromBase64(ARCHIVE_SALT_B64);
    const iv = fromBase64(ARCHIVE_IV_B64);
    const ciphertext = fromBase64(ARCHIVE_CT_B64);

    const key = await deriveKey(passphrase, salt);

    const decryptedBuf = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv }, key, ciphertext
    );

    const dec = new TextDecoder();
    const text = dec.decode(decryptedBuf);

    document.getElementById('content').innerHTML = text;
    document.getElementById('continueLink').style.display = 'block';
    document.getElementById('content').style.display = 'block';
    document.getElementById('gate').style.display = 'none';
    document.getElementById('bookHeader').classList.add('show');
    currentPassphrase = passphrase;

    const headingEls = document.querySelectorAll('#content .a-folder, #content .a-date, #content .a-part');
    headingEls.forEach((h, i) => { h.dataset.hidx = i; });

    try {
      const raw = localStorage.getItem('archiveBookmark');
      const saved = JSON.parse(raw);
      if (saved && saved.hidx !== null && saved.hidx !== undefined) {
        const jump = () => {
          const target = document.querySelector('#content [data-hidx="' + saved.hidx + '"]');
          if (target) {
            target.scrollIntoView({ block: 'start' });
            showPinToast('🔖 Back to "' + saved.label + '"');
          } else {
            showPinToast('Bookmark target not found');
          }
        };
        requestAnimationFrame(() => requestAnimationFrame(jump));
      } else if (saved) {
        showPinToast('No bookmark position saved yet');
      }
    } catch (e) {}
  } catch (e) {
    errorDiv.textContent = 'Wrong passphrase, or content unavailable.';
  }
}

let searchHits = [], searchCursor = -1, searchDebounce;

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function clearSearchMarks() {
  const blocks = document.querySelectorAll('#content p, #content h2, #content h3, #content h4');
  blocks.forEach(b => { if (b.dataset.original) b.innerHTML = b.dataset.original; });
  searchHits = [];
  searchCursor = -1;
  document.getElementById('searchCount').textContent = '';
}

function runSearch(term) {
  clearSearchMarks();
  if (!term || term.trim().length < 2) return;
  const re = new RegExp(escapeRegex(term.trim()), 'gi');
  const blocks = document.querySelectorAll('#content p, #content h2, #content h3, #content h4');
  blocks.forEach(b => {
    if (!b.dataset.original) b.dataset.original = b.innerHTML;
    const original = b.dataset.original;
    const replaced = original.replace(/>([^<]+)(?=<|$)/g, (full, chunk) => {
      if (!re.test(chunk)) { re.lastIndex = 0; return full; }
      re.lastIndex = 0;
      return '>' + chunk.replace(re, m => `<mark class="a-hit">${m}</mark>`);
    });
    if (replaced !== original) b.innerHTML = replaced;
  });
  searchHits = Array.from(document.querySelectorAll('#content mark.a-hit'));
  document.getElementById('searchCount').textContent = searchHits.length ? `0/${searchHits.length}` : 'none';
  if (searchHits.length) goToHit(0);
}

function goToHit(i) {
  if (!searchHits.length) return;
  if (searchCursor >= 0 && searchHits[searchCursor]) searchHits[searchCursor].classList.remove('a-current');
  searchCursor = (i + searchHits.length) % searchHits.length;
  searchHits[searchCursor].classList.add('a-current');
  searchHits[searchCursor].scrollIntoView({ behavior: 'smooth', block: 'center' });
  document.getElementById('searchCount').textContent = `${searchCursor + 1}/${searchHits.length}`;
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => runSearch(e.target.value), 220);
});
document.getElementById('searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); goToHit(searchCursor + (e.shiftKey ? -1 : 1)); }
  if (e.key === 'Escape') { e.target.value = ''; clearSearchMarks(); }
});

function nearestHeadingLabel() {
  const headings = Array.from(document.querySelectorAll('#content .a-folder, #content .a-date, #content .a-part'));
  let best = null;
  for (const h of headings) {
    const rect = h.getBoundingClientRect();
    if (rect.top <= 120) best = h;
    else break;
  }
  return best ? best.textContent.trim() : null;
}

function nearestHeadingIndex() {
  const headings = Array.from(document.querySelectorAll('#content .a-folder, #content .a-date, #content .a-part'));
  let best = null;
  for (const h of headings) {
    const rect = h.getBoundingClientRect();
    if (rect.top <= 120) best = h;
    else break;
  }
  return best ? best.dataset.hidx : null;
}

function saveBookmark() {
  const label = nearestHeadingLabel();
  const hidx = nearestHeadingIndex();
  const bookmark = {
    label: label || 'the top',
    hidx: hidx,
    savedAt: new Date().toISOString()
  };
  try {
    localStorage.setItem('archiveBookmark', JSON.stringify(bookmark));
    showPinToast('🔖 Saved: "' + bookmark.label + '"');
  } catch (e) {
    showPinToast('Couldn\'t save bookmark: ' + e.message);
  }
}

document.getElementById('bookmarkBtn').addEventListener('click', saveBookmark);

document.getElementById('backBtn').addEventListener('click', () => {
  window.location.href = 'hub.html';
});
