<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>The Cards</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Georgia, serif; background: #faf7f2; color: #2b2b2b; }

  #gate {
    min-height: 100dvh; display: flex; flex-direction: column; justify-content: center;
    align-items: center; text-align: center; padding: 0 24px;
    padding-bottom: max(40px, env(safe-area-inset-bottom));
  }
  .gate-back { position: fixed; top: max(16px, env(safe-area-inset-top)); left: 20px; font-size: 13px; color: #a9835a; text-decoration: none; font-family: -apple-system, sans-serif; z-index: 5; }
  .emblem { font-size: 3.6rem; letter-spacing: 22px; margin-bottom: 14px; }
  .emblem span { display: inline-block; }
  .divider { width: 70px; height: 1px; background: #c9a876; margin: 26px auto 42px; }
  h1.title { font-size: 2.6rem; font-weight: normal; letter-spacing: 1px; margin-bottom: 8px; color: #3a2f22; }
  .subtitle { font-style: italic; color: #8a6d3b; font-size: 1.15rem; margin-bottom: 36px; }
  input { padding: 12px 14px; font-size: 16px; width: 100%; max-width: 320px; font-family: inherit; border: 1px solid #d8c9ae; border-radius: 8px; background: #fffdfa; display: block; margin: 0 auto; }
  input:focus { outline: none; border-color: #b08d4f; }
  button { padding: 13px 18px; background: #8a6d3b; color: #fdf9f2; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-family: Georgia, serif; letter-spacing: 0.5px; display: block; width: 100%; max-width: 320px; margin: 16px auto 0; }
  button:hover { background: #6f5730; }
  #error { color: #a33; margin-top: 14px; font-size: 0.85rem; font-style: italic; }

  #reader { display: none; min-height: 100vh; background: #f4ecdd; color: #3a3227; }
  .book-header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: rgba(244,236,221,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid #d8c9a8; font-family: -apple-system, sans-serif; }
  .book-header button { background: none; border: none; color: #a9835a; font-size: 13px; padding: 4px 0; width: auto; margin: 0; }
  .book-header .title-mini { font-size: 12px; letter-spacing: 2px; color: #8a7a63; }

  .card-emoji { text-align: center; font-size: 26px; margin: 28px 0 6px; letter-spacing: 8px; }
  .card-counter { text-align: center; font-size: 12px; letter-spacing: 1px; color: #a9835a; font-family: -apple-system, sans-serif; margin-bottom: 24px; }

  .card-stage { max-width: 520px; margin: 0 auto; padding: 0 22px 40px; min-height: 340px; }
  .the-card {
    background: #fffdf8; border: 1px solid #d8c9a8; border-radius: 18px;
    padding: 28px 24px; box-shadow: 0 4px 18px rgba(107,68,35,0.1);
  }
  .card-headline { font-size: 1.15rem; font-style: italic; color: #6b4423; line-height: 1.5; margin-bottom: 20px; text-align: center; }
  .card-line { font-size: 1.05rem; line-height: 1.7; margin-bottom: 10px; }
  .card-line .tag { display: inline-block; width: 1.3em; text-align: center; margin-right: 0.35em; }
  .card-footer { margin-top: 20px; padding-top: 16px; border-top: 1px solid #ede3cd; font-family: -apple-system, sans-serif; font-size: 12px; color: #a9835a; text-align: center; font-style: italic; }

  .card-nav { display: flex; justify-content: space-between; align-items: center; max-width: 520px; margin: 0 auto; padding: 0 22px calc(50px + env(safe-area-inset-bottom)); }
  .nav-btn {
    width: auto; margin: 0; background: #fffdf8; color: #6b4423; border: 1px solid #d8c9a8;
    border-radius: 999px; padding: 12px 22px; font-size: 14px;
  }
  .nav-btn:disabled { opacity: 0.35; }
  .nav-btn.primary { background: #6b5535; color: #fdf9f2; border: none; }

  .loading-note { text-align: center; padding: 60px 20px; color: #8a7a63; font-family: -apple-system, sans-serif; font-size: 13px; font-style: italic; }
</style>
</head>
<body>

<div id="gate">
  <a href="hub.html" class="gate-back">← Back</a>
  <div class="emblem"><span>🧁</span><span>🐧</span></div>
  <h1 class="title">The Cards</h1>
  <p class="subtitle">small proofs, pulled and kept</p>
  <div class="divider"></div>
  <input id="passphrase" type="password" placeholder="Passphrase" autocapitalize="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter') unlock()">
  <button onclick="unlock()">Unlock</button>
  <div id="error"></div>
</div>

<div id="reader">
  <div class="book-header">
    <button id="backBtn" type="button">← Back</button>
    <span class="title-mini">THE CARDS</span>
    <span style="width:44px"></span>
  </div>

  <div class="card-emoji">🐧 &nbsp; 🃏 &nbsp; 🧁</div>
  <div class="card-counter" id="cardCounter"></div>

  <div class="card-stage" id="cardStage">
    <div class="loading-note">Loading…</div>
  </div>

  <div class="card-nav" id="cardNav" style="display:none;">
    <button class="nav-btn" id="prevBtn" type="button">← Prev</button>
    <button class="nav-btn primary" id="nextBtn" type="button">Next →</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://lecudeiafwhyhufceurv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Q9ESUnHKw3-FPpGeTYRfSA_4sg55UMD';

function fromBase64(str) {
  return Uint8Array.from(atob(str), c => c.charCodeAt(0));
}

async function deriveKey(passphrase, saltBytes) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBytes, iterations: 250000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

let CARDS = [];
let currentIndex = 0;

function renderCard(i) {
  const card = CARDS[i];
  const stage = document.getElementById('cardStage');
  const linesHtml = card.lines.map(([speaker, text]) =>
    `<p class="card-line"><span class="tag">${esc(speaker)}</span>${esc(text)}</p>`
  ).join('');
  stage.innerHTML = `
    <div class="the-card">
      <div class="card-headline">${esc(card.headline)}</div>
      ${linesHtml}
      <div class="card-footer">${esc(card.footer)}</div>
    </div>
  `;
  document.getElementById('cardCounter').textContent = `${i + 1} / ${CARDS.length}`;
  document.getElementById('prevBtn').disabled = (i === 0);
  document.getElementById('nextBtn').disabled = (i === CARDS.length - 1);
}

document.getElementById('prevBtn').addEventListener('click', () => {
  if (currentIndex > 0) { currentIndex--; renderCard(currentIndex); }
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if (currentIndex < CARDS.length - 1) { currentIndex++; renderCard(currentIndex); }
});
document.getElementById('backBtn').addEventListener('click', () => {
  window.location.href = 'hub.html';
});

async function unlock() {
  const errorDiv = document.getElementById('error');
  const passphrase = document.getElementById('passphrase').value;
  errorDiv.textContent = '';

  if (!passphrase) {
    errorDiv.textContent = 'Enter a passphrase.';
    return;
  }

  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/cards?select=*&order=created_at.desc&limit=1`,
      { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    const rows = await res.json();
    if (!rows || rows.length === 0) {
      errorDiv.textContent = 'No cards found.';
      return;
    }

    const row = rows[0];
    const salt = fromBase64(row.salt);
    const iv = fromBase64(row.iv);
    const ciphertext = fromBase64(row.ciphertext);
    const key = await deriveKey(passphrase, salt);

    const decryptedBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
    const dec = new TextDecoder();
    const text = dec.decode(decryptedBuf);

    // The stored content is the raw "const CARDS = [ ... ];" block.
    // Evaluate it in an isolated function scope (not global) and pull out CARDS.
    CARDS = new Function(text + '\nreturn CARDS;')();

    if (!Array.isArray(CARDS) || CARDS.length === 0) {
      errorDiv.textContent = 'Cards data looked empty or malformed.';
      return;
    }

    document.getElementById('gate').style.display = 'none';
    document.getElementById('reader').style.display = 'block';
    document.getElementById('cardNav').style.display = 'flex';
    currentIndex = 0;
    renderCard(0);
  } catch (e) {
    errorDiv.textContent = 'Wrong passphrase, or content unavailable.';
  }
}
</script>
</body>
</html>
