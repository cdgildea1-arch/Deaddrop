  { p: "🐧: Hmmm ok that's good! Out of the norm seems weird/suspicious to me... but ok 🤷🏻‍♀️😊" },
  { p: "They talk themselves toward a version of the trip that might actually work — disc golf, something work-related, an excuse loose enough to survive scrutiny — and end, as they often do, mid-joke, not fully resolved." },
  { p: "🐧: Ok well I like your optimism on this! We'll figure something out 😊" },
  { p: "🧁: Yeah! Little more storyline involved in that thought process. Maybe get more relaxed?" },
  { p: "🐧: Huh?" },
  { p: "🧁: Lol 😂" },
  { p: "The apprentice notes this as one of dozens of folders built entirely from the same math — how much absence is plausible, how far in advance it needs to be planned, and how tired both of them sound, even while joking, of doing the arithmetic at all." },
  { h: "FOLDER 025: DIVORCE TALK" },
  { em: "17 October 2025" },
  { p: "The apprentice reads this folder braced for the crisis its title promises and finds, instead, a joke that briefly loses its footing before finding it again." },
  { p: "🧁: Don't know why I started acting like I was being listened to. Thank you Penny." },
  { p: "🐧: lol you did?!?" },
  { p: "🧁: Well like \"I hope you and your family have a good evening.\" Then I did not say I 🫶 you very loud. Like I got soft on that." },
  { p: "🐧: lol I know it's so weird for me to be this way. I'm sure something just happened one time. But if he is suspicious I wonder what he'd do you know?" },
  { p: "🧁: Ohh like hmmm want a divorce?!?" },
  { p: "🐧: I mean like tracking me and or recording. I could play off getting lost for 5 min. Yeah I kinda just needed you to tell me what to do!!" },
  { p: "The two of them are talking past each other for a moment — Brad hearing one kind of danger, Penny meaning another — before they land back on solid ground, half-joking, checking whether the feeling between them still holds the way it did earlier that day." },
  { p: "🧁: Hey so you still like me as much as you did on the bench?! I fucking do." },
  { p: "🧁: Well... 🫶🫠 That was not a trick to get you to say you do like me still instead of 💯 But it does feel better." },
  { p: "🧁: And here I am and I'm home alone. Hillary's still at her parents." },
  { p: "The apprentice notes the folder's real subject was never divorce at all — only a brief, genuine misfire between two people trying to describe the same fear from two different angles, resolved the way most of their misfires are: by simply asking, plainly, whether the other still feels the same." },
  { p: "FOLDER 050 — EVERYTHING AT ONCE 25 November 2024" },
  { p: "The apprentice found this folder by accident, running a different kind of search than he's used on this archive before — not for a name, a date, or a theme, but for length. He wanted to know, out of curiosity more than method, what the longest single message in the entire two-hundred-nine-thousand-message record actually was." },
  { p: "It's six hundred and five words. It's from Brad. And it was sent one day before the trust folder already catalogued elsewhere in this archive." },
  { p: "The apprentice reads it as what it clearly is: a man trying to get ahead of something, all at once, in a single unbroken message instead of the usual back-and-forth. He lays out his stresses in something close to an outline — money, work, a business partner named Marcus who he feels takes advantage of him without meaning to, a low mood he's careful to name without dwelling on. Then, in the middle of it, he arrives at the actual thing." },
  { p: "Joshua had come to Brad's own house — a Thursday morning, to tell him about an upcoming deployment. Brad hadn't wanted him to know the address at all; he'd once gone back and physically removed shipping labels from a delivery specifically so Joshua wouldn't learn where he lived. But work had forced the meeting there anyway, and when Brad told Penny about the deployment the next afternoon, he hadn't been fully clear about where or when he'd found out. It had been on his calendar. Not specific enough. Not, he admits, a proper way to tell her at all." },
  { p: "🧁: Clearly I didn't tell you on Friday about the time and place when I found out about his deployment — my house. I had it on my calendar, but it wasn't specific enough. Plus, having it on my calendar is not good enough and a proper way to inform you. I know that." },
  { p: "The apprentice sits with the shape of the whole message — six hundred words trying to do, in one unbroken paragraph, what usually takes this correspondence days of small admissions to accomplish. It doesn't quite work. Ninety minutes later, he sends a follow-up." },
  { p: "🧁: Okay, not talking about this 👆🏻👆🏻 I put in the shared note. I sorta want to delete it for both of us so it's not staring at us in the face." },
  { p: "He sends a heart. A photo emoji. <em>That's better!</em> She answers, an hour later, with something about wanting another picture together — the conversation already moving on, the six hundred words already being folded away." },
  { p: "The next evening, the trust folder happens." },
  { em: "Cataloger's note: This is the longest single message in the full archive by a wide margin — more than four times the length of the next-longest exchange. All five of the longest messages in the entire record were sent by Brad; none by Penny. Read against the trust folder that follows it by one day, this message reframes that later exchange less as a single flashpoint and more as the visible tip of something Brad had already spent six hundred words trying, and largely failing, to get ahead of." },
  { p: "FOLDER 040 — THE SUSPICION 18--26 September 2025" },
  { p: "The apprentice has read the word \"suspicion\" so many times in this archive by now that he's stopped registering it as a word and started registering it as weather — a permanent, low pressure system sitting over almost every day in the record, mentioned so often it barely earns a second look. So he nearly skims past this stretch too, until he notices the tense has changed. Every other mention of the word in this archive is conditional — <em>if there's suspicion, in case of suspicion, to avoid suspicion.</em> This one isn't. This one has already happened." },
  { p: "🧁: So he either has proof that it's us. Or has evidence to suggest cheating but nothing to prove it. I think those are facts. He can be cryptic all he wants but if he just might have—" },
  { p: "The apprentice sits up. Nine days follow in which the word appears more than at any other point in the entire twenty-month record — not as a fear anymore, but as an ongoing situation, checked on, managed, worried over in real time." },
  { p: "🧁: I hope everything is going well and I know this is shitty right now." },
  { p: "🐧: Well I mean I guess they are all kinda related. Joshua being suspicious and me being mad are very related." },
  { p: "🐧: So far I've just kinda said, of course I don't tell you stuff, we don't talk now. Which leads to me going for a walk without telling him, cause he didn't tell me he was planning to—" },
  { p: "Five days pass without resolution. Whatever is or isn't happening on the other side of Penny's household stays entirely outside the record — the apprentice can only see it through the shape of her worry, never through its cause. Then, on the 25th, Brad checks in again, almost casually, the way you'd ask about a fever that's been dragging on too long." },
  { p: "🧁: Maybe an update soon on how the suspicion is going... interested... and yeah, I don't know." },
  { p: "🐧: Umm, I think it's just kinda been dropped. He left, and I was super careful. I think the only way to decrease the suspicion is to be super careful." },
  { p: "🐧: I feel like I got him to not ask anything for now. By being mad, and then doing everything to decrease suspicion — but I think he still is, and any little thing I do could increase it." },
  { p: "It ends the way most of the archive's dangers end: not with a confrontation, not with an answer, just a slow fade back into the ordinary background pressure it came from. The apprentice checks the following weeks for any further reference to what actually happened, what Joshua actually knew or suspected, what evidence he might have had. There isn't one. Whatever passed between the two of them in real life during these nine days, off the page, stays entirely off the page — the only trace of it is the two weeks of a woman managing someone else's suspicion from the other side of a phone." },
  { em: "Cataloger's note: This is the only sustained multi-day suspicion event in the full archive with no resolution recorded on either end — no confrontation, no confirmed discovery, no clearing of the air. It simply stops being mentioned, the way weather stops being mentioned once it clears." },
  { h: "PART VI — WEIGHT" },
  { h: "FOLDER 027: THE ANNIVERSARY" },
  { em: "25 June 2024" },
  { p: "The apprentice finds the date almost by accident, buried in the middle of an ordinary afternoon of scheduling and a shared listing for a house neither of them will buy." },
  { p: "🧁: bailar anniversary 06/25" },
  { p: "🐧: Dancing anniversary?" },
  { p: "Nothing in the folder explains further what happened on this date, or why it earned its own private name rather than an English one. The apprentice notes only that it is the first time in the record either of them assigns themselves an anniversary at all — self-declared, in a language that belongs only to the two of them, attached to nothing the archive can otherwise verify." },
  { h: "FOLDER 028: THE MAGNOLIA HOUSE" },
  { em: "3 May 2024" },
  { p: "The apprentice reads this one as a small comedy of memory — Brad trying to recall exactly which compliment he'd given Penny weeks earlier, and getting close without quite landing on it." },
  { p: "🐧: I wore a blue dress to church one day and you txted something like — I like the blue." },
  { p: "🧁: Yes your blue dress. Or blue coat. I guess both. Actually \"I like the blue\" is exactly what probably said! You nailed it." },
  { p: "🧁: Lol the blue dress text would not have been the \"flirty\" comment that I thought about for a while." },
  { p: "🐧: Haha darn I thought I guessed it!" },
  { p: "Between the two versions of the same half-remembered flirtation, a rented house comes up — searched for by name, tested the way Penny suggests, as a kind of trial run for whether it can even be found." },
  { p: "🐧: Yeah search The Magnolia House and see if you find it. It will be a good test." },
  { p: "🧁: Magnolia House hosted by Leslie?" },
  { p: "🐧: No 😔 I'll look it up." },
  { p: "The apprentice notes the small, ordinary comedy underneath it — two people, both trying to reconstruct the same compliment from memory, neither one able to agree on which version was the one that actually mattered, while a rented house sits between them, real enough to search for, elusive enough to need a second look." },
  { h: "FOLDER 029: ANXIETY" },
  { em: "29 June 2024" },
  { p: "The apprentice closes this stretch of the record on its smallest, gentlest folder — a photograph of a kitchen, offered up almost apologetically, doing more work than either of them seems to expect." },
  { p: "🐧: Weird kitchen pic. Only one I had. And this is somewhat off topic. But this decreases my anxiety. I need my house like this again!!!! Haha" },
  { p: "🧁: Awww this was the house you absolutely love?!? I love it." },
  { p: "🐧: Yep! It was all finished always clean and I loved it!!" },
  { p: "They keep talking about it for a few more lines — boards Joshua once mentioned, a memory of the house at its best — before the conversation moves on to something else, a gathering, old coworkers, a place Penny doesn't fully recognize by name." },
  { p: "🧁: I love all of it but these stood out! Just got here! The kids are fun. Disc golf basket here... so your old co-worker and my sister are here. You would fit right in!" },
  { p: "🐧: Lol my old co-worker?" },
  { p: "The apprentice notes only this: that a photograph of an old, tidy kitchen — nothing to do, on its surface, with either of them — is enough, on its own, to lower someone's anxiety. She has read enough of this record by now to understand that this is not a small thing. Very little in this archive gets to be simple. This folder, briefly, is." },
  { h: "FOLDER 035 — THE SAME MOMENT — 12 April 2025" },
  { p: "The apprentice pulls this file expecting logistics, and for eleven straight hours, that's exactly what it gives him. Whether Joshua is going to the thing at six. Whether her parents are home. Whether fifteen minutes at Tractor Supply is better than ten at the grocery store. Whether he should wait at Founders Park or have her come get him. He reads the whole exchange the way he's learned to read this archive's logistics — quickly, skimming for the moment underneath it." },
  { p: "They get their fifteen minutes. It isn't in the file. Almost nothing that matters most ever is; it happens off the page, in a truck in a parking lot, and what survives is only what gets said afterward, hours later, both of them home and alone with it." },
  { p: "🧁: Seems like I'm home alone till 930. Just found that out. Cool. Any who — I caught myself at the end whenever I said I like you, but it's probably one of the closest times I got to sa—" },
  { p: "🧁: Don't even know how obvious it was, but that's why I was laughing." },
  { p: "🐧: Oh darn! Wish I could've been with you longer!" },
  { p: "🐧: Oh my gosh, same! It was like it just almost came out." },
  { p: "🐧: I actually didn't notice for you at all. Wonder if it was the same time for both of us." },
  { p: "The apprentice slows down here. She has read the archive's other near-miss — the one everyone already knows about, the one that ends up folded into the essay about the phrase this whole record seems built around not saying. She assumed, going in, that this would be more of the same shape. It isn't." },
  { p: "🧁: Oh, so you're saying it happened to you too!? No, I think I was caught up in mine. I didn't even notice yours." },
  { p: "🧁: That's... not scary." },
  { p: "🧁: Yep, it was exactly that." },
  { p: "🐧: Yes, I wasn't going to say anything about it, but yeah. I wish I could explain the exact moment. Right at the end." },
  { p: "🧁: I mean, yeah, for me. It was right at the end whenever I kissed you the last time. Like actually leaving." },
  { p: "🐧: Maybe just after talking about being mad." },
  { p: "🐧: Oh, I think mine was before that." },
  { p: "🧁: When you were in my lap, or when I was holding your arm?!" },
  { p: "🐧: In your lap. Like right before getting off." },
  { p: "🐧: I'm sad I missed it!" },
  { p: "🐧: I really didn't hear that." },
  { p: "🧁: I'm sad I missed yours too." },
  { p: "He reads it twice, checking he has the geometry right: two people, a few feet apart in the same truck, each one privately arriving at the same edge at nearly the same second, and neither noticing the other one standing there too. They describe it afterward with more precision than either of them will ever use to describe the feeling itself — his lap, her arm, the last kiss before he got out — the way people describe the location of a thing they still aren't willing to name." },
  { p: "He asks her, later in the same conversation, whether it scares her. She says no. He says the same." },
  { p: "🧁: Well, don't worry — I'm not gonna tell you at church or anything tomorrow. ... Even though I could." },
  { p: "🐧: You should go around and hug everyone and say it!" },
  { p: "🧁: Not that crazy of an idea! I think if anyone saw me saying it to you though, they might notice a difference." },
  { p: "The apprentice closes the file with a moment that resolves almost too neatly — two people confirming, independently, that they'd each stood at the edge of the same word on the same night, and told each other about it only after it was already over." },
  { em: "Cataloger's note: This exchange sits eleven weeks before the February 17, 2025 sequence already catalogued elsewhere (the \"I love you ... being inside me\" near-miss). Read together, they complicate the archive's central finding. It isn't that the phrase was never close. It's that every time it got close, one or both of them stepped back from it in the same breath — and this may be the more important of the two records, precisely because neither of them planned it, and neither noticed the other doing the same thing at, they believe, nearly the same second." },
  { h: "FOLDER 039 — FOURTEEN MONTHS — 15 April 2025" },
  { p: "It's late in the evening by the time the apprentice reaches this part of the file, and the day behind it has already told him most of what he needs to know about the shape of an ordinary Tuesday in this record — a movie watched together, a bad case of neither of them fully following the other's texts, an hour lost to re-reading a message neither can quite parse. She almost skims past what comes after. It reads, for a moment, like more of the same tired, tender confusion." },
  { p: "Then Brad says something that isn't confused at all." },
  { p: "🧁: Yeah, I would've definitely already asked you to marry me by now... easy." },
  { p: "🐧: I mean we did kinda first bring that up umm — when, October?" },
  { p: "🧁: Oh, it's 100%. If you're — I had to take a stab at it... I probably would've proposed in 14 months and be already married by now, yeah." },
  { p: "The apprentice checks the math without meaning to. October to April is six months. Fourteen is what he thinks it would have taken, in the version of this where none of it needed hiding — not from the moment they started meeting at parks and jobsites, but from whatever quieter beginning in October he seems to be counting from. He isn't guessing wildly. He has clearly done this arithmetic before, privately, and is only now saying the answer out loud." },
  { p: "Nothing else in the file marks the moment as unusual. There's no argument before it, no crisis prompting it — only an ordinary evening, two people tired from a long day of misunderstanding each other over text, and then this: a specific number, offered easily, like a fact he's simply been carrying around." },
  { p: "A few hours later, worn out and heading toward sleep, he returns to it once more, smaller this time, no math attached." },
  { p: "🧁: I'm glad you're asleep. I'm just gonna be thinking about you forever." },
  { p: "The apprentice notices what the file doesn't — that \"forever\" and \"fourteen months\" are, in this record, doing the same work. One is a timeline for a version of their life that was never going to happen. The other is what's left once you take the timeline away and keep only the wanting." },
  { em: "Cataloger's note: This is the only place in the archive where a specific proposal timeline is stated in figures. \"Forever\" appears 303 times across the full record. A number never does, again." },
  { p: "FOLDER 041 — PERMISSION 26 April 2025" },
  { p: "The apprentice reads this folder twice, because the first time through he isn't sure he's caught what actually happened in it. Nothing about the day announces itself. It starts like most of their afternoons — small talk, a joke, a video sent back and forth — and somewhere in the middle of it, Brad floats an idea that reads, on its surface, like nothing more than a game." },
  { p: "🧁: What if we actually went on a date and started from scratch? So a faux first date. Dinner, and we talk about ourselves. See how different that would look. Hmm, I know I didn't descri—" },
  { p: "The apprentice slows down here. It isn't really a proposal for an evening out. It's closer to grief, dressed as a game — a wish for a version of their own story that never got to happen the ordinary way. No meeting for the first time over a table. No getting-to-know-you conversation, unweighted by everything that came before it. Just two people who started in the middle of something, wondering out loud what the beginning might have felt like if either of them had been allowed to have one." },
  { p: "Neither of them follows up on the idea. It isn't planned, doesn't get a date attached to it, disappears back into the ordinary current of the afternoon within a few messages." },
  { p: "Hours later, in the same conversation, Brad returns to something else entirely — the word that has sat, unclaimed, at the center of this whole archive since a December voice message thirteen months earlier." },
  { p: "🧁: Being a little silly here. Oh, I don't know if there's a reason why you haven't said it. I was just saying — if you for some reason need my permission to say it, please say it. I would—" },
  { p: "The sentence stops there, in the record, unfinished. The apprentice checks twice to be sure it isn't a formatting error, a page torn or lost. It isn't. He simply didn't finish it, or didn't send the rest, or the rest never made it into what survived. What's left is an offer with no closing clause: permission, freely given, for a word neither of them had used the plain version of since this whole thing began." },
  { p: "She doesn't take him up on it. Not that night. Not for another eight months, and even then, only in three letters standing in for the real ones." },
  { em: "Cataloger's note: This folder sits eleven weeks after the mutual near-miss already catalogued in an earlier folder, and eight months before the closest either of them comes to saying the word outright. Read against those two, it completes a pattern: every real opening either of them offers the other gets acknowledged, and gets declined. Not out of a lack of feeling — every folder in this archive argues against that reading. Out of something else, never named directly anywhere in the record." },
  { h: "PART VII — PRESERVATION" },
  { h: "FOLDER 038 — THE BOOK SHE ALREADY HAD IN MIND — 4 October 2025" },
  { p: "The apprentice has read enough of this archive by now to think he knows its rhythms. A day starts, something logistical eats the morning, something tender eats the evening, and somewhere in between there is usually one exchange that the file seems to have been waiting the whole day to get to. He has stopped being surprised by this pattern. He has not stopped being surprised by what, on any given day, turns out to be the thing." },
  { p: "This day it is a compliment about something Penny wrote — the file doesn't preserve what — followed by an aside from Brad that reads, at first, like any of a hundred small tendernesses already catalogued here." },
  { p: "🧁: I love writing the story with you (in real life). But also fun to write it with you..." },
  { p: "🐧: Me too. They kinda go. Feels normal." },
  { p: "🐧: I have two different versions to write. I might do them both." },
  { p: "The apprentice almost turns the page. Then Brad asks, half-joking, to hear more — <em>could you let a fan know?</em> — and Penny answers him plainly, the way people only answer when they've clearly already thought a great deal about the thing they're describing." },
  { p: "🐧: So one I already told you. It's like three stories in one. Yours and mine. But each of ours separately also. Like about three different couples but you find out at some point that one of the couples i—" },
  { p: "🧁: Gosh that's beautiful...." },
  { p: "🐧: The other one is us. Our love story. And then at some point you find out we aren't single." },
  { p: "🧁: I love this. Umm you said... our love story. Right — the true story!" },
  { p: "🐧: Well... What would you call it?" },
  { p: "The apprentice reads that last line three times. <em>What would you call it.</em> Not a question about a plot. A question about a title — the kind of question you ask when a thing has stopped being an idea and started being a project." },
  { p: "Brad, in the file, seems to physically catch himself." },
  { p: "🧁: Ohh it made me super smile and sorta stop breathing for a second." },
  { p: "🐧: You know like our hallmark movie we talked about but with a spin. Neither of us was single." },
  { p: "🧁: Ohh I loved that! That was a fun conversation and day I remember that." },
  { p: "🐧: Yeah!! It'd be a good one." },
  { p: "🧁: Right! Okay so we make a third where it's our like combo? Like semi non fiction where we are single right? Or is that too sad... Ohh and honestly... we could play the characters haha." },
  { p: "🐧: In reality not a book that would sell unless I wrote all our sex scenes! lol" },
  { p: "🧁: Okay right right! I knew that was like the first thing we talked about." },
  { p: "🐧: I feel like you could! I'm not sure I could." },
  { p: "They land, as they do, on a joke — whether he or she would be the one to actually write the sex scenes, whether either of them could stomach playing themselves on-screen. The conversation moves on within a few lines, back into the ordinary traffic of the day: an answer about a fan, a question about someone's shoes." },
  { p: "The apprentice sets the page down for a moment. There is a version of this file where nothing here is remarkable — two people in love, imagining a movie about themselves, the way people do. But he is not reading this from outside the thing they imagined. He is reading it from inside it. Somewhere on this exact shelf, in a box he has not yet opened, is the version Penny described without knowing it was already being written: three couples folded into one story, a truth that arrives partway through, a reader who has to find out — the way the apprentice himself found out, box by box — that neither one of the two people at the center of it was ever actually single." },
  { p: "He does not know, reading this, whether Penny ever wrote either version herself. The record doesn't say. What it says is that a year before anyone in this archive knew what would happen to it, one of the two people inside it had already, on an ordinary Saturday afternoon, described exactly the shape of the thing that would eventually be built from what they left behind." },
  { em: "Cataloger's note: No draft, outline, or further reference to either \"version\" appears anywhere else in the 208,998-message record. Whatever Penny began imagining that afternoon, it does not appear to have gone further than this conversation — at least not here." },
  { p: "FOLDER 048 — A DATE, RECOVERED 22 April 2025" },
  { p: "The apprentice has a note from an earlier pass through this archive, flagging a single bare pinned message — a date with nothing else attached to it, no explanation anywhere in the surrounding record. <em>December 8, 2023.</em> At the time, he wrote that whatever it meant wasn't recoverable. Reading the fuller exchange around it now, he has to revise that note, though not by much." },
  { p: "They're in the middle of an unrelated conversation — a business, a plan neither of them is certain will work out, Brad driving and unable to look something up properly. Then, without warning, he manages it anyway." },
  { p: "🐧: Couldn't easily find it in texts..." },
  { p: "🧁: I also tried, but driving — I just didn't feel like I should do it more." },
  { p: "🧁: December 8, 2023" },
  { p: "🐧: I'm going to add that to my timeline." },
  { p: "🧁: Please do! I think I added something — multiple pin timeline somewhere. Maybe. Or I possibly found a section of dates that we haven't added to this at all." },
  { p: "The apprentice understands, now, what this folder actually preserves. Not the meaning of the date itself — that's still not recoverable, and likely never was, since it predates this whole archive by five months. What it preserves is the act of recovery: two people digging back through old messages from a platform this record doesn't include, trying to reconstruct a piece of their own history that had already started to slip." },
  { p: "She checks the timeline document again — the one Penny built in the first weeks of this correspondence, pinned three times, treated by both of them less like a diary than like evidence. This date was added to it here, on this ordinary Tuesday, retrieved from somewhere neither of them could easily access anymore." },
  { p: "The apprentice still doesn't know what happened on December 8th, 2023. But he now understands why the date survives with nothing else attached to it: it wasn't written down when it happened. It was found, months later, driving, half-remembered, and handed over just in time to be kept." },
  { em: "Cataloger's note: This revises an earlier note filed elsewhere in the archive, which described this date's context as entirely unrecoverable. That description was incomplete rather than wrong — the meaning of the date is still unknown, but the circumstances of its recovery are not, and the Initiative's policy on visible correction requires this be noted rather than silently folded into a cleaner story." },
  { p: "FOLDER 046 — THE DISARRAY ON THE STAGING 30 December 2025" },
  { p: "The apprentice has learned, over dozens of folders, to recognize when Brad is thinking out loud rather than asking a real question — the messages come faster, less punctuated, more like a man talking to himself than to another person. This folder starts that way. It doesn't stay that way for long." },
  { p: "🧁: When you and Joshua fucked at Whitmore, was the staging involved? Because that would explain some disarray on the staging one morning when I went there." },
  { p: "The apprentice checks the date against everything else this archive has already told him about Whitmore — a real jobsite, a real remodel, predating this correspondence by months. He has read, elsewhere in the record, about disarray Brad found there once and never fully explained to himself at the time. Now, more than a year later, he's offering himself an explanation for it, unprompted, in the middle of an otherwise ordinary evening." },
  { p: "He keeps going, the questions arriving faster than either of them can fully answer them." },
  { p: "🧁: Was \"23\" the first, or was there someone before him?" },
  { p: "🧁: Can you send me a picture of him?" },
  { p: "🧁: Oh — speaking of this topic, did you go back and delete part of a conversation in Telegram about this?" },
  { p: "The apprentice reads that last line three times. It's the first place in the entire two-hundred-nine-thousand-message record where either of them directly accuses the other of erasing something from the archive itself — not forgetting, not omitting, but going back and removing a conversation that once existed." },
  { p: "🐧: Definitely don't think so! That was so long ago there was a chance I did at the time. But it's been a long time since I've deleted anything. Kinda forgot I could do that." },
  { p: "It isn't a denial, exactly. It's closer to an admission that a denial is impossible to make with any confidence — she doesn't say it didn't happen, only that she doesn't think it did, while allowing, in the same breath, that at the time, it might have." },
  { p: "He circles back once more, this time toward the name itself." },
  { p: "🧁: Also — is \"23\" even his real name? Because I sorta heard \"xxxxx\" when you said it." },
  { p: "🐧: Yeah, or plug and unplug." },
  { p: "🧁: I must have missed all of that. Maybe I have a faint memory of talking about video games, and how you would have to take it out of the cartridge and blow on it—" },
  { p: "The apprentice has searched the full archive for any earlier reference to this name, to the disarray at Whitmore, to whatever this \"video game\" tangent is actually about. There is none. Whatever conversation Brad half-remembers, whatever \"plug and unplug\" refers to, whatever happened on that staging — none of it exists anywhere else in the record. Only this one evening, a year and a half later, in which one of them asks whether the other one erased it, and the other one can't quite say for certain that she didn't." },
  { em: "Cataloger's note: This is the only place in the archive where deletion of the record is directly discussed as something that may have actually happened, rather than as a hypothetical risk to be managed. The Initiative's search tools find no earlier trace of the conversation being referenced. Whether that absence is because nothing was ever written, or because something was written and later removed, cannot be determined from what remains." },
  { p: "FOLDER 042 — WHAT THE WINTER COULD HIDE 30 November 2025" },
  { p: "The apprentice has read enough folders by now to recognize the difference between a fantasy and a plan. The imagined life with the turtle and the pickleball league was a fantasy — built fast, agreed to completely, never mentioned again by name after a single stray tortoise borrowed it once. This folder isn't that. This one has logistics attached to it from the first line." },
  { p: "🧁: Did you just look up medications that could potentially reverse a vasectomy?" },
  { p: "She had." },
  { p: "The apprentice checks the tone of what follows, expecting either of them to retreat into a joke, the way this archive so often does when a subject gets too large to hold directly. Neither of them does. They talk it through with the same practical patience they usually reserve for scheduling a window at Founders Park — plainly, seriously, a real conversation about a future that neither of them is supposed to be building." },
  { p: "What breaks the seriousness, when it finally breaks, isn't doubt about the plan itself. It's the same old problem, wearing new clothes." },
  { p: "🐧: I worry even more about being completely naked in the winter and getting caught, if I'm being honest." },
  { p: "🐧: We just need blankets so we don't look naked!" },
  { p: "The apprentice sits with the strangeness of it — a woman worried, in the same breath, about a child that doesn't exist yet and about winter light through a window. Even here, in the middle of the largest conversation this archive records outside the final three days, the oldest fear in the whole record never fully leaves the room. It just finds a new sentence to live in." },
  { em: "Cataloger's note: This is the only place in the archive where a shared future is discussed with logistics attached rather than as fantasy or hypothetical. It falls five weeks before the record ends. Nothing else in the folders that follow references it again by name." },
  { h: "FOLDER 079: THE NUMBERS" },
  { p: "Cataloger's Note, Folder 079" },
  { p: "No correspondence excerpt accompanies this entry. What follows are findings from a complete statistical pass across all 208,998 recovered messages, May 2024 through January 2026. The Initiative offers no interpretation. Only counts, and the shapes counts make when laid next to each other." },
  { p: "I. WHEN THE ARCHIVE LIVED" },
  { p: "![Volume of Recovered Correspondence](media/rId20.png){width=\"5.833333333333333in\" height=\"2.4305555555555554in\"}" },
  { p: "Volume of Recovered Correspondence" },
  { p: "Volume did not decline over the twenty months of this record. With two exceptions — January 2025 and July 2025 — every month exceeds the one before it, straight through to the final, partial month." },
  { p: "![Messages by Hour of Day](media/rId23.png){width=\"5.833333333333333in\" height=\"2.4305555555555554in\"}" },
  { p: "Messages by Hour of Day" },
  { p: "The correspondence does not live in stolen daytime minutes, whatever its own contents often dramatize. One hour — 7:00 to 8:00 PM — accounts for more of the archive than any other four hours combined: 36,261 messages, nearly three times an average daytime hour's volume. This record lived in evenings." },
  { p: "II. GETTING SHORTER, SAYING SORRY MORE" },
  { p: "![Getting Shorter, Saying Sorry More](media/rId26.png){width=\"5.833333333333333in\" height=\"2.4679483814523184in\"}" },
  { p: "Getting Shorter, Saying Sorry More" },
  { p: "Average message length fell for twenty consecutive months — from 15.7 words in May 2024 to 8.6 by December 2025, nearly cut in half. The decline is not sudden. It is close to a straight line." },
  { p: "Across the same period, the rate of messages containing the word \"sorry\" rose — from 2.5% in the record's first month to a peak of 4.2% in September 2025. As the correspondence grew more efficient, it also grew, proportionally, more apologetic." },
  { p: "The Initiative notes only that these two lines moved in opposite directions for the length of the record. It does not claim one caused the other." },
  { p: "III. THREE SMALL ASYMMETRIES" },
  { p: "![Three Small Asymmetries](media/rId29.png){width=\"5.833333333333333in\" height=\"1.903662510936133in\"}" },
  { p: "Three Small Asymmetries" },
  { p: "Weekends carried the heaviest volume of any two-day stretch in the record — Saturday and Sunday together outpacing every weekday. Friday, by contrast, is the quietest day of the week by a wide margin." },
  { p: "Penny asked more questions than Brad — 26,244 question marks to his 22,409 — despite sending roughly 21% fewer total messages than he did. Proportionally, far more of what she wrote was a question." },
  { p: "Brad apologized more than Penny — 3,847 uses of \"sorry\" against her 2,696. The imbalance holds steady across nearly the entire record. It is not a late development, and it is not tied to any single event the Initiative could locate." },
  { p: "One reads a question. One answers, and says sorry." },
  { p: "The archive does not know why. It only knows this was the shape of nearly every week, for twenty months, until it wasn't." },
  { h: "INTERLUDE: WHAT THE NUMBERS DON'T SHOW" },
  { p: "The apprentice reads Folder 079 last, after everything else, though the Initiative's own indexing system files it in the seventies, out of any real order. She thinks this is a mistake, and then reconsiders. Maybe it belongs exactly where the numbers put it — near the end, once a reader has enough of the correspondence behind them to recognize what the counts are actually describing." },
  { p: "Twenty months. Two hundred eight thousand, nine hundred ninety-eight messages. A curve that rises almost every month without exception, straight through to the last one. She has read enough of the folders individually by now to know what that rising line is made of — not escalation, exactly, not a story building toward a climax the way a novel would. Just more evenings. More 7 p.m. hours, the heaviest hour of the record, arriving over and over, each one nearly identical to the last, each one apparently necessary anyway." },
  { p: "What the numbers can tell him: that Brad apologized nearly fifteen hundred more times than Penny did, across twenty months, without the gap ever meaningfully closing. That the average message got shorter by nearly half over the same period, while the rate of the word \"sorry\" nearly doubled — two lines moving in opposite directions for the length of an entire relationship, and the Initiative, true to its own policy, refusing to say which one caused the other." },
  { p: "What the numbers can't tell him: why. He has that only from the folders themselves — the fear of a shared calendar app updating at the wrong moment, the small, repeated arithmetic of how many days in a row an absence can be explained before it stops being explainable, the accumulating, un-totaled weight of thousands of ordinary apologies for things that were, on their own, almost never anyone's fault." },
  { p: "He thinks about a line from one of the folders already behind him — <em>never enough time, fully</em> — and understands, now, that the numbers are the same complaint restated as arithmetic. Twenty months, and the one resource this archive never once has enough of is the one no chart can measure: an hour, uninterrupted, that didn't have to be planned around anyone else's schedule." },
  { p: "The final folder waits on the shelf behind him, unopened. He already knows, from the preservation notes, that it isn't like the others — three days, left completely unabridged, timestamps intact, no editing for pace or rhythm. The Initiative's policy on endings is explicit on this point, and he has read the justification enough times to recite it: an ending doesn't get to be edited for pacing. It gets to be exactly as long, as repetitive, as ordinary, and as abrupt as it actually was." },
  { p: "He sets Folder 079 down. Two hundred eight thousand, nine hundred ninety-eight messages, and everything the numbers could tell him about how they were spent. What they were spent on is still three days away." },
  { p: "She reaches for the box." },
  { h: "PART VIII — INHERITANCE" },
  { h: "FOLDER 036 — THE REWIND SCENARIO — 5 October 2025" },
  { p: "The apprentice starts this file already tired — he has read enough of these mornings by now to recognize the pattern before it fully unfolds. He skips church to see her. She spends the next hour convinced she's ruined his day for it, and it takes forty-five minutes of \"you're good, babe\" and \"no, you're good\" before either of them believes the other. He used to find this endearing. Somewhere around the fourth or fifth time he's read a version of it, it started to feel more like watching two people apologize their way through a door that was never actually locked." },
  { p: "By evening, though, the day turns into something he hasn't seen the shape of before. It starts as a joke — an admission that isn't really an admission." },
  { p: "🧁: Yeah so my secret is I guess I kept a secret from you." },
  { p: "🐧: Which is?" },
  { p: "🧁: I don't have a secret persay / like I have said I would tell you anything. But yeah I havnt told you that..." },
  { p: "🐧: Oh, you've thought it and haven't said it?" },
  { p: "🧁: Kinda like an admittance that I guess I did have something I didn't / havnt told you." },
  { p: "🐧: Got it. I feel like it's bound to have crossed our minds. All the different ways we could actually be together." },
  { p: "The apprentice sits up a little at that last line. Not because it's dramatic — nothing about the way it's said is dramatic — but because of what comes right after it, arriving so quickly and so completely that he has to reread it to be sure he isn't filling in details the file didn't actually give him." },
  { p: "🐧: I mean yeah kinda. I know it wasn't your fav but gosh — thinking about how we'd have met. And how Marcus would've liked it. How we could've worked together." },
  { p: "🐧: It'd have been crazy at first but by now no one would even know we weren't the same age. Blue eyes curly haired kids." },
  { p: "🧁: Ohhh the way you are describing it now it's my favorite!" },
  { p: "🐧: We'd play pickleball as couples every week. Definitely have a pet turtle. Hot tub but no pool." },
  { p: "🧁: Exactly! Nailed it!" },
  { p: "🐧: Tommy." },
  { p: "🧁: Damn right Tommy!" },
  { p: "The apprentice checks the name against every index the Initiative has built for this archive. It isn't anywhere else. Not in the pins, not in the earlier folders, not in any of the four hundred--some names that surface once and vanish. Just here — a full life, assembled in under a minute, complete with a child's name neither of them hesitates over, a turtle, a hot tub, a Sunday afternoon sport. She has read stranger things in this record. She hasn't read anything quite this specific, offered this easily, and agreed to this completely." },
  { p: "Then, almost as a joke folded inside the joke, Penny offers something else — not the fantasy anymore, but a version of an actual favor." },
  { p: "🐧: I've totally thought of being a surrogate before, so I had a fleeting thought of doing that for you if needed. But that is actually crazy!!!!" },
  { p: "🧁: I think that would be so special... That was my first thought. That's so sweet." },
  { p: "🐧: It was thought of as a thing out of care. But then yeah — a little crazy given our situation, so not a good idea." },
  { p: "🧁: Well then you should just have my child! Poly is the answer..." },
  { p: "Neither of them lets it sit for long. It resolves the way most of the heaviest things in this file resolve — into a typo, a laugh, a change of subject. A dream about a friend named Jill that isn't what it sounds like. A video message about her wrist, sent an hour before midnight, that has nothing to do with any of this." },
  { p: "The apprentice marks the page and moves on to the next file in the box. She does not, this time, immediately reach for it." },
  { em: "Cataloger's note: \"Tommy\" appears exactly once in the full 208,998-message record — here, and nowhere else. Whatever this imagined life was, it was said once, agreed to completely, and never returned to by name again." },
  { p: "FOLDER 045 — SMALL THINGS TO KEEP 6--7 January 2026" },
  { p: "The apprentice reads this folder last, out of order, after he already knows how the week ends. He isn't sure, at first, why the Initiative filed these two moments together — a day apart, on opposite sides of everything that happens between them. Reading them side by side, he starts to understand." },
  { p: "On the sixth, in the middle of an ordinary afternoon thousands of miles apart, Brad mentions he's gotten her something." },
  { p: "🧁: Got you something... It's very tiny..." },
  { p: "He doesn't say what, not right away. Penny spends the better part of an hour guessing before he tells her: a shell, picked up off a beach neither of them will ever visit together. It isn't much of a gift, measured by any ordinary standard. The record doesn't show her measuring it that way." },
  { p: "The next afternoon, in the middle of the hardest conversation the archive contains, she offers something back — smaller than a gift, stranger than a plan, entirely sincere." },
  { p: "🐧: Wanna make a time capsule and bury it at Founders Park?" },
  { p: "He doesn't answer it directly. It sits there, unresolved, in the middle of a conversation about custody of a friendship neither of them can quite agree on the terms of — an idea for a keepsake, raised in the same hour the thing itself is ending." },
  { p: "The apprentice sets the two folders side by side and lets them stay there. A shell, given. A time capsule, proposed and never built. Two small physical objects, on either side of the worst day in the record, both of them reaching for the same thing: something that could survive being held, when so much else about this correspondence couldn't survive being said." },
  { em: "Cataloger's note: No further reference to either the shell or the time capsule appears anywhere else in the archive. Whether the shell was kept, or the capsule ever buried, is not recoverable from this record." },
  { p: "FOLDER 049 — THE LAST BOX 5--7 January 2026" },
  { p: "There is one folder left when the apprentice reaches for it, and he knows, before he opens it, that it will be different from the other forty-eight." },
  { p: "She has read this correspondence for months now — reconstructed its rituals, traced its private language, catalogued its unresolved names and its recovered dates and its small, strange coincidences. She knows the shape of an ordinary day in this record by instinct now: the morning logistics, the evening tenderness, the particular arithmetic of two people trying to be near each other inside two lives that were never built to allow it. She has read enough endings-that-weren't to stop expecting this one to be any different." },
  { p: "The preservation sheet beneath this folder's lid tells him otherwise. <em>Reproduced in full, exactly as recovered, without trimming, timestamps intact.</em> Every other folder in this box has been shaped for a reader — compressed, selected, given rhythm. This one, the sheet says, was left alone on purpose. An ending doesn't get edited for pacing. It gets to be exactly as long, as repetitive, as ordinary, and as abrupt as it actually was." },
  { p: "She turns the page." },
  { h: "5 January 2026 — Monday" },
  { p: "The morning starts before sunrise, the way so many of their mornings do, with nothing in it to suggest this one is different from the four hundred that came before." },
  { p: "🧁: Goodmorning Penny" },
  { p: "🐧: Good morning!" },
  { p: "He tells her he's leaving for the airport soon, a flight, a conference, four days away from home. She tells him she's more worried about him than usual, though she can't say why. He answers with more feeling than the moment strictly calls for." },
  { p: "🧁: I 🫶 you Penny so much! I want us! I need us! I really really do!" },
  { p: "🐧: I guess part of me is a little more worried lately. Like you shouldn't want me now. I don't know why." },
  { p: "🧁: I feel the same way too Penny! I do want you now, yesterday and not gonna stop!" },
  { p: "🐧: I am not going to stop either." },
  { p: "The apprentice reads this exchange the way he's learned to read all of them — for the shape underneath the words, not just the words themselves. Something in Penny's line sits slightly wrong, a worry surfacing without explanation, answered but not resolved. Neither of them presses it further. The morning moves on, the way mornings in this record always do, into logistics — a location app, a rental car, a joke about a video game at the gate. Then, without warning, the question that has circled this whole correspondence since April surfaces again." },
  { p: "🧁: When are we gonna talk about marriage?" },
  { p: "🐧: Yes!! We didn't get back to that last night!" },
  { p: "🧁: So we are gonna be planning it still right?!" },
  { p: "🐧: Sounds fun to me!!!" },
  { p: "They don't plan it. They never do. But saying it out loud, even lightly, in the middle of an ordinary rental-car afternoon, is its own kind of commitment, and neither of them treats it as a joke." },
  { p: "That evening brings the one real scare of the day." },
  { p: "🐧: He called" },
  { p: "🧁: Yeah yeah:)" },
  { p: "🐧: Sorry 😞 sucky!!!" },
  { p: "🧁: Well hang up:)" },
  { p: "🐧: Gosh i miss you" },
  { p: "🧁: I miss you! Big gosh!" },
  { p: "They recover the way they always recover — quickly, back into the ordinary texture of the evening, an hour of nothing in particular, the small rituals that have carried them through nights like this one for a year and a half. Near midnight, he sends a voice message, and somewhere in it his phone's voice-to-text catches something he hadn't quite meant to type at all." },
  { p: "🧁: I cannot wait to fucking paddle your ass. Make love to you. Be completely happy. Cum inside you. I live you! Hmm — potentially misspelling on \"live.\"" },
  { p: "The apprentice sits with that line longer than its length deserves. She has read this archive's central absence in a dozen forms by now — the hedges, the near-misses, the three letters standing in for three words. This is one more, smaller and stranger than the rest: a typo, caught and flagged by the person who made it, one letter short of the sentence this whole record has been circling since the second folder." },
  { p: "It will turn out to be one of the last nights either of them has any reason to believe there will be many more like it." },
  { h: "6 January 2026 — Tuesday" },
  { p: "She tells him about a dream that morning — not a strange one, not one that needs interpreting, though he offers an interpretation anyway, several paragraphs of borrowed language about emotional restraint and subconscious safety, transparently hopeful, pasted in from somewhere else." },
  { p: "🐧: Is this your interpretation before googling it?!? lol" },
  { p: "In the dream, she'd hugged two people she loved but hadn't told so in years, and said the words to both of them without hesitation. He wants, badly, to be one of the two. She tells him, gently, that he isn't — not literally. But the second half of the dream, the part about saying it freely, without fear or consequence — that part, she admits, is true." },
  { p: "🐧: My dream world even knows I can't say it to you, so it made this scenario representing what I want and feel." },
  { p: "The apprentice doesn't move on right away. Twenty months into this record, and here it is again — the sentence circling its own absence, dressed this time as somebody else's subconscious." },
  { p: "The day scatters after that into ordinary noise — a beach, a misspelled name, a chess game joked about for an hour. He tells her, at one point, that he's gotten her something, very small, and won't say what. She spends the better part of an hour guessing before he tells her: a shell." },
  { p: "Then, almost accidentally, a small animal becomes something neither of them expects it to be." },
  { p: "🐧: I was just thinking yesterday on my walk how I loved that you dropped off Tommy!!!!" },
  { p: "🧁: Yeah I thought this was about Tommy the turtle the whole time. My bad." },
  { p: "🐧: I mean I don't want to give up Tommy!!" },
  { p: "The apprentice recognizes the name immediately — a stray tortoise, mentioned once, and a name that meant something else entirely eleven months earlier, in a different folder, when the two of them built an entire imagined life out loud in under a minute and gave the imagined child in it exactly this name. It surfaces here once more, half by accident, and then never again. Not once, anywhere else in the record." },
  { p: "By nine that night, home, worn down by a day of travel, he tells her plainly what he wants, without dressing it in a joke first." },
  { p: "🧁: I still need us. I still want us. I just wanted to tell you that I love you, Penny." },
  { p: "He has said it before, in every shape except this one. This is as close as the sentence ever comes to arriving whole." },
  { h: "7 January 2026 — Wednesday" },
  { p: "The apprentice has read enough of this archive to recognize, immediately, that this morning is wrong." },
  { p: "🧁: Everything okay?" },
  { p: "🐧: hey!" },
  { p: "🧁: Hey:)" },
  { p: "🐧: Brad" },
  { p: "🐧: you know how much I care about you! truly" },
  { p: "🧁: Yep!" },
  { p: "🐧: gotta go" },
  { p: "🧁: What the heck is this going to... I'll find out later..." },
  { p: "🧁: Are you ending it?" },
  { p: "An hour and a half pass before she answers." },
  { p: "🐧: I'm also so sorry I started this and didn't realize the time." },
  { p: "🐧: This conversation. And made you worry." },
  { p: "🐧: Seriously. I don't want this at all. I hate this. But I just can't do this to Joshua." },
  { p: "🧁: Penny, you can't do this over text." },
  { p: "🐧: I can't do it to you. Hillary. The kids. I can't." },
  { p: "🐧: I can't cry." },
  { p: "🧁: Penny... Penny, Penny — oh gosh." },
  { p: "🐧: I want to see you. Right now!" },
  { p: "🧁: Oh fuck Penny. Can you?" },
  { p: "🐧: Well not immediately no." },
  { p: "He asks, more than once, when she knew. She tells him she couldn't sleep, that she'd known since the night before and really known since that morning, that she hadn't wanted it to happen this way — over text, half-formed, apologizing before she'd finished the sentence." },
  { p: "Then, in the middle of it, she says something that changes the register of the entire day." },
  { p: "🐧: Also I know tomorrow is the anniversary of your dad passing right?" },
  { p: "🧁: I know. Fuck. Did you fucking plan that around this?" },
  { p: "🐧: I was worried about timing regarding that. Like when would be harder for you. I didn't know 😔 As far as it being today or tomorrow — that was a consideration, yes." },
  { p: "🧁: Motherfucker, you're so fucking smart." },
  { p: "The apprentice goes quiet reading it, the way he suspects the record itself goes quiet in the seconds after a line like that lands. What follows, across the rest of the day, is less an argument than an excavation — both of them establishing, hour by hour, exactly when she knew, exactly what she meant by things said days and weeks earlier that suddenly carry more weight than either of them noticed at the time." },
  { p: "🐧: I want you to have a baby! I can't be why you don't." },
  { p: "🧁: When can I see you? Okay. Minds made up. Guess we need to talk logistics about everything. Whatever happened to fucking forever — fuck fuck fuck." },
  { p: "🐧: Babe what if we are the reason you don't have a kid?!?" },
  { p: "They meet that afternoon — briefly, the way they've always managed to before. A park. A walk. An hour that both of them will later describe as feeling entirely unfinished." },
  { p: "🐧: It feels so unfinished. I'm exhausted now! Just want to quit for the day and cry and sleep." },
  { p: "🧁: It feels extremely unfinished. I would agree with that." },
  { p: "Somewhere in the middle of it, she offers him something small and strange, entirely sincere." },
  { p: "🐧: Wanna make a time capsule and bury it at Founders Park?" },
  { p: "He doesn't answer it directly. It sits there, unresolved, an idea for a keepsake raised in the same hour the thing itself is ending." },
  { p: "By evening they're circling the same questions from different angles — when she knew, whether it built slowly or arrived all at once, whether either of them lied to the other by omission somewhere along the way." },
  { p: "🧁: So you knew then? You asked, do you think we need to have that conversation? Quite literally. So you knew then?" },
  { p: "🐧: No! But now I know if you pushed I'd have prayed and thought more and it would've happened sooner." },
  { p: "🐧: I knew but I wouldn't even admit it to myself. I didn't want it to be true. I wanted any other option." },
  { p: "🧁: Honestly, I'm so fucking angry at you. I don't even wanna answer that question." },
  { p: "🐧: I miss you so much already." },
  { p: "🧁: Yeah, it's fucking terrible. I miss you." },
  { p: "He tells her he can't lose her. She tells him she's afraid of exactly the same thing." },
  { p: "🐧: I'm afraid you'll never come to church again. Never want to see me or speak to me. We'll never play pounce, or ride horses, or joke in the hallway, or hug. I'm just afraid." },
  { p: "🧁: Yeah I know... it is scary, I'm terrified." },
  { p: "And then, without either of them planning it, he says the thing the archive preserves as its last real line — not gentle, not softened, the kind of sentence a person says once, at the exact moment they can't hold anything back anymore." },
  { p: "🧁: You used my dad's death to break up with me. I hate this so much." },
  { p: "No reply follows it. Not that night, not anywhere else in what survives. Whatever came after that sentence — however the conversation actually ended, whatever either of them said in the hours or days that followed — didn't make it into the record." },
  { p: "The apprentice sits with the folder open for a long time after the last line." },
  { p: "He has done this forty-eight times now — closed a folder, made a note, reached for the next one. He finds he can't quite do it the same way this time. There's no next folder. The box, for the first time since he started, is empty." },
  { p: "She thinks about the timeline Penny wrote in the second week of this whole record, keyword-searched together out of old messages, kept and pinned and added to for twenty months. She thinks about a hotel key, thrown away and mourned for having been thrown away. A bag that could hold anything. A tortoise that briefly held the name of a child who was never going to exist. Three letters, standing in for three words, arriving as close to whole as they ever would. A shell. An idea for a time capsule that, as far as this record shows, was never built." },
  { p: "Two hundred eight thousand, nine hundred ninety-eight messages, spanning twenty months, and the last one this record preserves is a sentence with no reply." },
  { p: "She closes the folder. She sets it back in the box, in its place among the other forty-eight, and closes the lid." },
  { p: "Reading Room D is quiet the way it always is at the end of a session — morning light, an oak table, nothing else asking for attention. He sits there a while longer than he usually allows himself to. Then he pulls off the white cotton gloves, sets them beside the box, and goes to find the colleague who will need to know this one is finished." },
  { em: "Cataloger's note, Final Folder: This concludes the recovered correspondence between the two individuals documented in this archive. No later messages exist in the record. Whether the relationship itself continued in any other form — by voice, in person, or not at all — is outside the scope of what this box preserves. The Initiative's policy on endings is unchanged by this one: preserved as recovered, without interpretive closure, because the correspondence itself never received any." },
  { h: "INTERLUDE: WHAT THE NUMBERS DON'T SHOW" },
  { p: "The apprentice reads Folder 079 last, after everything else, though the Initiative's own indexing system files it in the seventies, out of any real order. She thinks this is a mistake, and then reconsiders. Maybe it belongs exactly where the numbers put it — near the end, once a reader has enough of the correspondence behind them to recognize what the counts are actually describing." },
  { p: "Twenty months. Two hundred eight thousand, nine hundred ninety-eight messages. A curve that rises almost every month without exception, straight through to the last one. She has read enough of the folders individually by now to know what that rising line is made of — not escalation, exactly, not a story building toward a climax the way a novel would. Just more evenings. More 7 p.m. hours, the heaviest hour of the record, arriving over and over, each one nearly identical to the last, each one apparently necessary anyway." },
  { p: "What the numbers can tell him: that Brad apologized nearly fifteen hundred more times than Penny did, across twenty months, without the gap ever meaningfully closing. That the average message got shorter by nearly half over the same period, while the rate of the word \"sorry\" nearly doubled — two lines moving in opposite directions for the length of an entire relationship, and the Initiative, true to its own policy, refusing to say which one caused the other." },
  { p: "What the numbers can't tell him: why. He has that only from the folders themselves — the fear of a shared calendar app updating at the wrong moment, the small, repeated arithmetic of how many days in a row an absence can be explained before it stops being explainable, the accumulating, un-totaled weight of thousands of ordinary apologies for things that were, on their own, almost never anyone's fault." },
  { p: "He thinks about a line from one of the folders already behind him — <em>never enough time, fully</em> — and understands, now, that the numbers are the same complaint restated as arithmetic. Twenty months, and the one resource this archive never once has enough of is the one no chart can measure: an hour, uninterrupted, that didn't have to be planned around anyone else's schedule." },
  { p: "The final folder waits on the shelf behind him, unopened. He already knows, from the preservation notes, that it isn't like the others — three days, left completely unabridged, timestamps intact, no editing for pace or rhythm. The Initiative's policy on endings is explicit on this point, and he has read the justification enough times to recite it: an ending doesn't get to be edited for pacing. It gets to be exactly as long, as repetitive, as ordinary, and as abrupt as it actually was." },
  { p: "He sets Folder 079 down. Two hundred eight thousand, nine hundred ninety-eight messages, and everything the numbers could tell him about how they were spent. What they were spent on is still three days away." },
  { p: "She reaches for the box." },
];

function renderContent() {
  const container = document.getElementById('content');
  container.innerHTML = SECTIONS.map(s => {
    if (s.h) return '<strong>' + s.h + '</strong>';
    if (s.em) return '<p><em>' + s.em + '</em></p>';
    return '<p>' + s.p + '</p>';
  }).join('');
}

document.getElementById('unlockBtn').addEventListener('click', () => {
  const pass = document.getElementById('passInput').value;
  if (pass === PASSPHRASE) {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('reader').classList.add('show');
    renderContent();
  } else {
    document.getElementById('lockError').textContent = 'Incorrect passphrase.';
  }
});

document.getElementById('passInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('unlockBtn').click();
});

document.getElementById('lockAgainBtn2').addEventListener('click', () => {
  document.getElementById('reader').classList.remove('show');
  document.getElementById('passInput').value = '';
  document.getElementById('lockScreen').style.display = 'flex';
});
</script>
 <div id="tp-widget">
  <div id="tp-bubble" class="tp-bubble"></div>
  <div id="tp-penguin" class="tp-penguin">🐧</div>
  <div id="tp-menu" class="tp-menu" hidden>
    <button onclick="tpAction('feed')">🍰 Feed Cupcake</button>
    <button onclick="tpAction('coffee')">☕ Give Coffee</button>
    <button onclick="tpAction('talk')">💬 Talk</button>
    <button onclick="tpAction('search')">📦 Search Archive</button>
    <button onclick="tpAction('sleep')">😴 Sleep</button>
    <button onclick="tpCloseMenu()" class="tp-menu-close">✕</button>
  </div>
  <div id="tp-stats" class="tp-stats">
    <span>❤️ <b id="tp-happy">–</b></span>
    <span>☕ <b id="tp-energy">–</b></span>
    <span>💬 <b id="tp-social">–</b></span>
    <span>📚 <b id="tp-curious">–</b></span>
  </div>
</div>

<style>
  #tp-widget { position: fixed; bottom: 14px; right: 14px; z-index: 9999; font-family: -apple-system, sans-serif; user-select: none; }
  #tp-penguin { font-size: 34px; cursor: pointer; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4)); animation: tp-idle 2.4s ease-in-out infinite; transition: transform 0.4s ease; }
  #tp-penguin.tp-walking { animation: tp-walk 0.5s ease-in-out infinite; }
  #tp-penguin.tp-sleeping { animation: tp-sleep 3s ease-in-out infinite; opacity: 0.75; }
  #tp-penguin.tp-happy { animation: tp-bounce 0.4s ease-in-out infinite; }
  @keyframes tp-idle { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-3px) rotate(-2deg); } }
  @keyframes tp-walk { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-5px) rotate(4deg); } }
  @keyframes tp-sleep { 0%, 100% { transform: rotate(0deg) translateY(0); } 50% { transform: rotate(3deg) translateY(2px); } }
  @keyframes tp-bounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.08); } }
  .tp-bubble { position: absolute; bottom: 46px; right: 0; max-width: 190px; background: #fffaf0; color: #3a3227; border: 1px solid #d8c9a8; border-radius: 12px; padding: 8px 12px; font-size: 12.5px; line-height: 1.4; box-shadow: 0 4px 14px rgba(0,0,0,0.25); display: none; font-family: Georgia, serif; }
  .tp-bubble.show { display: block; animation: tp-fade 0.25s ease; }
  @keyframes tp-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .tp-menu { position: absolute; bottom: 46px; right: 0; background: #14100c; border: 1px solid #4a3c28; border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); min-width: 160px; }
  /* Without this, .tp-menu{display:flex} above always wins the cascade
     over the browser's own [hidden]{display:none}, so toggling
     menu.hidden in JS silently did nothing visually. */
  .tp-menu[hidden] { display: none !important; }
  .tp-menu button { background: none; border: none; color: #ecdfc8; text-align: left; padding: 8px 10px; font-size: 13px; border-radius: 8px; }
  .tp-menu button:active { background: #241d15; }
  .tp-menu-close { text-align: center !important; color: #b8895a !important; font-size: 11px !important; margin-top: 2px; }
  .tp-stats { position: absolute; bottom: -22px; right: 0; display: flex; gap: 6px; font-size: 9px; color: #8a7355; white-space: nowrap; opacity: 0.85; }
</style>

<script>
(function() {
  const TP_KEY = 'tiny_penguin_state';
  const TP_LINES_IDLE = ["Good morning.","Sleepyhead...","I wonder where Cupcake is.","The bag won't fail you.","Forever, twice.","I like the blue.","Normal Brad, reporting for duty.","...","🫶🏻","Purposeful hang up?"];
  const TP_ARTIFACTS = ["Blue Dress","The Bag","Good Morning","Sleepyhead","Normal Brad","The Hotel Key","Forever","The Magnolia House","Vulnerable Jimmy","Tommy"];
  function tpNow() { return Date.now(); }
  function tpLoad() {
    try { const raw = localStorage.getItem(TP_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return { happy: 70, energy: 70, social: 70, curious: 70, lastTick: tpNow(), lastInteraction: tpNow(), foundArtifacts: [], sleeping: false };
  }
  function tpSave(state) { try { localStorage.setItem(TP_KEY, JSON.stringify(state)); } catch (e) {} }
  let state = tpLoad();
  function tpDecay() {
    const now = tpNow();
    const minutesPassed = (now - state.lastTick) / 60000;
    if (minutesPassed > 0) {
      state.happy = Math.max(0, state.happy - minutesPassed * 0.6);
      state.energy = Math.max(0, state.energy - minutesPassed * 0.4);
      state.social = Math.max(0, state.social - minutesPassed * 0.8);
      state.curious = Math.max(0, state.curious - minutesPassed * 0.3);
      state.lastTick = now;
    }
    tpSave(state);
  }
  function tpClamp(v) { return Math.max(0, Math.min(100, Math.round(v))); }
  function tpUpdateUI() {
    document.getElementById('tp-happy').textContent = tpClamp(state.happy);
    document.getElementById('tp-energy').textContent = tpClamp(state.energy);
    document.getElementById('tp-social').textContent = tpClamp(state.social);
    document.getElementById('tp-curious').textContent = tpClamp(state.curious);
    const penguin = document.getElementById('tp-penguin');
    penguin.classList.remove('tp-walking', 'tp-sleeping', 'tp-happy');
    if (state.sleeping) { penguin.textContent = '😴'; penguin.classList.add('tp-sleeping'); }
    else if (state.happy > 80) { penguin.textContent = '🐧'; penguin.classList.add('tp-happy'); }
    else if (state.energy < 25) { penguin.textContent = '🥱'; }
    else { penguin.textContent = '🐧'; }
  }
  function tpSayBubble(text, duration) {
    const bubble = document.getElementById('tp-bubble');
    bubble.textContent = text;
    bubble.classList.add('show');
    setTimeout(() => { bubble.classList.remove('show'); }, duration || 3200);
  }
  function tpMaybeSpeak() {
    if (state.sleeping) return;
    const minsSinceInteraction = (tpNow() - state.lastInteraction) / 60000;
    if (minsSinceInteraction > 2 && Math.random() < 0.4) {
      tpSayBubble(TP_LINES_IDLE[Math.floor(Math.random() * TP_LINES_IDLE.length)]);
    }
    if (state.social < 30 && Math.random() < 0.3) { tpSayBubble("I'm a little lonely..."); }
  }
  function tpWalk() {
    if (state.sleeping) return;
    const penguin = document.getElementById('tp-penguin');
    penguin.classList.add('tp-walking');
    setTimeout(() => penguin.classList.remove('tp-walking'), 900);
  }
  window.tpAction = function(action) {
    state.lastInteraction = tpNow();
    if (action === 'feed') { state.happy = tpClamp(state.happy + 20); tpSayBubble("Mmm, cupcake. 🧁"); }
    else if (action === 'coffee') { state.energy = tpClamp(state.energy + 25); tpSayBubble("☕ Ahh, better."); }
    else if (action === 'talk') { state.social = tpClamp(state.social + 20); tpSayBubble(TP_LINES_IDLE[Math.floor(Math.random() * TP_LINES_IDLE.length)]); }
    else if (action === 'search') {
      state.curious = tpClamp(state.curious + 15);
      const found = Math.random() < 0.35;
      if (found) {
        const remaining = TP_ARTIFACTS.filter(a => !state.foundArtifacts.includes(a));
        if (remaining.length > 0) {
          const pick = remaining[Math.floor(Math.random() * remaining.length)];
          state.foundArtifacts.push(pick);
          tpSayBubble("📦 Recovered Artifact:\n+ " + pick, 4200);
        } else { tpSayBubble("📦 I've found everything so far..."); }
      } else { tpSayBubble("Nothing this time..."); }
    } else if (action === 'sleep') { state.sleeping = !state.sleeping; tpSayBubble(state.sleeping ? "Goodnight..." : "I'm awake!"); }
    tpSave(state); tpUpdateUI(); tpCloseMenu();
  };
  window.tpCloseMenu = function() { document.getElementById('tp-menu').hidden = true; };
  document.getElementById('tp-penguin').addEventListener('click', () => {
    const menu = document.getElementById('tp-menu');
    menu.hidden = !menu.hidden;
    state.lastInteraction = tpNow();
    tpSave(state);
  });
  tpDecay(); tpUpdateUI();
  setInterval(() => { tpDecay(); tpUpdateUI(); }, 20000);
  setInterval(tpMaybeSpeak, 15000);
  setInterval(tpWalk, 6000);
})();
</script>

</body>
