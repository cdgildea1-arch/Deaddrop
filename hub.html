<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Hub</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    background: #0a0e0a;
    color: #e8f5ec;
  }
  .wrap {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    padding-bottom: max(30px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .footer-note {
    font-size: 30px;
    letter-spacing: 8px;
    margin-bottom: 36px;
  }
  .menu {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  a.menu-item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #121812;
    border: 1px solid #1e3a24;
    border-radius: 16px;
    padding: 16px 18px;
    text-decoration: none;
    color: #e8f5ec;
    text-align: left;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  a.menu-item:active { transform: scale(0.97); background: #16211a; }
  .menu-icon { font-size: 26px; flex-shrink: 0; }
  .menu-text { flex: 1; }
  .menu-title { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
  .menu-sub { font-size: 12px; color: #7a998a; }
  .lock-badge { font-size: 13px; opacity: 0.6; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="footer-note">🧁 &amp; 🐧</div>
    <div class="menu">
      <a class="menu-item" href="deaddrop.html">
        <div class="menu-icon">💬</div>
        <div class="menu-text">
          <div class="menu-title">Chat</div>
          <div class="menu-sub">The vault, just for us</div>
        </div>
      </a>
      <a class="menu-item" href="archive.html">
        <div class="menu-icon">🗄️</div>
        <div class="menu-text">
          <div class="menu-title">The Archive</div>
          <div class="menu-sub">Boxes, folders, the whole record</div>
        </div>
        <div class="lock-badge">🔒</div>
      </a>
      <a class="menu-item" href="cards.html">
        <div class="menu-icon">🃏</div>
        <div class="menu-text">
          <div class="menu-title">The Cards</div>
          <div class="menu-sub">Swipe through the lines that stayed</div>
        </div>
        <div class="lock-badge">🔒</div>
      </a>
      <a class="menu-item" href="photographs.html">
        <div class="menu-icon">📷</div>
        <div class="menu-text">
          <div class="menu-title">The Photographs</div>
          <div class="menu-sub">Faded prints, kept the way memory keeps them</div>
        </div>
        <div class="lock-badge">🔒</div>
      </a>
      <a class="menu-item" href="the-margins.html">
        <div class="menu-icon">✏️</div>
        <div class="menu-text">
          <div class="menu-title">The Margins</div>
          <div class="menu-sub">A running notebook, just for us</div>
        </div>
        <div class="lock-badge">🔒</div>
      </a>
      <a class="menu-item" href="book.html">
        <div class="menu-icon">📖</div>
        <div class="menu-text">
          <div class="menu-title">The Book</div>
          <div class="menu-sub">Locked — passphrase required</div>
        </div>
        <div class="lock-badge">🔒</div>
      </a>
    </div>
  </div>
</body>
</html>
