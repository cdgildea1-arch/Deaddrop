<!doctype html>
<html data-game-screen="panel" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171c23">
<title>Two-player games · Your Move</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="/your-move-chat/chat.css?v=both1">
<script defer src="/Pounce/supabase.min.js"></script>
<script type="module" src="./app.mjs?v=saved1"></script>
<link rel="stylesheet" href="/game-screen.css?v=1"><script type="module" src="/game-screen.mjs?v=1"></script></head>
<body>
<main>
<header><a href="/">‹ Your Move</a><button id="chatToggle" type="button">Chat</button></header>
<section id="entry">
  <div class="hero"><div id="mark" aria-hidden="true"></div><h1 id="title"></h1><p id="detail"></p></div>
  <form id="joinForm">
    <label>Your name<input id="name" autocomplete="nickname" maxlength="18" required></label>
    <label>Game code<input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="8" required></label>
    <button class="primary">Join a friend</button>
  </form>
  <details><summary>How to play</summary><p id="instructions"></p></details>
</section>
<section id="play" hidden>
  <div class="game-head"><div><h1 id="gameTitle"></h1><p id="round"></p></div><button id="leave" type="button">Leave</button></div>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="stage"></div>
  <div id="controls">
    <button id="mainAction" class="primary" type="button" hidden></button>
    <button id="erase" type="button" hidden>Clear my stroke</button>
  </div>
</section>
<p id="notice" role="alert" hidden></p>
</main>
</body>
</html>
