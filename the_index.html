<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>The Index</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #14100c;
    color: #ecdfc8;
    font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  }
  .lock-screen {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    padding-bottom: max(30px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .lock-icon { font-size: 40px; margin-bottom: 16px; opacity: 0.9; }
  .lock-title { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .lock-sub { font-size: 13px; color: #a3906e; margin-bottom: 28px; max-width: 280px; line-height: 1.5; font-family: -apple-system, sans-serif; }
  .lock-input {
    width: 100%; max-width: 280px;
    background: #241d15;
    border: 1px solid #4a3c28;
    color: #ecdfc8;
    border-radius: 10px;
    padding: 13px 14px;
    font-size: 16px;
    margin-bottom: 14px;
    text-align: center;
    font-family: -apple-system, sans-serif;
  }
  .lock-btn {
    background: #b8895a;
    color: #14100c;
    border: none;
    border-radius: 10px;
    padding: 13px 34px;
    font-size: 15px;
    font-weight: 700;
    font-family: -apple-system, sans-serif;
  }
  .lock-error { color: #d17a6a; font-size: 12px; margin-top: 10px; min-height: 16px; font-family: -apple-system, sans-serif; }

  .app { display: none; max-width: 560px; margin: 0 auto; padding: 0 0 40px; }
  .app.show { display: block; }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: max(12px, env(safe-area-inset-top)) 20px 12px;
    font-family: -apple-system, sans-serif;
  }
  .top-bar button { background: none; border: none; color: #b8895a; font-size: 13px; }
  .archive-title { text-align: center; font-size: 12px; letter-spacing: 3px; color: #b8895a; font-family: -apple-system, sans-serif; }
  .archive-sub { text-align: center; font-size: 20px; margin: 4px 0 20px; letter-spacing: 6px; }

  .search-wrap { padding: 0 20px 18px; }
  .search-input {
    width: 100%;
    background: #241d15;
    border: 1px solid #4a3c28;
    color: #ecdfc8;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: -apple-system, sans-serif;
  }

  .entry-list { padding: 0 20px; }
  .entry {
    background: #1c1710;
    border: 1px solid #3a2f20;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: none;
  }
  .entry.match { display: block; }
  .entry-term {
    font-size: 16px;
    font-weight: 700;
    color: #ecdfc8;
    margin-bottom: 4px;
  }
  .entry-desc {
    font-size: 14px;
    color: #b39a72;
    line-height: 1.5;
    margin-bottom: 6px;
  }
  .entry-refs {
    font-size: 12px;
    color: #8a7355;
    font-family: -apple-system, sans-serif;
  }
  .no-results { text-align: center; color: #6b5a45; font-size: 13px; padding: 30px 0; font-family: -apple-system, sans-serif; }
</style>
</head>
<body>

  <div id="lockScreen" class="lock-screen">
    <div class="lock-icon">🔤</div>
    <div class="lock-title">The Index</div>
    <div class="lock-sub">Every recurring name, thread, and thing. Search to find where it lives.</div>
    <input type="password" id="passInput" class="lock-input" placeholder="Passphrase" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="unlockBtn" class="lock-btn">Enter</button>
    <div class="lock-error" id="lockError"></div>
  </div>

  <div id="app" class="app">
    <div class="top-bar">
      <button id="lockAgainBtn">🔒 Lock</button>
      <span></span>
    </div>
    <div class="archive-title">THE PENGUIN ARCHIVE</div>
    <div class="archive-sub">🔤</div>

    <div class="search-wrap">
      <input type="text" id="searchInput" class="search-input" placeholder="Search a name, place, or theme…">
    </div>

    <div class="entry-list" id="entryList"></div>
    <div class="no-results" id="noResults" style="display:none;">No matches. Try a different word.</div>
  </div>

<script>
const PASSPHRASE = "cupcake";

const ENTRIES = [
  { term: "Alex", desc: "A fictional friend, invented together in Folder 003 as a cover — a name each of them could hide behind. Never mentioned again by name after early folders, except a coincidental echo in Folder 047.", refs: "Folder 003, 047" },
  { term: "Julia", desc: "A real name, mentioned twice, at the center of an unresolved accusation about honesty that predates the relationship itself. The Initiative leaves this as a gap.", refs: "Folder 043, 035" },
  { term: "Tommy", desc: "The name given to an imagined child in a fully-built fantasy life — turtle, pickleball, hot tub. Appears exactly once. Resurfaces months later as the name of an actual stray tortoise, by coincidence.", refs: "Folder 036" },
  { term: "Normal Brad", desc: "A performed version of himself, for anyone who might be reading over a shoulder — named by Brad himself.", refs: "Folder 017" },
  { term: "Vulnerable Jimmy", desc: "Not a glitch — Brad's own father's old nickname, used as shorthand mid-conversation.", refs: "Folder 024" },
  { term: "The Bag", desc: "A hypothetical, magical container that could hold anything either of them wanted — invented together, mentioned once, never returned to by name.", refs: "Folder 037" },
  { term: "The Magnolia House", desc: "A rented house, searched for by name, half real-estate errand and half private code.", refs: "Folder 016, 028" },
  { term: "Forever", desc: "Appears 303 times across the full record. Pinned twice, in the same evening — one of the few moments either of them pinned the same night it was said.", refs: "Folder 044" },
  { term: "The Hotel Key", desc: "Thrown away, then mourned for having been thrown away — a missed opportunity both of them carried separately for months.", refs: "Folder 019" },
  { term: "The Sabbatical", desc: "A real stretch of time off work — ordinary at first, later something that needed hiding from people around them.", refs: "Folder 018" },
  { term: "The Timeline", desc: "A private document Penny kept of her own life before the correspondence, pinned three separate times, referenced throughout.", refs: "Folder 005, 048" },
  { term: "Cameras", desc: "A recurring fear — doorbell cameras, location pins, being caught — that dissolves quickly nearly every time it surfaces.", refs: "Folder 037" },
  { term: "Suspicion", desc: "A permanent low-pressure system across the record. One nine-day stretch (Sept 2025) is the only sustained, unresolved suspicion event with no confrontation or confirmed discovery.", refs: "Folder 040" },
  { term: "The Shell", desc: "A tiny gift, picked up off a beach neither would visit together, given the day before the ending began.", refs: "Folder 045" },
  { term: "The Time Capsule", desc: "An idea for a keepsake to bury at Founders Park, raised in the same hour the relationship itself was ending. Never resolved.", refs: "Folder 045, 049" },
  { term: "I Heart You, Not I Love You", desc: "An early moment where the shape of the missing phrase is visible without ever fully arriving — a full year before the record's closest near-misses.", refs: "Folder 022" },
  { term: "The Same Moment", desc: "Both of them, a few feet apart in a truck, independently arriving at the edge of the same unsaid word — and neither noticing the other doing it too.", refs: "Folder 035" },
  { term: "Fourteen Months", desc: "The only place in the archive a specific proposal timeline is stated in figures.", refs: "Folder 039" },
  { term: "Permission", desc: "An offer, never finished in the record — permission freely given for a word neither of them had used plainly.", refs: "Folder 041" },
  { term: "The Book", desc: "Discussed a year before this archive existed — Penny describing, without knowing it, the exact shape of what would eventually be built from what they left behind.", refs: "Folder 038" },
  { term: "Founders Park", desc: "A recurring meeting place, mentioned throughout the logistics of the record.", refs: "Multiple folders" },
  { term: "December 8, 2023", desc: "A bare pinned date with nothing else attached. Recovered from memory, months later, while driving. Its meaning is never explained.", refs: "Folder 048" },
  { term: "The Numbers", desc: "A full statistical pass across all 208,998 messages — volume, timing, apology counts, message length over time.", refs: "Folder 079" },
  { term: "The Deletion", desc: "The only place in the record either of them directly discusses erasing a conversation that may have once existed.", refs: "Folder 046" },
  { term: "The Last Box", desc: "The final three days, left completely unabridged — the ending itself.", refs: "Folder 049" }
];

function buildEntries() {
  const list = document.getElementById('entryList');
  list.innerHTML = '';
  ENTRIES.sort((a, b) => a.term.localeCompare(b.term)).forEach(e => {
    const div = document.createElement('div');
    div.className = 'entry match';
    div.innerHTML = `
      <div class="entry-term">${e.term}</div>
      <div class="entry-desc">${e.desc}</div>
      <div class="entry-refs">${e.refs}</div>
    `;
    div.setAttribute('data-search', (e.term + ' ' + e.desc).toLowerCase());
    list.appendChild(div);
  });
}

function filterEntries(query) {
  const q = query.trim().toLowerCase();
  const entries = document.querySelectorAll('.entry');
  let matches = 0;
  entries.forEach(el => {
    const isMatch = !q || el.getAttribute('data-search').includes(q);
    el.classList.toggle('match', isMatch);
    if (isMatch) matches++;
  });
  document.getElementById('noResults').style.display = matches === 0 ? 'block' : 'none';
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  filterEntries(e.target.value);
});

document.getElementById('unlockBtn').addEventListener('click', () => {
  const pass = document.getElementById('passInput').value.trim().toLowerCase();
  if (pass === PASSPHRASE) {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('app').classList.add('show');
    buildEntries();
  } else {
    document.getElementById('lockError').textContent = 'Incorrect passphrase.';
  }
});

document.getElementById('passInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('unlockBtn').click();
});

document.getElementById('lockAgainBtn').addEventListener('click', () => {
  document.getElementById('app').classList.remove('show');
  document.getElementById('passInput').value = '';
  document.getElementById('lockScreen').style.display = 'flex';
});
</script>
</body>
</html>
