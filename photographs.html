<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>The Photographs</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #14100c;
    color: #ecdfc8;
    font-family: -apple-system, sans-serif;
  }
  .lock-screen {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    padding-bottom: max(30px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .lock-icon { font-size: 40px; margin-bottom: 16px; opacity: 0.9; }
  .lock-title { font-size: 22px; font-weight: 600; margin-bottom: 6px; font-family: Georgia, serif; }
  .lock-sub { font-size: 13px; color: #a3906e; margin-bottom: 28px; max-width: 280px; line-height: 1.5; }
  .lock-input {
    width: 100%; max-width: 280px;
    background: #241d15;
    border: 1px solid #4a3c28;
    color: #ecdfc8;
    border-radius: 10px;
    padding: 13px 14px;
    font-size: 16px;
    margin-bottom: 14px;
    text-align: center;
  }
  .lock-btn {
    background: #b8895a;
    color: #14100c;
    border: none;
    border-radius: 10px;
    padding: 13px 34px;
    font-size: 15px;
    font-weight: 700;
  }
  .lock-error { color: #d17a6a; font-size: 12px; margin-top: 10px; min-height: 16px; }

  .app { display: none; max-width: 520px; margin: 0 auto; padding: 0 0 40px; }
  .app.show { display: block; }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: max(12px, env(safe-area-inset-top)) 20px 12px;
  }
  .top-bar button { background: none; border: none; color: #b8895a; font-size: 13px; }
  .archive-title { text-align: center; font-size: 12px; letter-spacing: 3px; color: #b8895a; }
  .archive-sub { text-align: center; font-size: 20px; margin: 4px 0 20px; letter-spacing: 6px; }

  .upload-zone {
    margin: 0 20px 20px;
    border: 2px dashed #4a3c28;
    border-radius: 14px;
    padding: 30px 20px;
    text-align: center;
    color: #8a7355;
    font-size: 13px;
  }
  .upload-zone input { display: none; }
  .upload-btn {
    display: inline-block;
    margin-top: 10px;
    background: #b8895a;
    color: #14100c;
    border-radius: 10px;
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 700;
  }

  .canvas-wrap {
    margin: 0 20px 16px;
    border-radius: 14px;
    overflow: hidden;
    background: #1c1710;
    display: none;
  }
  .canvas-wrap.show { display: block; }
  canvas { width: 100%; display: block; }

  .controls { margin: 0 20px 20px; display: none; }
  .controls.show { display: block; }
  .control-row { margin-bottom: 14px; }
  .control-row label { font-size: 12px; color: #8a7355; display: block; margin-bottom: 6px; }
  .control-row input[type="range"] { width: 100%; }

  .filter-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .filter-tab {
    flex: 1;
    background: #1c1710;
    border: 1px solid #3a2f20;
    border-radius: 8px;
    padding: 9px 4px;
    font-size: 12px;
    color: #ecdfc8;
  }
  .filter-tab.active { background: #b8895a; color: #14100c; border-color: #b8895a; }

  .save-btn {
    width: 100%;
    background: #b8895a;
    color: #14100c;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    font-weight: 700;
    margin: 0 20px;
    width: calc(100% - 40px);
  }
  .hint { text-align: center; font-size: 11px; color: #6b5a45; margin-top: 12px; }
</style>
</head>
<body>

  <div id="lockScreen" class="lock-screen">
    <div class="lock-icon">📷</div>
    <div class="lock-title">The Photographs</div>
    <div class="lock-sub">A few faded prints, kept the way memory keeps them.</div>
    <input type="password" id="passInput" class="lock-input" placeholder="Passphrase" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="unlockBtn" class="lock-btn">Enter</button>
    <div class="lock-error" id="lockError"></div>
  </div>

  <div id="app" class="app">
    <div class="top-bar">
      <button id="lockAgainBtn">🔒 Lock</button>
      <span></span>
    </div>
    <div class="archive-title">THE PENGUIN ARCHIVE</div>
    <div class="archive-sub">📷</div>

    <div class="upload-zone" id="uploadZone">
      Upload a photo to fade it into an old print.
      <div><label class="upload-btn">Choose Photo<input type="file" id="fileInput" accept="image/*"></label></div>
    </div>

    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="canvas"></canvas>
    </div>

    <div class="controls" id="controls">
      <div class="filter-tabs">
        <button class="filter-tab active" data-mode="bw">Black & White</button>
        <button class="filter-tab" data-mode="sepia">Sepia</button>
      </div>
      <div class="control-row">
        <label>Fade / Age</label>
        <input type="range" id="fadeSlider" min="0" max="100" value="40">
      </div>
      <div class="control-row">
        <label>Grain</label>
        <input type="range" id="grainSlider" min="0" max="100" value="25">
      </div>
      <button class="save-btn" id="saveBtn">Save Photo</button>
      <div class="hint">Tap Save, then press and hold the image to save it to your camera roll.</div>
    </div>
  </div>

<script>
const PASSPHRASE = "cupcake";

let originalImg = null;
let mode = 'bw';

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      originalImg = img;
      const maxW = 700;
      const scale = Math.min(1, maxW / img.width);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      document.getElementById('canvasWrap').classList.add('show');
      document.getElementById('controls').classList.add('show');
      applyEffect();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function applyEffect() {
  if (!originalImg) return;
  ctx.drawImage(originalImg, 0, 0, canvas.width, canvas.height);
  let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imgData.data;
  const fade = document.getElementById('fadeSlider').value / 100;
  const grain = document.getElementById('grainSlider').value / 100;

  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i+1], b = data[i+2];
    const gray = 0.299 * r + 0.587 * g + 0.114 * b;

    let nr, ng, nb;
    if (mode === 'sepia') {
      nr = gray * 1.07 + 20;
      ng = gray * 0.9 + 10;
      nb = gray * 0.7;
    } else {
      nr = gray; ng = gray; nb = gray;
    }

    const fadeTarget = mode === 'sepia' ? [222, 205, 176] : [200, 200, 195];
    nr = nr + (fadeTarget[0] - nr) * fade * 0.5;
    ng = ng + (fadeTarget[1] - ng) * fade * 0.5;
    nb = nb + (fadeTarget[2] - nb) * fade * 0.5;

    if (grain > 0) {
      const noise = (Math.random() - 0.5) * grain * 60;
      nr += noise; ng += noise; nb += noise;
    }

    data[i] = Math.max(0, Math.min(255, nr));
    data[i+1] = Math.max(0, Math.min(255, ng));
    data[i+2] = Math.max(0, Math.min(255, nb));
  }
  ctx.putImageData(imgData, 0, 0);

  const grad = ctx.createRadialGradient(
    canvas.width/2, canvas.height/2, canvas.width/3,
    canvas.width/2, canvas.height/2, canvas.width/1.2
  );
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,' + (0.15 + fade * 0.2) + ')');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

document.getElementById('fadeSlider').addEventListener('input', applyEffect);
document.getElementById('grainSlider').addEventListener('input', applyEffect);

document.querySelectorAll('.filter-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    mode = tab.getAttribute('data-mode');
    applyEffect();
  });
});

document.getElementById('saveBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'photograph.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

document.getElementById('unlockBtn').addEventListener('click', () => {
  const pass = document.getElementById('passInput').value.trim().toLowerCase();
  if (pass === PASSPHRASE) {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('app').classList.add('show');
  } else {
    document.getElementById('lockError').textContent = 'Incorrect passphrase.';
  }
});

document.getElementById('passInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('unlockBtn').click();
});

document.getElementById('lockAgainBtn').addEventListener('click', () => {
  document.getElementById('app').classList.remove('show');
  document.getElementById('passInput').value = '';
  document.getElementById('lockScreen').style.display = 'flex';
});
</script>
</body>
</html>
