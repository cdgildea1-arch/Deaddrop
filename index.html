<!doctype html>
<html data-game-screen="fixed" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171b">
<meta name="description" content="Pick a game at Your Move. Play with a friend or take a solo turn.">
<title>Your Move · Games</title>
<meta name="apple-mobile-web-app-title" content="Your Move">
<link rel="manifest" href="/your-move.webmanifest?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/your-move-assets/move-180.png">
<link rel="icon" type="image/png" href="/your-move-assets/move-192.png">
<style>
:root{color-scheme:dark;--ink:#f8f1de;--dim:#c6bba8;--table:#19151a}
*{box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;touch-action:manipulation;margin:0;background:radial-gradient(ellipse at 50% 2%,#2a2029,var(--table) 70%);color:var(--ink);font-family:system-ui,sans-serif}
main{
 width:min(100%,800px);height:100%;height:100dvh;min-height:0;margin:auto;
 padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right))
         max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
 display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(9px,2.3dvh,24px);
}
header{display:flex;align-items:end;justify-content:space-between;gap:9px}
h1{margin:0;font:700 clamp(39px,10vw,76px)/.93 Georgia,serif;letter-spacing:-.064em}
header p{margin:5px 0 0;color:var(--dim);font-size:clamp(11px,2.9vw,14px)}
.period{color:#ffd273}.shuffle{
 color:#ffe3a9;background:#48364b;border:1px solid #ffda8f66;border-radius:999px;
 padding:7px 10px;min-height:44px;font:650 clamp(10px,3vw,13px) system-ui,sans-serif;
 white-space:nowrap;cursor:pointer;flex:none;
}
.shuffle:focus-visible,.shuffle:hover{outline:2px solid #ffe3a9;outline-offset:2px}
@media(max-width:359px){header h1{font-size:36px}.shuffle{padding-inline:7px}}
.shelf{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:auto repeat(3,minmax(0,1fr)) auto repeat(4,minmax(0,1fr));min-height:0;gap:clamp(5px,1.7vw,12px);max-height:820px}
.shelf h2{grid-column:1/-1;margin:clamp(2px,.8dvh,8px) 2px -2px;font:650 clamp(10px,2.8vw,13px)/1 system-ui,sans-serif;letter-spacing:.08em;color:var(--dim)}
.shelf h2:first-child{margin-top:0}
.game{grid-column:span 2}
.game.wide{grid-column:span 3}
.game.full{grid-column:1/-1}
.game.trio{grid-column:span 2}
/* Your move: saved games waiting on you glow gold with a "Your turn" tag; ones waiting on the other person get a quiet tag */
.game.waiting{box-shadow:0 0 0 2px var(--table),0 0 0 clamp(4px,1vw,5px) #ffd273,0 0 22px 4px #ffd27399;animation:yourturn 1.8s ease-in-out infinite}
@keyframes yourturn{50%{box-shadow:0 0 0 2px var(--table),0 0 0 clamp(4px,1vw,5px) #ffe7a8,0 0 30px 8px #ffd273cc}}
.game.waiting::after,.game.theirs::after{position:absolute;top:clamp(4px,1vw,7px);right:clamp(4px,1vw,7px);z-index:2;
 font:800 clamp(8px,2.3vw,11px)/1 system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;border-radius:999px;white-space:nowrap}
.game.waiting::after{content:'Your turn';background:#ffd273;color:#2b1d05;box-shadow:0 1px 4px #0006}
.game.theirs::after{content:'Their turn';background:#0008;color:#fff;opacity:.85}
@media(prefers-reduced-motion:reduce){.game.waiting{animation:none}}
.game{
 --surface:#e9e3d4;--text:#27242a;--stamp:#33343b;
 --label-size:clamp(11px,min(4vw,2.75dvh),23px);
 container-type:size;min-height:0;min-width:0;position:relative;isolation:isolate;overflow:hidden;
 display:grid;grid-template-rows:minmax(0,1fr) 2.16em;
 font:700 var(--label-size)/1.08 Georgia,serif;text-align:center;gap:2px;
 padding:clamp(3px,.8dvh,9px) clamp(5px,1.4vw,12px);border-radius:clamp(9px,3vw,17px);border:1px solid #fff3;
 background:
   repeating-linear-gradient(107deg,#fff0 0 3px,#fff1 3px 4px,#0000 4px 7px),
   repeating-linear-gradient(18deg,#0000 0 2px,#0001 2px 3px,#0000 3px 6px),
   linear-gradient(145deg,#fff1,transparent 56%,#0001),var(--surface);
 color:var(--text);text-decoration:none;box-shadow:inset 0 -2px #0003,0 3px 6px #0003;
 transition:transform .15s,box-shadow .15s;
}
.game:hover,.game:focus-visible{transform:translateY(-2px);outline:2px solid #ffe3a9;outline-offset:2px}
.game:active{transform:scale(.97)}
.game strong{display:grid;align-content:center;font:inherit;letter-spacing:-.025em;overflow-wrap:anywhere;min-width:0}
.mark{
 display:grid;min-height:0;place-items:center;color:var(--stamp);
 font:850 clamp(13px,min(9vw,4.6dvh),56px)/1 Georgia,serif;
 font-size:clamp(9px,min(9vw,38cqh),56px);
}
.pounce .mark,.hearts .mark,.mahjong .mark{font-size:clamp(8px,min(9vw,30cqh),49px)}
.paper{
 transform-origin:center;background:#fff6dd;color:#45362c;display:grid;place-items:center;
 width:1.25em;height:1.52em;border-radius:.13em;box-shadow:2px 3px #21182a3b;
 font-size:.74em;transform:rotate(-10deg);
}
.double{position:relative;isolation:isolate}
.double::before{content:'';position:absolute;z-index:-1;inset:2px -5px;background:#202c33;transform:rotate(15deg);border:1px solid #fff8;border-radius:4px}
.pounce{--surface:#283c36;--text:#fff2d8;--stamp:#f4d390}
.speed{--surface:#efd18d;--text:#371f1f;--stamp:#9c4028}
.hearts{--surface:#9c3d53;--text:#fff6e6;--stamp:#ffcec3}
.hearts .paper{color:#a43552}
.uno{--surface:#4c3273;--text:#fff0c8;--stamp:#ffcb52}
.uno .mark{font-family:system-ui,sans-serif;font-size:clamp(10px,min(7vw,32cqh),48px);font-style:italic;text-shadow:2px 2px #bd3f56}
.uno .mark span{transform:rotate(-8deg)}
.guess{--surface:#d5b894;--text:#2a2821;--stamp:#7a3130}
.guess .paper{aspect-ratio:1;height:1.25em;font-style:italic}
.scrabble{--surface:#d79c77;--text:#241913;--stamp:#4f3023}
.scrabble .paper{height:1.22em;transform:rotate(0);position:relative}
.scrabble small{position:absolute;font:700 .28em system-ui,sans-serif;bottom:.13em;right:.16em}
.duet{--surface:#22605b;--text:#fff0d7;--stamp:#b7e1bf}
.duet .mark{font-family:system-ui,sans-serif;letter-spacing:-.07em}
.dots{--surface:#afd3e1;--text:#192f3d;--stamp:#174b68}
.dot-mark{display:grid;grid-template-columns:repeat(3,1fr);gap:.13em;transform:rotate(-8deg)}
.dot-mark i{width:.13em;height:.13em;border-radius:50%;background:currentColor}
.mahjong{--surface:#d8dec0;--text:#2e3a2e;--stamp:#235f4f}
.mahjong .paper{color:#266451}
.changed{--surface:#cfe1a5;--text:#253321;--stamp:#395130}
.draw{--surface:#ddbaea;--text:#32253d;--stamp:#663778}
.warmer{--surface:#f4a97e;--text:#411f20;--stamp:#8c3629}
.same-word{--surface:#b6d7a1;--text:#203828;--stamp:#315d3e}
.quick-draw{--surface:#fbc5a2;--text:#392b38;--stamp:#773b69}
.hide-dot{--surface:#94d9d4;--text:#1b383b;--stamp:#226167}
.wavelength{--surface:#3f4f8f;--text:#fdf3df;--stamp:#ffcf6e}
.butterflies{--surface:#c9577f;--text:#fff1f4;--stamp:#ffe0e8}
.after-dark{--surface:#3a0a14;--text:#ffd9d0;--stamp:#ff8a7a}
.marble{--surface:#2c4a63;--text:#eef7ff;--stamp:#9fd8ff}
.orb{width:1.05em;height:1.05em;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff 0 7%,#9fe3ff 16%,#2f9be0 45%,#0b3a6b 80%);box-shadow:.06em .1em .14em #0007,inset -.06em -.08em .12em #0006}
@media (min-width:700px){main{padding-inline:30px}}
@media (max-height:490px){
 main{padding-block:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-bottom));gap:7px}
 h1{font-size:36px}
 header p{margin-top:2px}
 .shelf{gap:4px}
 .game{--label-size:clamp(10px,3dvh,15px);padding-block:2px}
}
@media (orientation:landscape) and (min-width:560px){
 .shelf{grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:auto repeat(2,minmax(0,1fr)) auto repeat(3,minmax(0,1fr))}
 .game,.game.wide{grid-column:span 3}
 .shelf>.game:nth-child(-n+7){grid-column:span 2}
 .game.trio{grid-column:span 4}
 .game.full{grid-column:span 6}
 .game{--label-size:clamp(11px,min(2.65vw,3.8dvh),21px)}
}
/* Give the iPhone status bar extra clearance without growing the page. */
@media (max-width:620px) and (orientation:portrait){
 main{padding-top:calc(env(safe-area-inset-top, 0px) + clamp(11px,2.3dvh,23px))}
}
@media(prefers-reduced-motion:reduce){.game{transition:none}}
/* Unread chat badges (your-move-chat/unread.mjs) */
.game[data-move-unread]{position:relative;overflow:visible}
.game[data-move-unread]::after{content:attr(data-move-unread);position:absolute;top:-6px;right:-6px;z-index:3;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:10px;background:#ff3b30;color:#fff;font:700 11px/20px system-ui,sans-serif;text-align:center;box-shadow:0 0 0 2px #15171b;pointer-events:none}
.room-unread[hidden]{display:none}
.room-unread{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:#ff3b30;color:#fff;font:700 11px/18px system-ui,sans-serif;vertical-align:middle}
</style>
<link rel="stylesheet" href="/game-screen.css?v=1"><script type="module" src="/game-screen.mjs?v=1"></script></head>
<body>
<main>
 <header>
  <div><h1>Your Move<span class="period">.</span></h1><p>Pick a game<span class="room-unread" hidden></span></p></div>
  <button class="shuffle" type="button">Surprise me</button>
 </header>
 <nav class="shelf" aria-label="Games">
  <h2>2P / CPU</h2>
  <a class="game pounce" href="/Pounce/"><span class="mark" aria-hidden="true"><span class="paper double">♣</span></span><strong>Pounce</strong></a>
  <a class="game speed" href="/speed/"><span class="mark" aria-hidden="true">ϟ</span><strong>Speed</strong></a>
  <a class="game hearts" data-game="hearts" href="/hearts/"><span class="mark" aria-hidden="true"><span class="paper">♥</span></span><strong>Hearts</strong></a>
  <a class="game uno" data-game="uno" href="/uno/"><span class="mark" aria-hidden="true"><span>UNO!</span></span><strong>UNO</strong></a>
  <a class="game guess" data-game="guess-who" href="/guess-who/"><span class="mark" aria-hidden="true"><span class="paper">?</span></span><strong>Guess Who?</strong></a>
  <a class="game scrabble" data-game="scrabble" href="/scrabble/"><span class="mark" aria-hidden="true"><span class="paper">S<small>1</small></span></span><strong>Scrabble</strong></a>
  <a class="game dots trio" data-game="dots" href="/dots/"><span class="mark" aria-hidden="true"><span class="dot-mark"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></span><strong>Dots &amp; Boxes</strong></a>
  <a class="game mahjong trio" href="/mahjong/"><span class="mark" aria-hidden="true"><span class="paper">發</span></span><strong>Mahjong</strong></a>
  <a class="game marble trio" href="/marble/"><span class="mark" aria-hidden="true"><span class="orb"></span></span><strong>Marble</strong></a>
  <h2>2P</h2>
  <a class="game duet" data-game="duet" href="/duet/"><span class="mark" aria-hidden="true">••</span><strong>Codenames Duet</strong></a>
  <a class="game changed" href="/mini/?game=what-changed"><span class="mark" aria-hidden="true">◫</span><strong>What Changed?</strong></a>
  <a class="game warmer" href="/mini/?game=warmer"><span class="mark" aria-hidden="true">◉</span><strong>Warmer</strong></a>
  <a class="game hide-dot" href="/mini/?game=hide-a-dot"><span class="mark" aria-hidden="true">⊙</span><strong>Hide a Dot</strong></a>
  <a class="game draw" href="/mini/?game=draw-together"><span class="mark" aria-hidden="true">〰</span><strong>Draw Together</strong></a>
  <a class="game quick-draw" href="/sketch/"><span class="mark" aria-hidden="true">✎</span><strong>Quick Draw</strong></a>
  <a class="game same-word wide" href="/same-word/"><span class="mark" aria-hidden="true">≈</span><strong>Same Word</strong></a>
  <a class="game wavelength wide" data-game="wavelength" href="/wavelength/"><span class="mark" aria-hidden="true">◠</span><strong>Wavelength</strong></a>
  <a class="game butterflies wide" data-game="butterflies" href="/butterflies/"><span class="mark" aria-hidden="true">🦋</span><strong>Butterflies</strong></a>
  <a class="game after-dark wide" data-game="after-dark" href="/after-dark/"><span class="mark" aria-hidden="true">🔥</span><strong>After Dark</strong></a>
 </nav>
</main>
<script type="module">

// Your move: ask the games server which saved games are waiting on this phone (same room as the games and chat).
async function yourMove(){
 let room;try{room=JSON.parse(localStorage.getItem('pounce.room'))}catch{}
 if(!room?.code||!room?.secret)return;
 try{
  const {gameCall}=await import('/your-move-sync.mjs');
  const {games}=await gameCall('status',room,null);
  for(const tile of document.querySelectorAll('.shelf [data-game]'))
  {tile.classList.toggle('waiting',games.some(g=>g.yours&&g.game===tile.dataset.game));
   tile.classList.toggle('theirs',games.some(g=>!g.yours&&g.game===tile.dataset.game));}
 }catch{}
}
yourMove();
setInterval(()=>{if(!document.hidden)yourMove()},30000);
// Unread chat: red counts on game tiles, a pill for the room chat, and the Home Screen icon badge.
import('/your-move-chat/unread.mjs?v=badge1').then(({startUnread,onUnread})=>{
 const where={pounce:'/Pounce/',speed:'/speed/',hearts:'/hearts/',uno:'/uno/','guess-who':'/guess-who/',scrabble:'/scrabble/',dots:'/dots/',
  mahjong:'/mahjong/','mahjong-daily':'/mahjong/','mahjong-level4':'/mahjong/',duet:'/duet/','what-changed':'/mini/?game=what-changed',
  warmer:'/mini/?game=warmer','hide-a-dot':'/mini/?game=hide-a-dot','draw-together':'/mini/?game=draw-together','quick-draw':'/sketch/',
  'same-word':'/same-word/',wavelength:'/wavelength/',butterflies:'/butterflies/','after-dark':'/after-dark/'};
 onUnread(({byThread})=>{
  const perTile=new Map();
  for(const [thread,n] of Object.entries(byThread))if(where[thread])perTile.set(where[thread],(perTile.get(where[thread])||0)+n);
  for(const tile of document.querySelectorAll('.shelf a')){
   const n=perTile.get(tile.getAttribute('href'));
   if(n)tile.dataset.moveUnread=n>9?'9+':String(n);else delete tile.dataset.moveUnread;
  }
  const pill=document.querySelector('.room-unread'),n=byThread.room||0;
  pill.hidden=!n;pill.textContent=n+' new in room chat';
 });
 startUnread();
}).catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)yourMove()});
const gameLinks=[...document.querySelectorAll('.shelf a')];
document.querySelector('.shuffle').addEventListener('click',()=>{
 const game=gameLinks[Math.floor(Math.random()*gameLinks.length)];
 location.assign(game.href);
});
</script>
</body>
</html>
