<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>The Penguin Archive</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Georgia, serif; background: #faf7f2; color: #2b2b2b; line-height: 1.6; }
  #gate {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 0 24px;
    padding-bottom: max(40px, env(safe-area-inset-bottom));
  }
  .emblem { font-size: 3.6rem; letter-spacing: 22px; margin-bottom: 14px; }
  .emblem span { display: inline-block; }
  .divider { width: 70px; height: 1px; background: #c9a876; margin: 26px auto 42px; }
  h1.title { font-size: 2.6rem; font-weight: normal; letter-spacing: 1px; margin-bottom: 8px; color: #3a2f22; }
  .subtitle { font-style: italic; color: #8a6d3b; font-size: 1.15rem; margin-bottom: 36px; }
  input { padding: 12px 14px; font-size: 16px; width: 100%; max-width: 320px; font-family: inherit; border: 1px solid #d8c9ae; border-radius: 8px; background: #fffdfa; display: block; margin: 0 auto; }
  input:focus { outline: none; border-color: #b08d4f; }
  button { padding: 13px 18px; background: #8a6d3b; color: #fdf9f2; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-family: Georgia, serif; letter-spacing: 0.5px; display: block; width: 100%; max-width: 320px; margin: 16px auto 0; }
  button:hover { background: #6f5730; }
  #error { color: #a33; margin-top: 14px; font-size: 0.85rem; font-style: italic; }
  #content { display: none; white-space: pre-wrap; max-width: 700px; margin: 40px auto 80px; padding: 0 24px; }
  #content h1, #content h2 { font-weight: normal; text-align: center; color: #3a2f22; letter-spacing: 1px; }
  #content h1 { font-size: 2.4rem; margin-bottom: 10px; }
  #content h2 { font-size: 1.3rem; font-style: italic; color: #8a6d3b; margin-top: 0; margin-bottom: 36px; }
  #content .emblem { font-size: 3.2rem; letter-spacing: 18px; text-align: center; margin-bottom: 14px; }
  #content .divider { width: 70px; height: 1px; background: #c9a876; margin: 0 auto 36px; }
  #continueLink { display: none; text-align: center; margin: 20px 0 60px; }
  #continueLink a { display: inline-block; font-size: 2rem; color: #8a6d3b; text-decoration: none; border: 1px solid #d8c9ae; border-radius: 50%; width: 56px; height: 56px; line-height: 52px; }
  .pin-popup {
    position: fixed; z-index: 9997; background: #3a2f22; color: #f4ecdd;
    border: none; border-radius: 999px; padding: 9px 16px; font-size: 13px;
    font-family: -apple-system, sans-serif; box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    display: none; transform: translate(-50%, -120%);
  }
  .pin-popup.show { display: block; }
  .pin-toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #3a2f22; color: #f4ecdd; padding: 10px 18px; border-radius: 999px;
    font-family: -apple-system, sans-serif; font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease; z-index: 9998;
  }
  .pin-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<button id="pinPopup" class="pin-popup">📌 Pin this</button>
<div class="pin-toast" id="pinToast"></div>

<div id="gate">
  <div class="emblem"><span>🧁</span><span>🐧</span></div>
  <h1 class="title">The Archive</h1>
  <p class="subtitle">a private correspondence, kept</p>
  <div class="divider"></div>
  <input id="passphrase" type="password" placeholder="Passphrase" onkeydown="if(event.key==='Enter') unlock()">
  <button onclick="unlock()">Unlock</button>
  <div id="error"></div>
</div>

<div id="content"></div>
<div id="continueLink">
  <a href="hub.html">→</a>
</div>

<script>
const SUPABASE_URL = 'https://lecudeiafwhyhufceurv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Q9ESUnHKw3-FPpGeTYRfSA_4sg55UMD';

function fromBase64(str) {
  return Uint8Array.from(atob(str), c => c.charCodeAt(0));
}

async function deriveKey(passphrase, saltBytes) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBytes, iterations: 250000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

function toBase64(bytes) {
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}

let currentPassphrase = null; // set on successful unlock, kept only in memory

async function loadExistingPins(passphrase) {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/pins?select=*&order=created_at.desc&limit=1`,
    { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
  );
  const rows = await res.json();
  if (!rows || rows.length === 0) return [];
  const row = rows[0];
  const salt = fromBase64(row.salt);
  const iv = fromBase64(row.iv);
  const ciphertext = fromBase64(row.ciphertext);
  const key = await deriveKey(passphrase, salt);
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
  return JSON.parse(new TextDecoder().decode(buf));
}

async function savePin(pinObj) {
  if (!currentPassphrase) return;
  const existing = await loadExistingPins(currentPassphrase);
  existing.push(pinObj);

  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(currentPassphrase, salt);
  const enc = new TextEncoder();
  const ciphertextBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(existing)));

  await fetch(`${SUPABASE_URL}/rest/v1/pins`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({
      salt: toBase64(salt),
      iv: toBase64(iv),
      ciphertext: toBase64(new Uint8Array(ciphertextBuf))
    })
  });
}

function showPinToast(text) {
  const t = document.getElementById('pinToast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function findNearestContext(startEl) {
  let date = null, folder = null, speaker = null;

  const dialogueEl = startEl.closest ? startEl.closest('p.dialogue') : null;
  if (dialogueEl) {
    if (dialogueEl.classList.contains('penguin')) speaker = '🐧';
    else if (dialogueEl.classList.contains('cupcake')) speaker = '🧁';
  }

  let node = startEl;
  while (node) {
    if (node.nodeType === 1) {
      if (!date && node.matches && node.matches('p.date')) date = node.textContent.trim();
      if (!folder && node.matches && node.matches('h3.folder')) folder = node.textContent.trim();
    }
    node = node.previousElementSibling || node.parentElement;
    if (date && folder) break;
  }
  return { date, folder, speaker };
}

(function setupPinCapture() {
  const popup = document.getElementById('pinPopup');
  let pendingSelection = null;

  document.addEventListener('selectionchange', () => {
    const sel = window.getSelection();
    const text = sel.toString().trim();
    const contentEl = document.getElementById('content');
    if (!text || contentEl.style.display === 'none' || sel.rangeCount === 0) {
      popup.classList.remove('show');
      pendingSelection = null;
      return;
    }
    const range = sel.getRangeAt(0);
    const rect = range.getBoundingClientRect();
    if (rect.width === 0 && rect.height === 0) { popup.classList.remove('show'); return; }

    let node = range.startContainer;
    while (node && node.nodeType !== 1) node = node.parentNode;
    const ctx = node ? findNearestContext(node) : { date: null, folder: null, speaker: null };

    pendingSelection = { text, date: ctx.date || ctx.folder, speaker: ctx.speaker };
    popup.style.left = (rect.left + rect.width / 2) + 'px';
    popup.style.top = rect.top + 'px';
    popup.classList.add('show');
  });

  popup.addEventListener('click', async () => {
    if (!pendingSelection) return;
    popup.classList.remove('show');
    const pinObj = {
      text: pendingSelection.text,
      speaker: pendingSelection.speaker,
      date: pendingSelection.date,
      source: 'Archive',
      pinnedAt: new Date().toISOString()
    };
    window.getSelection().removeAllRanges();
    try {
      await savePin(pinObj);
      showPinToast('📌 Pinned to the Memory Jar');
    } catch (e) {
      showPinToast('Couldn\'t save the pin — try again');
    }
  });
})();

async function unlock() {
  const errorDiv = document.getElementById('error');
  const passphrase = document.getElementById('passphrase').value;
  errorDiv.textContent = '';

  if (!passphrase) {
    errorDiv.textContent = 'Enter a passphrase.';
    return;
  }

  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/archive?select=*&order=created_at.desc&limit=1`,
      {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        }
      }
    );

    const rows = await res.json();
    if (!rows || rows.length === 0) {
      errorDiv.textContent = 'No archive content found.';
      return;
    }

    const row = rows[0];
    const salt = fromBase64(row.salt);
    const iv = fromBase64(row.iv);
    const ciphertext = fromBase64(row.ciphertext);

    const key = await deriveKey(passphrase, salt);

    const decryptedBuf = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv }, key, ciphertext
    );

    const dec = new TextDecoder();
    const text = dec.decode(decryptedBuf);

    document.getElementById('content').innerHTML = text;
    document.getElementById('continueLink').style.display = 'block';
    document.getElementById('content').style.display = 'block';
    document.getElementById('gate').style.display = 'none';
    currentPassphrase = passphrase;
  } catch (e) {
    errorDiv.textContent = 'Wrong passphrase, or content unavailable.';
  }
}
</script>
</body>
</html>
