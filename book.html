<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>The Archive</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #f4ecdd;
    color: #3a3227;
    font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  }
  .lock-screen {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    padding-bottom: max(30px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .lock-icon { margin-bottom: 16px; opacity: 0.9; display: flex; justify-content: center; }
  .lock-icon svg { width: 46px; height: 46px; }
  .lock-title { font-size: 22px; font-weight: 600; margin-bottom: 6px; letter-spacing: 0.4px; }
  .lock-sub { font-size: 13px; color: #8a7a63; margin-bottom: 28px; max-width: 280px; line-height: 1.5; font-family: -apple-system, sans-serif; }
  .lock-input {
    width: 100%; max-width: 280px;
    background: #fffaf0;
    border: 1px solid #d8c9a8;
    border-radius: 10px;
    padding: 13px 14px;
    font-size: 16px;
    margin-bottom: 14px;
    text-align: center;
    font-family: -apple-system, sans-serif;
  }
  .lock-btn {
    background: #a9835a;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px 34px;
    font-size: 15px;
    font-weight: 600;
    font-family: -apple-system, sans-serif;
  }
  .lock-error { color: #a3453a; font-size: 12px; margin-top: 10px; min-height: 16px; font-family: -apple-system, sans-serif; }

  .reader {
    display: none;
    max-width: 640px;
    margin: 0 auto;
  }
  .reader.show { display: block; }
  .book-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(244,236,221,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #d8c9a8;
    padding: max(12px, env(safe-area-inset-top)) 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .book-header button {
    background: none;
    border: none;
    color: #a9835a;
    font-size: 13px;
    font-family: -apple-system, sans-serif;
    padding: 4px 0;
  }
  .book-header .title-mini {
    font-size: 12px;
    letter-spacing: 2px;
    color: #8a7a63;
    font-family: -apple-system, sans-serif;
  }
  .reader-body {
    padding: 30px 26px 80px;
  }
  .archive-emoji { text-align: center; font-size: 26px; margin-bottom: 32px; letter-spacing: 8px; }
  .content p {
    font-size: 17px;
    line-height: 1.8;
    margin: 0 0 20px;
  }
  .content strong {
    display: block;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.3px;
    margin: 48px 0 20px;
    color: #6b4423;
    border-top: 1px solid #d8c9a8;
    padding-top: 24px;
  }
  .content strong:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  .content em { color: #6b5a45; display: block; font-size: 15px; margin-top: -6px; }
</style>
</head>
<body>

    <div class="lock-error" id="lockError"></div>
  </div>

  <div id="reader" class="reader">
    <div class="book-header">
      <button id="lockAgainBtn2">🔒 Lock</button>

    <div class="reader-body">

    </div>

<script>
const PASSPHRASE = "cupcake";

const SECTIONS = [
  { h: "PART I — CONTACT" },
  { p: "🐧🧁" },
  { h: "FOLDER 001: THE RECORD BEGINS" },
  { p: "2178 — North American Digital Preservation Initiative, Fort Collins Preservation Campus" },
  { p: "The Initiative was founded for everything history almost lost." },
  { p: "History remembers empires. It remembers revolutions. It remembers the people history decided mattered." },
  { p: "We built this place for everyone else." },
  { p: "The apprentice was late." },
  { p: "Not very late. Just enough that the coffee in his hand still felt more important than his schedule." },
  { p: "He came around the corner too fast and nearly missed her — already past the doorway before he registered she was there, box in her arms, walking without any particular hurry." },
  { p: "He doubled back. Fell into step beside her." },
  { p: "Neither of them said anything about it. She didn't slow down for him. He didn't apologize for being late. Three months in, they'd already worn past that." },
  { p: "He glanced at the box. \"Need a hand?\"" },
  { p: "She shifted it toward him without breaking stride. His arms dropped farther than he expected. He laughed. \"It's heavier than it looks.\"" },
  { p: "\"It usually surprises people.\"" },
  { p: "He adjusted his grip. \"What's in it?\"" },
  { p: "She looked at the box for a moment before answering. \"Years.\"" },
  { p: "They kept walking. Neither of them said anything else. They didn't need to — this was the tenth box, or the fortieth, and by now the silence between them did most of the talking." },
  { p: "Reading Room D waited at the end of the hallway. She opened the door. Morning light rested across a single oak table. Nothing else asked for attention." },
  { p: "She motioned toward the center of the room. He set the box down carefully. From her pocket, she produced a pair of white cotton gloves and placed them beside it. Then she rested her fingertips on the lid." },
  { p: "\"Careful.\" He looked up. \"You're not lifting paper.\"" },
  { p: "For just a second, neither of them moved. Then she stepped back. \"When you're ready.\"" },
  { p: "The door closed softly behind her." },
  { p: "Silence settled over the room. He looked at the gloves. The box. The worn cloth tape across its lid. He slipped on the gloves. Broke the seal. The faint scent of old paper escaped into the room." },
  { p: "Inside — hundreds of carefully labeled folders. The first sat alone." },
  { p: "Folder 001. Beneath it rested a single preservation sheet: the following correspondence has been reproduced exactly as recovered, no interpretive additions have been made." },
  { p: "He turned the page." },
  { em: "11 June 2024, 5:46 AM" },
  { p: "🧁: Good morning." },
  { p: "Nothing happened. No music. No revelation. No explanation for why two hundred thousand messages had crossed centuries to arrive on this table." },
  { p: "Only a greeting. Ordinary enough that it would have vanished from almost anyone else's life forever." },
  { p: "He turned the page. The correspondence continued." },
  { em: "12 June 2024, 9:33 PM" },
  { p: "🧁: It's okay. If I was there with my arms around you, everything would be okay. We can agree on that. No more seeing things." },
  { p: "🐧: Yes! I'd be falling asleep in your arms and so happy 🥰" },
  { p: "🐧: Ok I better go to sleep. Brad... you make me think and want you all the time!!!!" },
  { p: "🧁: I would be too 😊" },
  { p: "🧁: Yes. Sleep time. I'll think of good things tonight about you. Goodnight Penny 😘 see you very soon:)" },
  { p: "🐧: Goodnight Brad 😘" },
  { em: "13 June 2024, 5:35 AM" },
  { p: "🧁: Good morning! Still on schedule." },
  { p: "🐧: Morning 😊" },
  { em: "Cataloger's Note, Folder 001" },
  { p: "The recovered correspondence begins mid-conversation. No introduction. No context establishing the participants' names, circumstances, or relationship to one another." },
  { p: "This is consistent with nearly every archive of its kind. People rarely announce themselves at the start of an ordinary day. They simply continue being who they already are." },
  { p: "There is no plot yet in this folder. No confession, no obvious turning point — just two people ending one day and beginning the next, the way anyone might. But underneath the ordinary parts, something else is already visible: an ease with each other that reads, even this early, like habit rather than novelty. A goodnight repeated on both sides. A morning greeting that already assumes the other person will be there to receive it." },
  { p: "This is, in the end, what the archive actually preserves. Not the milestones. The mornings between them." },
  { h: "FOLDER 002: TINY RITUALS" },
  { em: "7 May 2024" },
  { p: "The apprentice notices the emoji before he notices anything else about this folder — a small heart-hands symbol, dropped into an ordinary goodnight, four days into the whole record. It isn't the first time either of them has said goodnight. It's the first time one of them has said it with a symbol instead of a word, and the other has answered in kind." },
  { p: "🧁: Well just lay your head down and think exactly how you wanna be fucked and tomorrow you can tell me in person?!" },
  { p: "🐧: Haha mmm that sounds fun. You too?" },
  { p: "🧁: That's going to put me in a good sleep and I will tell you tomorrow!" },
  { p: "🐧: 🫶🏻 love it. Goodnight!" },
  { p: "🧁: Goodnight! Think hard:)" },
  { p: "The next morning, ordinary again — a warm day, an episode of a reality show watched instead of work, a question about whether the girls on the show use the word \"sexy\" the way the guys do. Nothing about it announces itself as a beginning. But the apprentice has read enough of this archive by now to know what a ritual looks like in its first days: small, repeatable, and already being noticed by both of them at once." },
  { p: "🐧: Cole and Zanab are fun! Do the girls say sexy also? Just guys?" },
  { p: "🧁: They are fun! Sorta neat being in DFW area also. Yes yes. Good point. I don't think it's odd being called sexy, as a guy... But you're saying you haven't heard any girls on the show using it?" },
  { p: "🧁: I will be sweaty:) Lol that pinned message." },
  { p: "The apprentice sets the folder down. Whatever this symbol becomes later in the record — and he has seen enough of the archive's index to know it becomes a great deal — it starts here, small and half-joking, in a text about a reality show and a warm morning." },
  { h: "FOLDER 003: LEARNING A VOICE" },
  { em: "26 May 2024" },
  { p: "This folder is short, and the apprentice almost misclassifies it as filler — a conversation about voice messages, nothing more. Then he reads what they actually build inside it: not just a new way of talking, but the sketch of an alibi, floated together in under fifteen minutes." },
  { p: "🐧: I have thought about sending you voice messages. Could say a lot more." },
  { p: "🧁: Only you and me will know you have this." },
  { p: "Then, a new idea, offered almost shyly, the way people offer something they've clearly been turning over privately before saying it out loud." },
  { p: "🐧: So we each need to make a new friend. Let's say Jordan, Taylor, Alex. Someone that sounds like a guy when you talk about said friend and sounds like a girl when I do. This can be our Ricky Stanicky in a way. Except we are that person for each other. So you start hanging out with Alex all the time. I start hanging out with Alex all the time. But it's really each other." },
  { p: "🧁: You have mentioned it! But not like the full thought like this. Post needing a cover I don't think! Do we have to make them a fake Facebook account and have them like all the things we would do together?! I'm honestly in. So my Alex is a buddy I play disc golf with, some pickleball? Sport stuff. Maybe a blue collar guy. Maybe a bit younger than me? So I can sound excited when talking about him." },
  { p: "The apprentice reads that last exchange twice — an entire invented person, built out loud, with a personality and a rough age and a set of hobbies, in the space of one conversation. Whether \"Alex\" ever actually gets used again is a question for a later folder. What's here is only the invention itself: two people building a cover story with the same easy collaboration they'd later use to build almost everything else." },
  { h: "FOLDER 004: COVER STORIES" },
  { em: "13 June 2024" },
  { p: "Six weeks in, and this folder shows planning happening in real time — not a code already fluent, but two people actually building an excuse together, testing it before either commits to it." },
  { p: "🧁: Can you go to Plano on Saturday to help Miranda \"move.\" Something like that? I know I'll be able to do something." },
  { p: "🐧: Oh yeah I'm definitely thinking on this!!" },
  { p: "🐧: I don't know how likely but I'd like it and am contemplating" },
  { p: "🧁: Okay so Saturday helping a friend? That's a slight possibility for you? I think we can come up with something." },
  { p: "🧁: Just have to maybe mention it tomorrow." },
  { p: "It isn't settled yet. What follows is the actual negotiation — not the cover story itself, but the logistics underneath it, worked out with the same care they'd use for anything real." },
  { p: "🧁: Umm I say early just cause it was a first thought but yeah like 8 or something?" },
  { p: "🐧: Hmm likely difficult but I'm thinking" },
  { p: "🧁: But Saturday in general the later it gets the more tricky it would be for me. Technically. For whatever reason." },
  { p: "🐧: Somewhat opposite for me. But this leaving thing is new for me, so I'm thinking..." },
  { p: "🧁: Well you can think of any time. It just seems like anything before 2pm — why 2pm? I don't know. Is like just easier. But I'm interested in anything obviously. I want to be with you..." },
  { p: "🐧: I want to be with you" },
  { p: "The apprentice notes what this folder actually preserves, more than the excuse itself: the care taken over it. A real name — Miranda — borrowed for the story, a real worry about whether she'd \"talk and spill the truth eventually,\" a real back-and-forth about which hours were safest. Nothing about it is glamorous or clever. It reads like two people doing math, carefully, because getting the math wrong would cost more than either of them could afford." },
  { h: "FOLDER 005: SLEEPYHEAD THOUGHTS" },
  { em: "14 May 2024" },
  { p: "The apprentice likes this folder more than he expects to. It doesn't turn on anything dramatic — a private nickname is all it is, born out of exhaustion and a half-remembered book title." },
  { p: "🐧: Have I said anything lately that's as evident how tired I am? Oh we should add that to the timeline. The first sleepyhead." },
  { p: "🐧: Lol I wondered if I had not said that to you like I thought I might have. That's what I called the red Bible from Ricky Stanicky." },
  { p: "🧁: Haha oh yeah! No I totally forgot that reference! Yep. Just had to throw it out there!" },
  { p: "By morning it's already become a fixture — a small, affectionate label attached to a version of Penny that only exists in this correspondence, tired and honest at 5:38 AM in a way she might not let herself be anywhere else." },
  { p: "🧁: Sleepy head!" },
  { p: "🐧: Hey!" },
  { p: "🧁: I do like the sleepy head on timeline:)" },
  { p: "The apprentice notes the timeline reference — a document he has already read in full, pinned three separate times, a record Penny apparently kept of her own life before any of this correspondence began. \"Sleepyhead\" earns its own line in it. Whatever this record eventually becomes, it seems to have always been, on some level, self-aware of its own archiving — building its own index of firsts as it went, long before anyone from the Initiative arrived to do the same work centuries later." },
  { h: "PART II — FAMILIARITY" },
  { h: "FOLDER 007: CLOSE CALLS" },
  { em: "18 May 2024" },
  { p: "Nothing happens in this folder, and the apprentice suspects that's exactly why it's here. A text sent, apparently, while Brad was in a church service, and Penny didn't know it." },
  { p: "🐧: I texted you while you were in the chapel service?! Was I?! lol This was before 🖕🏻" },
  { p: "🧁: Not to the new stadium no! Haha the text was before 🖕🏻!" },
  { p: "🐧: lol I probably didn't realize you were in service. Sorry 😬 haha" },
  { p: "🧁: Hhaha oh I was so happy! Don't even worry." },
  { p: "By that night, a basketball game, a \"close call\" of an entirely different kind, and a goodnight that reads, on its surface, like nothing at all." },
  { p: "🐧: Goodnight Brad! See you in the morning..." },
  { p: "🧁: Yes Goodnight Penny! See you/not talk to you very soon😊" },
  { p: "By late morning, the two of them comparing notes on a public moment — apparently a passing encounter somewhere neither could fully account for afterward, each one keeping score of who said more to whom." },
  { p: "🧁: How did it go?" },
  { p: "🐧: More than 3 words! In fact I think you said more to me than I said to you 😊 haha" },
  { p: "🧁: Haha that's a good point! I think you are right. I didn't walk in front of you though! Had to go behind. That was strategic." },
  { p: "The apprentice reads that word — strategic — and understands, more clearly than in almost any folder before it, exactly what this record is going to keep documenting for the next twenty months: the choreography of two people trying to occupy the same public spaces without appearing to notice each other, and mostly succeeding, except to each other." },
  { h: "FOLDER 008: 2:45 AM" },
  { em: "19 July 2024" },
  { p: "A goodnight, and then — hours later, in the middle of the night — Brad is awake again, and says so." },
  { p: "🧁: Awake for now! did dream of you" },
  { p: "🐧: Good? I literally just woke up! How is that possible?" },
  { p: "🧁: Really... that is sorta crazy!" },
  { p: "He tells her the dream wasn't a good one, not exactly — she'd left, in it, the way he'd apparently been warned she might, and the leaving had caught him off guard anyway." },
  { p: "🧁: Yeah I didn't realize it was a dream, I think we were hanging out and then you had to leave and I was surprised but technically you had warned me about this happening and I shouldn't have been surprised!" },
  { p: "🐧: Hmm so the hanging out part was good? I don't remember any dreams right now." },
  { p: "🧁: Ehh it sorta only started when you had to leave lol" },
  { p: "🐧: Awe no fun" },
  { p: "🧁: Yeah it's becoming less fun as I start to say it! It's okay — look how it turned out. Woke up and caught you for a second!" },
  { p: "The apprentice sits with the timestamp a moment — 2:45 in the morning, two people awake at the same improbable minute, checking the clock twice to be sure it was real. Whatever it was, it resolves the way most of the archive's smaller nights do: not into anything solved, just into two people, awake together by accident, glad of it anyway." },
  { h: "FOLDER 010: THE UNSUCCESSFUL ATTEMPT" },
  { em: "5 May 2024" },
  { p: "This folder arrives already mid-conversation, and the apprentice can only reconstruct its shape from what survives — an evening that apparently didn't go the way either of them hoped, and Brad, afterward, working hard to make sure Penny doesn't take it personally." },
  { p: "🐧: Ok 😊 I think that's good. Well that's all the questions I can think of for now! Haha" },
  { p: "🧁: Hahaha ?" },
  { p: "🧁: Yeah if you're thinking the unsuccessful attempt haha had even the slightest bit to do with you. That's not it at all. You made me want it more." },
  { p: "🐧: Umm yeah a least a little thoughts on that" },
  { p: "The apprentice notes how little either of them needs to say for the other to understand exactly what's being reassured. The record doesn't explain the attempt itself, or what made it unsuccessful. It only preserves the aftermath — one small, plainly stated correction, offered before it was even fully asked for." },
  { h: "FOLDER 011: NEVER ENOUGH TIME" },
  { em: "18 May 2024" },
  { p: "The apprentice reads this one slowly. It opens with something that could have been nothing — a bad dream, mentioned in passing, about \"mostly just getting caught\" — and then moves, without any transition at all, into one of the longest, most unhurried mornings in the record so far." },
  { p: "🐧: It's Nora's bday so breakfast with bibi and boppa and dinner tonight. Then watching the mavs!! Haha oh my gosh. I did have a bad dream last night about that sort of just mostly getting caught." },
  { p: "🧁: !! That is a bad dream! I sorta want to hear about it but also don't..." },
  { p: "He tells her, later, what he'd actually meant by an earlier message she'd worried over — not a warning, but the opposite of one." },
  { p: "🧁: It was a reaction to you saying you had to go — and then you said two things I didn't know about — it was just that would be taking up a good portion of your night and I actually felt like uh oh maybe she's not gonna talk to me. So don't feel bad, I'm gonna talk to you. I was actually implying the opposite and that I hope to talk to you!" },
  { p: "The morning drifts, the way their mornings do, into the day before — a massage, a memory of being held, each of them trying to recall exactly what the other had liked and said." },
  { p: "🧁: We did not discuss time and Magnolia sounds perfect and wonderful. Yes, when you wrapped your legs around me when I was on top. That surprised me enough in a good way:) but yesterday I can say that the whole time did just feel like a larger moment all mixed together and that was absolutely wonderful." },
  { p: "🐧: I definitely like hearing you like my body. 🥰 obviously it is just nice to hear but also I think it does make me feel even more comfortable. It's very umm just in the moment. 🫶🏻 Like the moment is great and I want it to last. Right then. And long term." },
  { p: "By the title's own line — never enough time, fully — the apprentice recognizes something the folder is naming plainly for the first time, though he's felt it building across every folder before it: not a lack of feeling, but a chronic shortage of the one resource this correspondence can't manufacture more of. They will spend the next twenty months solving, replanning, and mourning that shortage, in almost every folder that follows." },
  { h: "FOLDER 012: I NEED YOU" },
  { em: "11 May 2024" },
  { p: "A Saturday, unplanned work, and Penny nearby enough that proximity itself becomes the whole conversation." },
  { p: "🐧: So close to me!!! I need you here now. Good?!?" },
  { p: "🧁: Lol I want to be there now! 6 hour's?!" },
  { p: "🐧: He watched them all morning so I could work out and get ready and be there before 10 and I'm not even home yet... 😬 Probably a good thing you don't want to see me. It would have been even longer." },
  { p: "They circle back, later, to something from an earlier visit — an office, a lack of privacy, and an honest accounting of what each of them actually wanted from the other in that hour." },
  { p: "🐧: I did have fun riding the other day. And my office was nice as well though I'm sorry I didn't feel comfortable enough for more. I did really like you telling me what you liked or wanted." },
  { p: "🧁: I was perfectly fine with the office as well. I understand about you not feeling comfortable! Yeah I just want to also make sure you are also getting the most pleasure as well... ya know?" },
  { p: "🐧: Yeah thank you ☺️ Just don't know what to say... or maybe how to..." },
  { p: "The apprentice notices, not for the first time, how carefully this record tracks something most correspondence would never bother writing down at all — not just what happened, but whether it felt good, for both of them, and whether either one is comfortable enough yet to say so plainly." },
  { p: "This folder gives the phrase its name, but it doesn't come close to holding all of it. \"I need you\" appears 234 times across the full archive, from both of them, in every register the record has — urgent, tender, exhausted, plain." },
  { p: "🐧: I need you to hold me babe" },
  { p: "🧁: I need you. Just realized again." },
  { p: "🧁: I need you and I want you to need me!" },
  { p: "🐧: You are so important to me. I need you ok to be ok." },
  { p: "🐧: I need you forever" },
  { p: "🧁: 🐧... I need you. I can't not have you in my life." },
  { p: "The folder ends the way many of them do, on an unrelated jealousy — Marcus, apparently, going to a basketball game Penny wanted to attend herself." },
  { h: "PART III — MOMENTUM" },
  { h: "FOLDER 013: JEALOUSY" },
  { em: "1 July 2024" },
  { p: "A list, apparently — seventy-five questions, sexual and otherwise, that Penny didn't write herself but is passing along anyway. Brad picks one." },
  { p: "🐧: The other list is ALL sexual. But I did not come up with those 75 questions. Want one of those?" },
  { p: "🧁: Right! Your good! One sexual please and thank you." },
  { p: "🐧: Which number?" },
  { p: "🧁: I can get jealous... ☹️ I like you. I think one was more of a joke but the last 3 days I'd say really had me worried to be honest. So I thought way too much. Number 68." },
  { p: "Whatever question 68 turns out to be, the apprentice notes that Brad's admission arrives folded inside the joke, almost hidden by it — three real days of worry, confessed in the same breath as a question about a favorite word. He asks to answer in person instead of by text, so he can watch her reaction to whatever it is he's about to admit." },
  { p: "🧁: And the note is embarrassing! I really want to show you in person so you can see my reaction because I think it would be a fun moment! And so I can see your reaction." },
  { p: "The apprentice notes this as a small, recurring pattern worth flagging for later folders — jealousy, in this record, rarely gets its own conversation. It tends to arrive as a postscript to something else, admitted almost accidentally, and just as quickly folded back into a joke." },
  { h: "FOLDER 014: GUILT" },

  { p: "Twenty-nine folders in, and the record so far has covered less than two months — May and June of 2024, mostly, with a handful of entries reaching just into July. Two hundred thousand messages wait in the boxes still unopened on the shelf behind him, and by his own rough count, what he has read represents perhaps one-twentieth of the whole. At this pace, he thinks, he will be an old man before he reaches January of 2026." },
  { p: "She has been trained not to read an archive front to back, in strict chronological order, the way a person reads a novel. Correspondence doesn't work that way, and neither does memory. The Initiative teaches its apprentices to follow subject, not sequence — to let one folder's theme pull the next folder toward it, regardless of the calendar, and to trust that the shape of a life will eventually assert itself even when the pages are shuffled." },
  { p: "It mostly works. But he notices, sitting with the gap in front of him, that something particular happens to a correspondence like this one over ten months that doesn't happen over two. The people in Folders 001 through 029 are, unmistakably, near the beginning of something — still learning each other's rhythms, still finding out which jokes land and which references need explaining twice. Cover stories are still being invented from scratch. A hidden nickname for a boyfriend still needs to be assigned. An entire fictional friend named Alex is workshopped, tested, and — as far as the apprentice can tell from the parts of the record he's read so far — never mentioned again." },
  { p: "What she knows is waiting for her, further down the shelf, is not more of that. It's an anniversary, self-declared, in a private word neither of them will translate for the reader. It's a fight that begins over exactly when someone stopped replying to a text and doesn't fully resolve for hours. It's two people, independently, in the same truck, each nearly saying a word the other still hasn't heard plainly in eleven months of trying. It's a whole imagined life, complete with a child's name, that neither of them mentions again after the night they built it." },
  { p: "The apprentice doesn't know yet what happened in the months between — the back half of 2024, the first quarter of 2025 — because he hasn't read them closely enough to say. He suspects, from what he's already seen, that nothing especially dramatic happened there. Just more of the same slow accumulation: more evenings, more logistics, more small rituals hardening into habits hardening into a private language nobody outside Reading Room D will ever fully translate." },

  { p: "This one starts badly. Before six in the morning, Penny is awake and apologizing for something she doesn't think she did — a goodnight that landed wrong, a silence that read as sadness when it was only sleep. Brad writes that he lost sleep over it too. Neither of them seems especially sure what the argument was, only that there was one, and that it needs to be repaired before either of them can move on to the rest of the day. The apprentice has read enough of these now to recognize the shape without needing the specifics. Something small happens. Something small is repaired. The repair takes longer than the small thing did." },
  { p: "By mid-morning the trouble has passed, and what's left in its place is logistics — the particular, exhausting arithmetic of two people trying to be alone together inside two entire households that are watching, or might be. There's a plumber texting Brad's mother-in-law's texts. There's a coworker named Sam whose comings and goings from an office become, for one stretch of the file, the single most important variable in the day. There's a sentence — <em>I can drop off an adderall. I can also wear a mask so you don't know it's me at your office?</em> — that reads, out of context, like the setup to a joke, and the apprentice has to remind himself it wasn't one, not really, or not only." },
